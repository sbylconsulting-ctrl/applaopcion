async function handleSaveShow(){
  if(SAVE_LOCK||S.isSaving)return showToast('Ya se está guardando. Espera.','warn');
  const d=S.newShowDraft;
  if(!d)          {render();return showToast('Rellena el formulario','error');}
  if(!d.workId)   {render();return showToast('Selecciona una obra','error');}
  if(!d.venueId)  {render();return showToast('Selecciona una sala','error');}
  if(!d.date)     {render();return showToast('Introduce una fecha','error');}

  const work=S.config.works.find(w=>w.id===d.workId);
  const venue=S.config.venues.find(v=>v.id===d.venueId);
  const legacyAgreement=d.agreementId?getLegacyAgreementById(S.config,d.agreementId):null;
  const resolvedAgreement=resolveAgreementForWork(work,S.config,legacyAgreement);

  const income={};
  S.config.platforms.forEach(p=>{income[p.id]=parseFloat(d.income?.[p.id])||0;});
  income.cashBox=parseFloat(d.income?.cashBox)||0;
  income.cardBox=parseFloat(d.income?.cardBox)||0;

  if(Object.values(income).some(v=>v<0)){render();return showToast('No se admiten importes negativos','error');}

  const autorPct   = Math.max(0, parseFloat(String(d.autorPct    ?? 0)) || 0);
  const autorOwner = normalizeAutorOwner(d.autorOwner||'both');
  const otrosGastos= Math.max(0, parseFloat(String(d.otrosGastos ?? 0)) || 0);
  const expenseOwner=normalizeExpenseOwner(d.expenseOwner||'both');
  const venueRental= Number(venue?.alquiler || 0);

  // Si es edición, mantiene el appId existente; si es nuevo, genera uno
  const appId=d.appId||gid('s');
  d.appId=appId;

  const show={
    id:appId, appId,
    workId:d.workId, venueId:d.venueId,
    workName:work?.name||'', venueName:venue?.name||'',
    date:d.date, time:d.time||'',
    agreementId:resolvedAgreement.id,
    agreementSnapshot:resolvedAgreement.snapshot,
    notes:d.notes||'',
    income, platformSnapshots:{},
    autorPct, autorOwner, otrosGastos, expenseOwner, venueRental,
    status:{}
  };

  S.config.platforms.forEach(p=>{
    show.platformSnapshots[p.id]={name:p.name,commission:p.commission,ivaOnCommission:p.ivaOnCommission,income:income[p.id]||0};
  });

  await saveShowToSheet(show);
}

// FACTURACIÓN DE BARRA
// Estado independiente: nunca se mezcla con S.shows ni sus filtros.
// ══════════════════════════════════════════════════════════════
const B={records:[],methods:[],originalMethods:[],loaded:false,loading:false,error:'',draft:null,methodDraft:null,filters:{month:'',from:'',to:'',weekday:'',venueId:''},generation:0};
function resetBars(){
  B.generation++;B.records=[];B.methods=[];B.originalMethods=[];B.loaded=false;B.loading=false;B.error='';B.draft=null;B.methodDraft=null;B.filters={month:'',from:'',to:'',weekday:'',venueId:''};
}
async function loadBars(force=false){
  if(B.loading||(!force&&B.loaded)) return;
  const generation=B.generation;
  B.loading=true;B.error='';render();
  try{
    const data=await apiPost({action:'getBarData'});
    if(generation!==B.generation) return;
    if(!Array.isArray(data.records)||!Array.isArray(data.methods)) throw new Error('Actualiza la implementación de Apps Script para activar Facturación barra.');
    B.records=data.records;B.methods=data.methods;B.originalMethods=JSON.parse(JSON.stringify(data.methods));B.loaded=true;
    if(!B.methodDraft) B.methodDraft=JSON.parse(JSON.stringify(data.methods));
  }catch(err){if(generation===B.generation) B.error=err.message;}
  finally{if(generation===B.generation){B.loading=false;render();}}
}
function emptyBarDraft(){return {id:gid('bar'),version:0,venueId:'',date:'',payments:[]};}
function barDraftMethods(){
  const d=B.draft||emptyBarDraft();
  return B.methods.filter(m=>m.active!==false||d.payments.some(p=>p.id===m.id)).map(m=>({...m,name:d.payments.find(p=>p.id===m.id)?.name||m.name}));
}
function filteredBars(){
  const f=B.filters;
  return B.records.filter(r=>(!f.month||r.date.startsWith(f.month))&&(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to)&&matchesWeekday(r.date,f.weekday)&&(!f.venueId||r.venueId===f.venueId)).sort((a,b)=>b.date.localeCompare(a.date)||a.venueName.localeCompare(b.venueName));
}
function barSummary(records){
  const days=new Map(),venues=new Map(),methods=new Map();let totalCents=0;
  const weekdays=WEEKDAYS.map(()=>({n:0,cents:0}));
  records.forEach(r=>{
    const wi=weekdayIndexFromDate(r.date);
    if(wi>=0){weekdays[wi].n+=1;weekdays[wi].cents+=Math.round(r.total*100);}
    const cents=Math.round(r.total*100);totalCents+=cents;
    days.set(r.date,(days.get(r.date)||0)+cents);
    const v=venues.get(r.venueId)||{name:r.venueName,cents:0};v.cents+=cents;venues.set(r.venueId,v);
    r.payments.forEach(p=>{const m=methods.get(p.id)||{name:B.methods.find(x=>x.id===p.id)?.name||p.name,cents:0};m.cents+=Math.round(p.amount*100);methods.set(p.id,m);});
  });
  return {weekdays,total:totalCents/100,days:[...days].sort(([a],[b])=>a.localeCompare(b)).map(([name,cents])=>[name,cents/100]),venues:[...venues.values()].sort((a,b)=>b.cents-a.cents).map(v=>[v.name,v.cents/100]),methods:[...methods.values()].sort((a,b)=>b.cents-a.cents).map(m=>[m.name,m.cents/100])};
}
function barLoadNotice(){
  if(B.loading) return '<div class="card mb20"><p>Cargando facturación de barra…</p></div>';
  if(B.error) return `<div class="card mb20"><p class="danger">${esc(B.error)}</p><button class="btn btn-secondary" data-bar-action="reload">Reintentar</button></div>`;
  return '';
}
function barFiltersHtml(){
  const f=B.filters,months=[...new Set(B.records.map(r=>r.date.slice(0,7)))].sort().reverse();
  const venues=new Map((S.config.venues||[]).map(v=>[v.id,v.name]));B.records.forEach(r=>{if(!venues.has(r.venueId))venues.set(r.venueId,r.venueName);});
  return `<div class="card mb20"><div class="dashboard-filters">
    <div class="field"><label>Mes</label><select data-bar-filter="month"><option value="">Todos</option>${months.map(m=>`<option value="${esc(m)}" ${f.month===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
    <div class="field"><label>Sala</label><select data-bar-filter="venueId"><option value="">Todas</option>${[...venues].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>`<option value="${esc(id)}" ${f.venueId===id?'selected':''}>${esc(name)}</option>`).join('')}</select></div>
    <div class="field"><label>Desde</label><input type="date" data-bar-filter="from" value="${esc(f.from)}"/></div>
    <div class="field"><label>Hasta</label><input type="date" data-bar-filter="to" value="${esc(f.to)}"/></div>

function renderBarDashboard(){

    <div class="grid grid-kpis mb20"><div class="card"><div class="kpi-label">Total facturado</div><div class="kpi-value cyan">${fmt(summary.total)}</div></div><div class="card"><div class="kpi-label">Registros</div><div class="kpi-value">${records.length}</div></div><div class="card"><div class="kpi-label">Días con registros</div><div class="kpi-value">${summary.days.length}</div></div><div class="card"><div class="kpi-label">Media por día registrado</div><div class="kpi-value purple">${fmt(summary.days.length?summary.total/summary.days.length:0)}</div></div></div>

    <div class="card mb20"><h3>Facturación por día</h3><div class="table-wrap"><table><thead><tr><th>Fecha</th><th class="right">Facturado</th></tr></thead><tbody>${summary.days.map(([date,total])=>`<tr><td>${esc(date)}</td><td class="right cyan fw700">${fmt(total)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Sin registros con estos filtros</td></tr>'}</tbody><tfoot><tr><th>Total</th><th class="right">${fmt(summary.total)}</th></tr></tfoot></table></div></div>${barRecordsHtml(records)}`}`;

function renderBarMethods(){
  const methods=B.methodDraft||[];
  return `${barLoadNotice()}${!B.loaded?'':`<div class="grid grid-2"><div class="card"><h3>Añadir método de pago de barra</h3><div class="field"><label>Nombre</label><input id="bar-method-name" maxlength="100" placeholder="Por ejemplo, Bizum"/></div><button class="btn btn-primary" data-bar-action="addMethod">Añadir método</button><p class="dim mt10">Después pulsa «Guardar métodos».</p></div><div class="card"><h3>Métodos de pago de barra</h3><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Activo</th></tr></thead><tbody>${methods.map(m=>`<tr><td><input class="inline-input" maxlength="100" data-bar-method-name="${esc(m.id)}" value="${esc(m.name)}"/></td><td><input type="checkbox" data-bar-method-active="${esc(m.id)}" ${m.active!==false?'checked':''}/></td></tr>`).join('')}</tbody></table></div><p class="dim mt10">Desactiva un método para dejar de usarlo en nuevos registros. Los ingresos anteriores se conservan.</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" data-bar-action="saveMethods">Guardar métodos</button><button class="btn btn-secondary" data-bar-action="reloadMethods">Descartar cambios y recargar</button></div></div></div>`}`;
}
async function saveBarForm(){
  if(S.isSaving||!B.draft)return;
  const d=B.draft;
  const payments=barDraftMethods().map(m=>({id:m.id,amount:Number(d.payments.find(p=>p.id===m.id)?.amount||0)}));
  if(!d.venueId||!d.date) return showToast('Selecciona sala y fecha.','error');
  if(payments.some(p=>!Number.isFinite(p.amount)||p.amount<0))return showToast('Revisa los importes.','error');
  S.isSaving=true;render();
  try{
    const data=await apiPost({action:'saveBarRecord',id:d.id,version:d.version,venueId:d.venueId,date:d.date,payments});
    if(!data.record)throw new Error('El servidor no ha confirmado el registro. Actualiza Apps Script.');
    B.records=B.records.filter(r=>r.id!==data.record.id);B.records.push(data.record);
    B.draft=emptyBarDraft();showToast('Ingreso de barra guardado.','success');
  }catch(err){showToast(err.message,'error');}
  finally{S.isSaving=false;render();}
}
async function deleteBarEntry(id){
  if(S.isSaving||S.role!=='admin')return;
  const record=B.records.find(r=>r.id===id);if(!record)return;
  if(!window.confirm(`¿Eliminar el ingreso de barra de ${record.venueName}, ${record.date}, por ${fmt(record.total)}?`))return;
  S.isSaving=true;render();
  try{await apiPost({action:'deleteBarRecord',id,version:record.version});B.records=B.records.filter(r=>r.id!==id);if(B.draft?.id===id)B.draft=emptyBarDraft();showToast('Ingreso eliminado.','success');}
  catch(err){showToast(err.message,'error');}
  finally{S.isSaving=false;render();}
}
async function saveBarMethods(){
  if(S.isSaving||S.role!=='admin')return;
  S.isSaving=true;render();
  try{
    const data=await apiPost({action:'saveBarMethods',methods:B.methodDraft,originalMethods:B.originalMethods});
    if(!Array.isArray(data.methods))throw new Error('Actualiza Apps Script para guardar métodos de barra.');
    B.methods=data.methods;B.originalMethods=JSON.parse(JSON.stringify(data.methods));B.methodDraft=JSON.parse(JSON.stringify(data.methods));showToast('Métodos de barra guardados.','success');
  }catch(err){showToast(err.message,'error');}
  finally{S.isSaving=false;render();}
}
function bindBarEvents(){
  const form=document.getElementById('bar-form');if(form)form.onsubmit=e=>{e.preventDefault();saveBarForm();};
  document.querySelectorAll('[data-bar-field]').forEach(el=>{el.onchange=()=>{if(B.draft)B.draft[el.dataset.barField]=el.value;};});
  document.querySelectorAll('[data-bar-payment]').forEach(el=>{el.oninput=()=>{
    if(!B.draft)return;
    const id=el.dataset.barPayment;let p=B.draft.payments.find(x=>x.id===id);
    if(!p){p={id,amount:'',name:B.methods.find(m=>m.id===id)?.name||id};B.draft.payments.push(p);}p.amount=el.value;
    const total=document.getElementById('bar-draft-total');if(total)total.textContent=fmt(B.draft.payments.reduce((a,x)=>a+(Number(x.amount)||0),0));
  };});
  document.querySelectorAll('[data-bar-weekday]').forEach(el=>{el.onchange=()=>{
    if(!B.draft||!B.draft.date)return;
    const nueva=shiftDateToWeekday(B.draft.date,el.value);
    if(nueva!==B.draft.date){B.draft.date=nueva;showToast(`Fecha ajustada a ${WEEKDAYS[Number(el.value)]} ${nueva}`,'warn');}
    render();
  };});
  document.querySelectorAll('[data-bar-filter]').forEach(el=>{el.onchange=()=>{B.filters[el.dataset.barFilter]=el.value;render();};});
  document.querySelectorAll('[data-bar-method-name]').forEach(el=>{el.oninput=()=>{B.methodDraft.find(m=>m.id===el.dataset.barMethodName).name=el.value;};});
  document.querySelectorAll('[data-bar-method-active]').forEach(el=>{el.onchange=()=>{B.methodDraft.find(m=>m.id===el.dataset.barMethodActive).active=el.checked;};});
  document.querySelectorAll('[data-bar-action]').forEach(el=>{el.onclick=()=>{
    if(S.isSaving)return;
    const action=el.dataset.barAction;
    if(action==='reload')return loadBars(true);
    if(action==='reloadMethods'){B.methodDraft=null;return loadBars(true);}
    if(action==='saveMethods')return saveBarMethods();
    if(action==='addMethod'){
      const name=document.getElementById('bar-method-name')?.value.trim();if(!name)return showToast('Introduce el nombre del método.','error');
      if(B.methodDraft.some(m=>normalize(m.name)===normalize(name)))return showToast('Ese método ya existe.','error');
      B.methodDraft.push({id:gid('bm'),name,active:true});return render();
    }
    if(action==='new'){B.draft=emptyBarDraft();return render();}
    if(action==='clearFilters'){B.filters={month:'',from:'',to:'',weekday:'',venueId:''};return render();}
    if(action==='delete')return deleteBarEntry(el.dataset.barId);
    if(action==='edit'){
      const record=B.records.find(r=>r.id===el.dataset.barId);if(!record)return;
      B.draft=JSON.parse(JSON.stringify(record));S.view='barBilling';render();window.scrollTo(0,0);
    }
  };});
}

const MONTH_NAMES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function currentBusinessPeriod(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
const E={records:[],types:[],originalTypes:[],typeDraft:null,draft:null,loaded:false,loading:false,error:'',generation:0,filters:{year:currentBusinessPeriod().slice(0,4),month:currentBusinessPeriod().slice(5),venueId:'',typeId:''}};
function resetBusiness(){
  E.generation++;E.records=[];E.types=[];E.originalTypes=[];E.typeDraft=null;E.draft=null;E.loaded=false;E.loading=false;E.error='';E.filters={year:currentBusinessPeriod().slice(0,4),month:currentBusinessPeriod().slice(5),venueId:'',typeId:''};
  N.generation++;N.loaded=false;N.loading=false;N.error='';N.snapshot=null;N.filters={year:currentBusinessPeriod().slice(0,4),month:currentBusinessPeriod().slice(5),weekday:'',venueId:'',basis:'benefit'};
}
function invalidateBusiness(action){
  if(['saveShow','deleteShow','saveConfig','saveBarRecord','deleteBarRecord','saveBusinessExpense','deleteBusinessExpense','saveBusinessTypes'].includes(action))N.loaded=false;
}
async function loadExpenses(force=false){
  if(E.loading||E.loaded&&!force)return;
  const generation=E.generation;E.loading=true;E.error='';render();
  try{
    const data=await apiPost({action:'getBusinessExpenses'});
    if(generation!==E.generation)return;
    if(!Array.isArray(data.records)||!Array.isArray(data.types))throw new Error('Actualiza la implementación de Apps Script para activar los gastos.');
    E.records=data.records;E.types=data.types;E.originalTypes=JSON.parse(JSON.stringify(data.types));if(!E.typeDraft)E.typeDraft=JSON.parse(JSON.stringify(data.types));E.loaded=true;
  }catch(err){if(generation===E.generation)E.error=err.message;}
  finally{if(generation===E.generation){E.loading=false;render();}}
}
function emptyExpenseDraft(){return {id:gid('ex'),version:0,period:currentBusinessPeriod(),venueId:'',typeId:'',concept:'',amount:''};}
function periodName(year,month){return month?`${MONTH_NAMES[Number(month)-1]} ${year}`:`Año ${year}`;}
function businessYearOptions(year,periods){
  const now=new Date().getFullYear(),years=new Set([String(year),String(now-1),String(now),String(now+1)]);
  periods.forEach(p=>{if(/^\d{4}/.test(p))years.add(p.slice(0,4));});
  return [...years].sort().reverse().map(y=>`<option value="${esc(y)}" ${String(year)===y?'selected':''}>${esc(y)}</option>`).join('');
}
function businessMonthOptions(month,all=true){return `${all?`<option value="" ${!month?'selected':''}>Todo el año</option>`:''}${MONTH_NAMES.map((name,i)=>{const value=String(i+1).padStart(2,'0');return `<option value="${value}" ${value===month?'selected':''}>${name}</option>`;}).join('')}`;}
function expenseNotice(){return E.loading?'<div class="card mb20">Cargando gastos…</div>':E.error?`<div class="card mb20"><p class="danger">${esc(E.error)}</p><button class="btn btn-secondary mt10" data-expense-action="reload">Reintentar</button></div>`:'';}
function expensePeriodMatches(r,f){return r.period.slice(0,4)===f.year&&(!f.month||r.period.slice(5)===f.month);}
function filteredExpenses(){return E.records.filter(r=>expensePeriodMatches(r,E.filters)&&(!E.filters.typeId||r.typeId===E.filters.typeId)&&(!E.filters.venueId||(E.filters.venueId==='general'?!r.venueId:r.venueId===E.filters.venueId))).sort((a,b)=>b.period.localeCompare(a.period)||a.venueName.localeCompare(b.venueName));}
function expenseVenueOptions(selected,includeAll=false){
  const venues=new Map((S.config.venues||[]).map(v=>[v.id,v.name]));E.records.forEach(r=>{if(r.venueId&&!venues.has(r.venueId))venues.set(r.venueId,r.venueName);});
  return `${includeAll?'<option value="">Todas las salas y generales</option>':''}<option value="${includeAll?'general':''}" ${selected===(includeAll?'general':'')?'selected':''}>General · sin sala asignada</option>${[...venues].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>`<option value="${esc(id)}" ${selected===id?'selected':''}>${esc(name)}</option>`).join('')}`;
}
function renderExpenseEntry(){
  if(!E.draft)E.draft=emptyExpenseDraft();const d=E.draft,f=E.filters,records=filteredExpenses();
  const total=records.reduce((a,r)=>a+Math.round(r.amount*100),0)/100;
  const fullMonth=E.records.filter(r=>expensePeriodMatches(r,f)).reduce((a,r)=>a+Math.round(r.amount*100),0)/100;
  const byType=new Map();records.forEach(r=>{const t=byType.get(r.typeId)||{name:E.types.find(t=>t.id===r.typeId)?.name||r.typeName,cents:0};t.cents+=Math.round(r.amount*100);byType.set(r.typeId,t);});
  const types=E.types.filter(t=>t.active!==false||t.id===d.typeId);
  return `<div class="section-top"><div><h1 class="page-title">Gastos</h1><p class="page-sub">Personal, alquileres, proveedores y otros costes del negocio</p></div><button class="btn btn-secondary" data-expense-action="reload" ${E.loading?'disabled':''}>Actualizar gastos</button></div>${expenseNotice()}${!E.loaded?'':`
  <form id="expense-form"><div class="grid grid-2 mb20"><div class="card"><h3>${d.version?'Editar gasto':'Registrar gasto'}</h3><div class="grid grid-2"><div class="field"><label>Mes *</label><select data-expense-field="month">${businessMonthOptions(d.period.slice(5),false)}</select></div><div class="field"><label>Año *</label><input type="number" min="1900" max="2199" step="1" data-expense-field="year" required value="${esc(d.period.slice(0,4))}"/></div></div><div class="field"><label>Sala / gasto general</label><select data-expense-field="venueId">${expenseVenueOptions(d.venueId)}</select></div><p class="muted" style="font-size:12px">Los gastos generales se descuentan del resultado global. No se reparten automáticamente entre salas.</p></div>
  <div class="card"><div class="field"><label>Tipo de gasto *</label><select required data-expense-field="typeId"><option value="">— Seleccionar —</option>${types.map(t=>`<option value="${esc(t.id)}" ${d.typeId===t.id?'selected':''}>${esc(t.name)}${t.active===false?' (inactivo)':''}</option>`).join('')}</select></div><div class="field"><label>Concepto</label><input maxlength="240" data-expense-field="concept" placeholder="Por ejemplo, personal de septiembre" value="${esc(d.concept)}"/></div><div class="field"><label>Importe (€) *</label><input type="number" min="0.01" step="0.01" inputmode="decimal" required data-expense-field="amount" value="${esc(d.amount)}" placeholder="0,00"/></div><p class="muted" style="font-size:12px">Incluye aquí únicamente gastos que no estén ya descontados en las funciones. Por ejemplo, no repitas un alquiler ya registrado en una función.</p></div></div><div class="nb-actions mb20"><button type="submit" class="btn btn-primary" ${S.isSaving?'disabled':''}>${d.version?'Guardar cambios':'Guardar gasto'}</button><button type="button" class="btn btn-secondary" data-expense-action="new">${d.version?'Cancelar edición':'Limpiar formulario'}</button></div></form>
  <div class="card mb20"><h3>Consultar gastos</h3><div class="dashboard-filters"><div class="field"><label>Mes</label><select data-expense-filter="month">${businessMonthOptions(f.month)}</select></div><div class="field"><label>Año</label><select data-expense-filter="year">${businessYearOptions(f.year,E.records.map(r=>r.period))}</select></div><div class="field"><label>Sala</label><select data-expense-filter="venueId">${expenseVenueOptions(f.venueId,true)}</select></div><div class="field"><label>Tipo</label><select data-expense-filter="typeId"><option value="">Todos</option>${E.types.map(t=>`<option value="${esc(t.id)}" ${f.typeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div></div>
  <div class="grid grid-kpis mb20"><div class="card"><div class="kpi-label">Total del periodo · todas las salas</div><div class="kpi-value danger" id="expense-period-total">${fmt(fullMonth)}</div><div class="kpi-sub">${esc(periodName(f.year,f.month))} · incluye generales</div></div><div class="card"><div class="kpi-label">Gasto con los filtros seleccionados</div><div class="kpi-value" id="expense-filtered-total">${fmt(total)}</div><div class="kpi-sub">${records.length} registros</div></div></div>
  <div class="card mb20"><h3>Distribución por tipo</h3>${renderMiniBars([...byType.values()].sort((a,b)=>b.cents-a.cents).map(t=>[t.name,t.cents/100]),0,'var(--danger)',byType.size)}</div>
  <div class="card"><h3>Detalle de gastos</h3><div class="table-wrap"><table><thead><tr><th>Periodo</th><th>Sala</th><th>Tipo</th><th>Concepto</th><th class="right">Importe</th><th>Acciones</th></tr></thead><tbody>${records.map(r=>`<tr><td>${esc(r.period)}</td><td>${esc(r.venueName)}</td><td>${esc(E.types.find(t=>t.id===r.typeId)?.name||r.typeName)}</td><td style="white-space:normal;min-width:130px">${esc(r.concept||'—')}</td><td class="right">${fmt(r.amount)}</td><td><div class="nb-actions"><button class="btn btn-secondary btn-sm" data-expense-action="edit" data-expense-id="${esc(r.id)}">Editar</button>${S.role==='admin'?`<button class="btn btn-danger btn-sm" data-expense-action="delete" data-expense-id="${esc(r.id)}">Eliminar</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay gastos con estos filtros</td></tr>'}</tbody><tfoot><tr><th colspan="4">Total filtrado</th><th class="right">${fmt(total)}</th><th></th></tr></tfoot></table></div></div>`}`;

function renderBusinessTypes(){

async function saveExpenseForm(){
  if(S.isSaving||!E.draft)return;const d=E.draft;
  if(!d.typeId||!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.period))return showToast('Selecciona mes, año y tipo.','error');
  const amount=Number(d.amount);if(!Number.isFinite(amount)||amount<=0)return showToast('Introduce un importe mayor que cero.','error');
  S.isSaving=true;render();
  try{
    const data=await apiPost({action:'saveBusinessExpense',...d,amount});if(!data.record)throw new Error('El servidor no ha confirmado el gasto.');
    E.records=E.records.filter(r=>r.id!==data.record.id);E.records.push(data.record);
    E.filters={year:d.period.slice(0,4),month:d.period.slice(5),venueId:'',typeId:''};E.draft={...emptyExpenseDraft(),period:d.period,venueId:d.venueId};showToast('Gasto guardado.','success');
  }catch(err){showToast(err.message,'error');}finally{S.isSaving=false;render();}
}
async function deleteExpense(id){
  if(S.role!=='admin'||S.isSaving)return;const r=E.records.find(r=>r.id===id);if(!r)return;
  if(!window.confirm(`¿Eliminar el gasto de ${r.period}, ${r.venueName}, por ${fmt(r.amount)}?`))return;
  S.isSaving=true;render();try{await apiPost({action:'deleteBusinessExpense',id,version:r.version});E.records=E.records.filter(r=>r.id!==id);if(E.draft?.id===id)E.draft=emptyExpenseDraft();showToast('Gasto eliminado.','success');}catch(err){showToast(err.message,'error');}finally{S.isSaving=false;render();}
}
async function saveBusinessTypes(){
  if(S.isSaving||S.role!=='admin')return;S.isSaving=true;render();
  try{const data=await apiPost({action:'saveBusinessTypes',types:E.typeDraft,originalTypes:E.originalTypes});if(!Array.isArray(data.types))throw new Error('El servidor no ha confirmado los tipos.');E.types=data.types;E.originalTypes=JSON.parse(JSON.stringify(data.types));E.typeDraft=JSON.parse(JSON.stringify(data.types));showToast('Tipos de gasto guardados.','success');}catch(err){showToast(err.message,'error');}finally{S.isSaving=false;render();}
}
function bindExpenseEvents(){
  const form=document.getElementById('expense-form');if(form)form.onsubmit=e=>{e.preventDefault();saveExpenseForm();};
  document.querySelectorAll('[data-expense-field]').forEach(el=>{
    const update=()=>{if(!E.draft)return;const k=el.dataset.expenseField;if(k==='month')E.draft.period=E.draft.period.slice(0,4)+'-'+el.value;else if(k==='year')E.draft.period=el.value.padStart(4,'0')+'-'+E.draft.period.slice(-2);else E.draft[k]=el.value;};
    if(el.tagName==='SELECT')el.onchange=update;else el.oninput=update;
  });
  document.querySelectorAll('[data-expense-filter]').forEach(el=>{el.onchange=()=>{E.filters[el.dataset.expenseFilter]=el.value;render();};});
  document.querySelectorAll('[data-business-type-name]').forEach(el=>{el.oninput=()=>{E.typeDraft.find(t=>t.id===el.dataset.businessTypeName).name=el.value;};});
  document.querySelectorAll('[data-business-type-active]').forEach(el=>{el.onchange=()=>{E.typeDraft.find(t=>t.id===el.dataset.businessTypeActive).active=el.checked;};});
  document.querySelectorAll('[data-expense-action]').forEach(el=>{el.onclick=()=>{
    if(S.isSaving)return;const action=el.dataset.expenseAction;
    if(action==='reload')return loadExpenses(true);
    if(action==='reloadTypes'){E.typeDraft=null;return loadExpenses(true);}
    if(action==='saveTypes')return saveBusinessTypes();
    if(action==='addType'){const name=document.getElementById('business-type-name').value.trim();if(!name)return showToast('Introduce un nombre.','error');if(E.typeDraft.some(t=>normalize(t.name)===normalize(name)))return showToast('Ese tipo ya existe.','error');E.typeDraft.push({id:gid('etb'),name,active:true});return render();}
    if(action==='new'){E.draft=emptyExpenseDraft();return render();}
    if(action==='delete')return deleteExpense(el.dataset.expenseId);
    if(action==='edit'){const record=E.records.find(r=>r.id===el.dataset.expenseId);if(record){E.draft=JSON.parse(JSON.stringify(record));render();window.scrollTo(0,0);}}
  };});
}

const N={snapshot:null,loaded:false,loading:false,error:'',generation:0,filters:{year:currentBusinessPeriod().slice(0,4),month:currentBusinessPeriod().slice(5),weekday:'',venueId:'',basis:'benefit'}};
async function loadBusiness(force=false){
  if(N.loading||N.loaded&&!force)return;const generation=N.generation;N.loading=true;N.error='';render();
  try{
    const data=await apiPost({action:'getBusinessData'});if(generation!==N.generation)return;
    if(!data.snapshot||!['works','bars','expenses','venues','types'].every(k=>Array.isArray(data.snapshot[k])))throw new Error('Actualiza Apps Script para activar el Dashboard del negocio.');
    const snap=data.snapshot;
    for(const r of snap.works)for(const key of ['gross','net','benefit','cache'])if(typeof r[key]!=='number'||!Number.isFinite(r[key]))throw new Error('Hay un importe de obra no válido. Revisa la hoja antes de calcular el resultado.');
    for(const r of snap.bars)if(typeof r.total!=='number'||!Number.isFinite(r.total))throw new Error('Hay un importe de barra no válido.');
    for(const r of snap.expenses)if(typeof r.amount!=='number'||!Number.isFinite(r.amount))throw new Error('Hay un gasto no válido.');
    N.snapshot=snap;N.loaded=true;
  }catch(err){if(generation===N.generation){N.error=err.message;N.loaded=false;}}
  finally{if(generation===N.generation){N.loading=false;render();}}
}
function summarizeBusiness(snapshot,filters){
  const rows=new Map(),types=new Map(),works=new Map();let generalCents=0,periodGeneralCents=0,undated=0;
  const rowFor=(id,name)=>{if(!rows.has(id))rows.set(id,{id,name,works:0,bars:0,expenses:0,gross:0,net:0,cache:0,count:0,barCount:0});return rows.get(id);};
  const matches=period=>period.slice(0,4)===filters.year&&(!filters.month||period.slice(5,7)===filters.month);
  const venueMatches=id=>!filters.venueId||filters.venueId===id;
  const weekdayFiltered=filters.weekday!==''&&filters.weekday!==null&&filters.weekday!==undefined;
  const dayMatches=date=>matchesWeekday(date,weekdayFiltered?filters.weekday:'');
  const addType=r=>{const type=types.get(r.typeId)||{name:snapshot.types.find(t=>t.id===r.typeId)?.name||r.typeName,cents:0};type.cents+=Math.round(r.amount*100);types.set(r.typeId,type);};
  snapshot.works.forEach(r=>{
    if(!r.date){undated++;return;}if(!matches(r.date)||!dayMatches(r.date)||!venueMatches(r.venueId))return;
    const v=rowFor(r.venueId,r.venueName),cents=Math.round(r[filters.basis==='net'?'net':'benefit']*100);
    v.works+=cents;v.gross+=Math.round(r.gross*100);v.net+=Math.round(r.net*100);v.cache+=Math.round(r.cache*100);v.count++;
    const w=works.get(r.workName)||{name:r.workName||'Sin obra',cents:0,count:0};w.cents+=cents;w.count++;works.set(r.workName,w);
  });
  snapshot.bars.forEach(r=>{if(!r.date){undated++;return;}if(matches(r.date)&&dayMatches(r.date)&&venueMatches(r.venueId)){const v=rowFor(r.venueId,r.venueName);v.bars+=Math.round(r.total*100);v.barCount++;}});
  // Los gastos mensuales no tienen día: al filtrar por día de la semana quedan fuera.
  if(!weekdayFiltered) snapshot.expenses.forEach(r=>{
    if(!matches(r.period))return;
    if(!r.venueId){periodGeneralCents+=Math.round(r.amount*100);if(!filters.venueId){generalCents+=Math.round(r.amount*100);addType(r);}return;}
    if(venueMatches(r.venueId)){rowFor(r.venueId,r.venueName).expenses+=Math.round(r.amount*100);addType(r);}
  });
  const ranking=[...rows.values()].map(v=>({...v,result:v.works+v.bars-v.expenses})).sort((a,b)=>b.result-a.result||a.name.localeCompare(b.name));
  const total=ranking.reduce((t,v)=>{for(const key of ['works','bars','expenses','gross','net','cache','count','barCount','result'])t[key]+=v[key];return t;},{works:0,bars:0,expenses:0,gross:0,net:0,cache:0,count:0,barCount:0,result:0});
  total.general=generalCents;total.periodGeneral=periodGeneralCents;total.result-=generalCents;
  return {weekdayFiltered,total,ranking,types:[...types.values()].sort((a,b)=>b.cents-a.cents),works:[...works.values()].sort((a,b)=>b.cents-a.cents),undated,hasData:ranking.length>0||generalCents>0};
}
function previousBusinessFilters(f){
  if(!f.month)return {...f,year:String(Number(f.year)-1)};
  const month=Number(f.month);return {...f,year:String(Number(f.year)-(month===1?1:0)),month:String(month===1?12:month-1).padStart(2,'0')};
}
function businessVenueOptions(){
  const venues=new Map(N.snapshot.venues.map(v=>[String(v.id),v.name]));
  [...N.snapshot.works,...N.snapshot.bars,...N.snapshot.expenses].forEach(r=>{if(r.venueId&&!venues.has(r.venueId))venues.set(r.venueId,r.venueName);});
  return '<option value="">Todo el negocio</option>'+[...venues].sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>`<option value="${esc(id)}" ${N.filters.venueId===id?'selected':''}>${esc(name)}</option>`).join('');
}
function businessChart(months){
  const max=Math.max(1,...months.map(m=>Math.abs(m.summary.total.result)));
  return `<div class="nb-chart" aria-label="Resultado mensual del año seleccionado">${months.map(m=>{const value=m.summary.total.result;return `<button class="nb-month ${N.filters.month===m.month?'selected':''}" data-business-month="${m.month}" title="${MONTH_NAMES[Number(m.month)-1]}: ${m.summary.hasData?fmt(value/100):'Sin registros'}" aria-label="Ver ${MONTH_NAMES[Number(m.month)-1]}: ${m.summary.hasData?fmt(value/100):'sin registros'}"><span class="nb-chart-value ${value<0?'danger':'success'}">${m.summary.hasData?fmt(value/100):'—'}</span><span class="nb-chart-track"><span style="height:${m.summary.hasData?Math.max(2,Math.abs(value)/max*100):0}%;background:${value<0?'var(--danger)':'var(--success)'}"></span></span><span>${MONTH_NAMES[Number(m.month)-1].slice(0,3)}</span></button>`;}).join('')}</div><p class="nb-note">Pulsa un mes para consultar su detalle. Rojo: resultado negativo. «—»: sin registros.</p>`;
}
function renderBusinessDashboard(){
  const header=`<div class="section-top"><div><p class="nb-eyebrow">LA OPCIÓN · CONTROL DEL NEGOCIO</p><h1 class="page-title">Dashboard del negocio</h1><p class="page-sub">Obras + barras − gastos mensuales</p></div><button class="btn btn-secondary" data-business-action="reload" ${N.loading?'disabled':''}>${N.loading?'Actualizando…':'Actualizar todo'}</button></div>`;
  if(N.loading)return header+'<div class="card empty">Cargando obras, barras y gastos…</div>';

  const weekdaySummaries=WEEKDAYS.map((name,i)=>({name,s:summarizeBusiness(snapshot,{...f,weekday:String(i)})}));

    ||'<tr><td colspan="6" class="empty">Sin actividad en este periodo</td></tr>';
  const totalCosts=t.expenses+t.general;
  return `<div class="nb-dashboard">${header}
  <div class="card mb20"><div class="dashboard-filters"><div class="field"><label>Mes</label><select data-business-filter="month">${businessMonthOptions(f.month)}</select></div><div class="field"><label>Año</label><select data-business-filter="year">${businessYearOptions(f.year,periods)}</select></div><div class="field"><label>Día de la semana</label><select data-business-filter="weekday">${weekdayFilterOptions(f.weekday)}</select></div><div class="field"><label>Sala</label><select data-business-filter="venueId">${businessVenueOptions()}</select></div><div class="field"><label>Importe de obras que se suma</label><select data-business-filter="basis"><option value="benefit" ${f.basis==='benefit'?'selected':''}>Beneficio después del caché</option><option value="net" ${f.basis==='net'?'selected':''}>Neto antes del caché</option></select></div></div></div>
  <div class="nb-hero mb20 ${t.result<0?'negative':''}"><div><p class="nb-eyebrow">${esc(periodName(f.year,f.month))} · ${esc(venueName)}</p><h2>${esc(resultLabel)}</h2><div class="nb-result ${t.result<0?'danger':'success'}" id="business-result">${summary.hasData?fmt(t.result/100):'Sin registros'}</div><p class="nb-comparison">${summary.hasData&&previous.hasData?`${delta>=0?'+':''}${fmt(delta/100)} frente a ${esc(periodName(prevFilter.year,prevFilter.month))}`:'Sin registros comparables en el periodo anterior'}</p></div><div class="nb-formula"><div><span>${esc(basisLabel)}</span><strong>${fmt(t.works/100)}</strong></div><div><span>+ Cobros de barras</span><strong>${fmt(t.bars/100)}</strong></div><div><span>− Gastos asignados a salas</span><strong>${fmt(t.expenses/100)}</strong></div><div><span>− Gastos generales incluidos</span><strong>${fmt(t.general/100)}</strong></div></div></div>

  ${f.venueId?`<div class="nb-context mb20">Hay ${fmt(t.periodGeneral/100)} de gastos generales del periodo. No están asignados a esta sala; se descuentan al seleccionar «Todo el negocio».</div>`:''}
  ${weekdayOn?`<div class="nb-context mb20">Filtro por día de la semana activo (${esc(WEEKDAYS[Number(f.weekday)])}). Los gastos mensuales se registran por mes, no por día, así que no se incluyen en este resultado: aquí ves obras + barras de ese día.</div>`:''}
  ${summary.undated?`<div class="nb-context mb20">${summary.undated} registros de obras o barras carecen de fecha y no se pueden incluir en los periodos. Revisa sus fechas.</div>`:''}

function bindBusinessEvents(){

  document.querySelectorAll('[data-business-filter]').forEach(el=>{el.onchange=()=>{N.filters[el.dataset.businessFilter]=el.value;render();};});
  document.querySelectorAll('[data-business-month]').forEach(el=>{el.onclick=()=>{N.filters.month=el.dataset.businessMonth;render();};});
  document.querySelectorAll('[data-business-venue]').forEach(el=>{el.onclick=()=>{N.filters.venueId=el.dataset.businessVenue;render();window.scrollTo(0,0);};});
  document.querySelectorAll('[data-business-action="reload"]').forEach(el=>{el.onclick=()=>loadBusiness(true);});
}

// ══════════════════════════════════════════════════════════════
// INFORME PDF CORPORATIVO DE FUNCIONES FILTRADAS
// Usa la impresión del navegador: «Guardar como PDF».
// Incluye TODAS las funciones que cumplen los filtros del dashboard.
// ══════════════════════════════════════════════════════════════
function pdfMoney(n){ return `${new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0))} €`; }

function activeDashboardFilterLabels(){
  const f=S.dashboardFilters||{};
  const out=[];
  if(f.month) out.push(['Mes',f.month]);
  if(f.from) out.push(['Desde',f.from]);
  if(f.to) out.push(['Hasta',f.to]);
  if(f.weekday!==''&&f.weekday!==null&&f.weekday!==undefined) out.push(['Día',WEEKDAYS[Number(f.weekday)]||'—']);
  if(f.venueId) out.push(['Sala',(S.config.venues||[]).find(v=>v.id===f.venueId)?.name||f.venueId]);
  if(f.workId) out.push(['Obra',(S.config.works||[]).find(w=>w.id===f.workId)?.name||f.workId]);
  if(f.platformId){
    const name=f.platformId==='cashBox'?'Taquilla efectivo':(f.platformId==='cardBox'?'Taquilla tarjeta':((S.config.platforms||[]).find(p=>p.id===f.platformId)?.name||f.platformId));
    out.push(['Plataforma',name]);
  }
  if(f.agreementId) out.push(['Acuerdo',getAgreementCatalog().find(a=>a.id===f.agreementId)?.name||f.agreementId]);
  return out;
}

function pdfLogo(){
  return `<svg viewBox="0 0 280 150" width="190" height="102" xmlns="http://www.w3.org/2000/svg"><text x="140" y="60" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="3" fill="#15151E">LA OPCIÓN</text><rect x="4" y="76" width="272" height="4" fill="#1B86AC"/><rect x="4" y="86" width="272" height="4" fill="#C93C86"/><rect x="4" y="96" width="272" height="4" fill="#B49A18"/><text x="140" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" letter-spacing="7" fill="#6B6B80">PRODUCCIONES</text></svg>`;
}

function buildShowsPdfHtml(){
  const cs=getDashboardFilteredShows().map(s=>({...s,c:showAmounts(s)}))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.workName).localeCompare(String(b.workName),'es'));
  const t=cs.reduce((a,s)=>({
    vb:a.vb+s.c.ventaBruta, vn:a.vn+s.c.ventaNeta, g:a.g+s.c.totalGastos, tn:a.tn+s.c.totalNeto,
    ca:a.ca+s.c.cache, ro:a.ro+s.c.restanteOpcion, comm:a.comm+s.c.totalComm, autor:a.autor+s.c.autorImporte,
    alquiler:a.alquiler+s.c.venueRental, otros:a.otros+s.c.otrosGastosRegulares,
  }),{vb:0,vn:0,g:0,tn:0,ca:0,ro:0,comm:0,autor:0,alquiler:0,otros:0});
  Object.keys(t).forEach(k=>{t[k]=r2(t[k]);});
  const n=cs.length;

  const dates=cs.map(s=>s.date).filter(Boolean).sort();
  const periodo=dates.length?(dates[0]===dates[dates.length-1]?dates[0]:`${dates[0]} a ${dates[dates.length-1]}`):'Sin fechas';
  const filters=activeDashboardFilterLabels();
  const filtersHtml=filters.length
    ? filters.map(([k,v])=>`<span class="chip"><b>${esc(k)}:</b> ${esc(v)}</span>`).join('')
    : '<span class="chip">Sin filtros: todas las funciones</span>';

  const rows=cs.map(s=>`<tr>
    <td>${esc(s.date||'—')}</td>
    <td>${esc(weekdayShort(s.date))}</td>
    <td class="ell">${esc(s.workName||'—')}</td>
    <td class="ell">${esc(s.venueName||'—')}</td>
    <td class="ell">${esc(s.agreementSnapshot?.name||'—')}</td>
    <td class="r">${pdfMoney(s.c.ventaBruta)}</td>
    <td class="r">${pdfMoney(s.c.ventaNeta)}</td>
    <td class="r">${pdfMoney(s.c.totalGastos)}</td>
    <td class="r">${pdfMoney(s.c.cache)}</td>
    <td class="r b ${s.c.restanteOpcion<0?'neg':''}">${pdfMoney(s.c.restanteOpcion)}</td>
  </tr>`).join('')||'<tr><td colspan="10" class="empty">No hay funciones con estos filtros.</td></tr>';

  const months={};
  cs.forEach(s=>{
    const m=(s.date||'Sin fecha').slice(0,7)||'Sin fecha';
    if(!months[m]) months[m]={n:0,vb:0,vn:0,g:0,tn:0,ca:0,ro:0};
    const g=months[m];
    g.n+=1; g.vb+=s.c.ventaBruta; g.vn+=s.c.ventaNeta; g.g+=s.c.totalGastos; g.tn+=s.c.totalNeto; g.ca+=s.c.cache; g.ro+=s.c.restanteOpcion;
  });
  const monthRows=Object.entries(months).sort(([a],[b])=>a.localeCompare(b)).map(([m,v])=>`<tr><td>${esc(m)}</td><td class="r">${v.n}</td><td class="r">${pdfMoney(v.vb)}</td><td class="r">${pdfMoney(v.vn)}</td><td class="r">${pdfMoney(v.g)}</td><td class="r">${pdfMoney(v.tn)}</td><td class="r">${pdfMoney(v.ca)}</td><td class="r b ${v.ro<0?'neg':''}">${pdfMoney(v.ro)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sin datos</td></tr>';

  const wd=WEEKDAYS.map(()=>({n:0,vb:0,tn:0,ca:0,ro:0}));
  cs.forEach(s=>{
    const wi=weekdayIndexFromDate(s.date);
    if(wi<0) return;
    wd[wi].n+=1; wd[wi].vb+=s.c.ventaBruta; wd[wi].tn+=s.c.totalNeto; wd[wi].ca+=s.c.cache; wd[wi].ro+=s.c.restanteOpcion;
  });
  const weekdayRows=wd.map((v,i)=>({v,i})).filter(x=>x.v.n>0)
    .map(({v,i})=>`<tr><td>${WEEKDAYS[i]}</td><td class="r">${v.n}</td><td class="r">${pdfMoney(v.vb)}</td><td class="r">${pdfMoney(v.vb/v.n)}</td><td class="r">${pdfMoney(v.tn)}</td><td class="r">${pdfMoney(v.ca)}</td><td class="r b ${v.ro<0?'neg':''}">${pdfMoney(v.ro)}</td></tr>`).join('')
    ||'<tr><td colspan="7" class="empty">Sin funciones con fecha</td></tr>';

  const plat={};
  cs.forEach(s=>{
    s.c.commissions.forEach(c=>{
      if(!plat[c.name]) plat[c.name]={income:0,commission:0};
      plat[c.name].income+=c.income; plat[c.name].commission+=c.commTotal;
    });
    if(!plat['Taquilla efectivo']) plat['Taquilla efectivo']={income:0,commission:0};
    if(!plat['Taquilla tarjeta']) plat['Taquilla tarjeta']={income:0,commission:0};
    plat['Taquilla efectivo'].income+=s.c.cashBox;
    plat['Taquilla tarjeta'].income+=s.c.cardBox;
  });
  const platEntries=Object.entries(plat).map(([name,v])=>({name,income:r2(v.income),commission:r2(v.commission)})).filter(v=>v.income>0).sort((a,b)=>b.income-a.income);
  const platRows=platEntries.map(v=>`<tr><td class="ell">${esc(v.name)}</td><td class="r">${pdfMoney(v.income)}</td><td class="r">${v.commission>0?'-':''}${pdfMoney(v.commission)}</td><td class="r">${t.vb?fmtPct(v.income/t.vb*100):'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sin ingresos</td></tr>';

  const works={};
  cs.forEach(s=>{
    const k=dashboardEntityName(s,'works')||'Sin obra';
    if(!works[k]) works[k]={n:0,vb:0,tn:0,ca:0,ro:0};
    works[k].n+=1; works[k].vb+=s.c.ventaBruta; works[k].tn+=s.c.totalNeto; works[k].ca+=s.c.cache; works[k].ro+=s.c.restanteOpcion;
  });
  const workRows=Object.entries(works).sort((a,b)=>b[1].ro-a[1].ro).map(([name,v])=>`<tr><td class="ell">${esc(name)}</td><td class="r">${v.n}</td><td class="r">${pdfMoney(v.vb)}</td><td class="r">${pdfMoney(v.tn)}</td><td class="r">${pdfMoney(v.ca)}</td><td class="r b ${v.ro<0?'neg':''}">${pdfMoney(v.ro)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sin datos</td></tr>';

  const avisos=[];
  const allToCompany=cs.filter(s=>s.c.allToCompany).length;
  const mismatched=cs.filter(s=>s.c.mismatch).length;
  if(n&&allToCompany===n) avisos.push('En todas las funciones de este informe el caché equivale al total neto (acuerdo al 100 % de taquilla), por lo que el beneficio de La Opción es 0 €.');
  else if(allToCompany) avisos.push(`${allToCompany} de ${n} funciones dejan 0 € a La Opción porque todo el neto va a la compañía.`);
  if(mismatched) avisos.push(`${mismatched} función(es) tienen importes descuadrados en la hoja de cálculo (caché + restante ≠ total neto).`);
  const avisosHtml=avisos.length?`<div class="avisos"><b>Notas</b><ul>${avisos.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:'';

  const generado=new Date().toLocaleString('es-ES');
  const titulo=filters.find(([k])=>k==='Obra')?`Informe de funciones · ${filters.find(([k])=>k==='Obra')[1]}`:'Informe de funciones';

  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>${esc(titulo)} · La Opción Producciones</title><style>
@page{size:A4 portrait;margin:14mm 12mm 16mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Helvetica,Arial,sans-serif;color:#15151E;font-size:10pt;line-height:1.35;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #15151E;padding-bottom:12px;margin-bottom:16px}
h1{font-size:17pt;font-weight:700;letter-spacing:-.2px}
.sub{color:#5B5B6E;font-size:9.5pt;margin-top:3px}
.meta{text-align:right;font-size:9pt;color:#5B5B6E;min-width:38%}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.chip{border:1px solid #D3D3DE;border-radius:20px;padding:2px 9px;font-size:8.5pt;background:#F6F6FA}
h2{font-size:11.5pt;margin:16px 0 7px;}
h2:first-of-type{margin-top:6px;padding-bottom:4px;border-bottom:1px solid #D3D3DE}
table{width:100%;border-collapse:collapse;font-size:8.5pt}
th{text-align:left;background:#15151E;color:#fff;padding:5px 6px;font-size:7.5pt;text-transform:uppercase;letter-spacing:.4px}
td{padding:4px 6px;border-bottom:1px solid #E4E4EC}
tbody tr:nth-child(even) td{background:#FAFAFC}
tfoot td{border-top:2px solid #15151E;font-weight:700;background:#fff}
.r{text-align:right;white-space:nowrap}
.b{font-weight:700}
.neg{color:#B3261E}
.ell{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:#6B6B80;padding:12px}
.avisos{margin-top:14px;border-left:3px solid #B49A18;background:#FCFAF0;padding:8px 12px;font-size:8.5pt}
.avisos ul{margin:4px 0 0 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
footer{position:fixed;bottom:-10mm;left:0;right:0;border-top:1px solid #D3D3DE;padding-top:4px;font-size:7.5pt;color:#6B6B80;display:flex;justify-content:space-between}
thead{display:table-header-group}
tr{break-inside:avoid}
h2{break-after:avoid}
</style></head><body>
<header>
  <div>${pdfLogo()}</div>
  <div class="meta">
    <h1>${esc(titulo)}</h1>
    <div class="sub">Periodo: ${esc(periodo)} · ${n} ${n===1?'función':'funciones'}</div>
    <div class="chips">${filtersHtml}</div>
  </div>
</header>

${avisosHtml}

<table>
  <thead><tr><th>Fecha</th><th>Día</th><th>Obra</th><th>Sala</th><th>Acuerdo</th><th class="r">V. bruta</th><th class="r">V. neta</th><th class="r">Gastos</th><th class="r">Caché</th><th class="r">Restante</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td colspan="5">Total · ${n} ${n===1?'función':'funciones'}</td><td class="r">${pdfMoney(t.vb)}</td><td class="r">${pdfMoney(t.vn)}</td><td class="r">${pdfMoney(t.g)}</td><td class="r">${pdfMoney(t.ca)}</td><td class="r">${pdfMoney(t.ro)}</td></tr></tfoot>
</table>

<table>
  <thead><tr><th>Mes</th><th class="r">Func.</th><th class="r">V. bruta</th><th class="r">V. neta</th><th class="r">Gastos</th><th class="r">T. neto</th><th class="r">Caché</th><th class="r">Restante</th></tr></thead>
  <tbody>${monthRows}</tbody>
</table>

  <thead><tr><th>Día</th><th class="r">Func.</th><th class="r">V. bruta</th><th class="r">Media/func.</th><th class="r">T. neto</th><th class="r">Caché</th><th class="r">Restante</th></tr></thead>
  <tbody>${weekdayRows}</tbody>
</table>

<table>
  <thead><tr><th>Obra</th><th class="r">Func.</th><th class="r">V. bruta</th><th class="r">T. neto</th><th class="r">Caché</th><th class="r">Restante</th></tr></thead>
  <tbody>${workRows}</tbody>
</table>

<table>
  <thead><tr><th>Canal</th><th class="r">Facturado</th><th class="r">Comisión</th><th class="r">% del total</th></tr></thead>
  <tbody>${platRows}</tbody>
  <tfoot><tr><td>Total</td><td class="r">${pdfMoney(t.vb)}</td><td class="r">${t.comm>0?'-':''}${pdfMoney(t.comm)}</td><td class="r">100,00 %</td></tr></tfoot>
</table>

<table>
  <thead><tr><th>Concepto</th><th class="r">Importe</th><th class="r">% sobre venta neta</th></tr></thead>
  <tbody>
    <tr><td>Comisiones de plataformas</td><td class="r">${pdfMoney(t.comm)}</td><td class="r">${t.vn?fmtPct(t.comm/t.vn*100):'—'}</td></tr>
    <tr><td>Derechos de autor</td><td class="r">${pdfMoney(t.autor)}</td><td class="r">${t.vn?fmtPct(t.autor/t.vn*100):'—'}</td></tr>
    <tr><td>Alquiler de sala</td><td class="r">${pdfMoney(t.alquiler)}</td><td class="r">${t.vn?fmtPct(t.alquiler/t.vn*100):'—'}</td></tr>
    <tr><td>Otros gastos</td><td class="r">${pdfMoney(t.otros)}</td><td class="r">${t.vn?fmtPct(t.otros/t.vn*100):'—'}</td></tr>
  </tbody>
  <tfoot><tr><td>Total gastos</td><td class="r">${pdfMoney(t.g)}</td><td class="r">${t.vn?fmtPct(t.g/t.vn*100):'—'}</td></tr></tfoot>
</table>

<footer><span>La Opción Producciones · Informe interno de gestión</span><span>Generado el ${esc(generado)}${S.user?.email?` por ${esc(S.user.email)}`:''}</span></footer>
</body></html>`;
}

function exportShowsPdf(){
  const cs=getDashboardFilteredShows();
  if(!cs.length) return showToast('No hay funciones con estos filtros para exportar.','warn');
  try{
    const html=buildShowsPdfHtml();
    const previous=document.getElementById('pdf-print-frame');
    if(previous) previous.remove();
    const frame=document.createElement('iframe');
    frame.id='pdf-print-frame';
    frame.setAttribute('aria-hidden','true');
    frame.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0';
    document.body.appendChild(frame);
    const doc=frame.contentWindow.document;
    doc.open();doc.write(html);doc.close();
    const launch=()=>{
      try{frame.contentWindow.focus();frame.contentWindow.print();}
      catch(err){showToast('No se ha podido abrir la impresión: '+err.message,'error');}
    };
    if(doc.readyState==='complete') setTimeout(launch,350);
    else frame.onload=()=>setTimeout(launch,350);
    showToast(`Informe de ${cs.length} funciones listo. Elige «Guardar como PDF».`,'success');
  }catch(err){showToast('Error al generar el informe: '+err.message,'error');}
}
