  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap');

    *{box-sizing:border-box;margin:0;padding:0} html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh} button,input,select,textarea{font:inherit}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.card h3{margin:0 0 14px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700}.page-title{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;margin:0}.page-sub{color:var(--text-muted);font-size:13px;margin:4px 0 0}.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:1fr 1fr}.grid-kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:700}.kpi-value{margin-top:8px;font-size:22px;font-family:'Outfit',sans-serif;font-weight:800}.kpi-sub{margin-top:4px;font-size:11px;color:var(--text-dim)}
    .btn{border:0;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;transition:.15s;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn-primary{background:var(--cyan);color:#0A0A0F}.btn-secondary{background:var(--surface-alt);color:var(--text);border:1px solid var(--border)}.btn-danger{background:var(--danger-dim);color:var(--danger)}.btn-ghost{background:transparent;color:var(--text-muted)}.btn-sm{padding:5px 10px;font-size:12px}.badge{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.3px}.badge-ok{background:var(--success-dim);color:var(--success)}.badge-off{background:var(--surface-alt);color:var(--text-dim)}
    .field{margin-bottom:12px}.field label{display:block;margin-bottom:4px;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:8px 11px;background:var(--surface-alt);color:var(--text);border:1px solid var(--border);border-radius:8px;outline:none;font-size:13px}.field textarea{min-height:64px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}.inline-input{width:100%;min-width:120px;padding:7px 9px;background:var(--surface-alt);color:var(--text);border:1px solid var(--border);border-radius:8px;outline:none;font-size:12px}.inline-check{width:18px;height:18px;accent-color:var(--cyan)}
    .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th{padding:11px 14px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.8px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}th.right,td.right{text-align:right}td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}tbody tr.clickable{cursor:pointer;transition:background .1s}tbody tr.clickable:hover{background:var(--surface-alt)}
    .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}.bar-label{width:90px;flex-shrink:0;color:var(--text-muted);font-size:11px}.bar-track{flex:1;height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden}.bar-fill{height:100%;border-radius:3px;background:var(--cyan)}.bar-value{min-width:75px;text-align:right;font-size:12px;font-weight:700}.empty{text-align:center;color:var(--text-dim);padding:36px 10px}.success{color:var(--success)}.danger{color:var(--danger)}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.yellow{color:var(--yellow)}.purple{color:var(--purple)}.fw700{font-weight:700}.mb20{margin-bottom:20px}.mt10{margin-top:10px}.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,var(--cyan-dim) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,var(--pink-dim) 0%,transparent 50%),var(--bg);padding:clamp(18px,4vw,42px);overflow:auto}.login-box{width:100%;max-width:430px;text-align:center}.login-logo{width:min(100%,340px);margin:0 auto 30px;display:flex;align-items:center;justify-content:center}.login-logo svg{display:block;width:100%;height:auto;max-height:170px;overflow:visible}.sidebar-header svg{max-width:100%;height:auto;overflow:visible}.toast{position:fixed;top:18px;right:18px;z-index:200;padding:11px 18px;border-radius:10px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;max-width:420px}.toast.success{border-color:rgba(74,222,128,.3);color:var(--success)}.toast.error{border-color:rgba(248,113,113,.3);color:var(--danger)}.toast.warn{border-color:rgba(251,191,36,.3);color:var(--warn)}.loading-overlay{position:fixed;inset:0;background:rgba(10,10,15,.85);z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{color:var(--text-muted);font-size:14px}.dirty-note{background:var(--warn-dim);border:1px solid rgba(251,191,36,.25);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:14px}
    .dashboard-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.dashboard-filters .field{margin-bottom:0}.mini-series{display:grid;grid-template-columns:52px 1fr 88px;align-items:center;gap:8px;margin:5px 0;font-size:11px;color:var(--text-muted)}.mini-series .bar-track{height:5px}.finance-split{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}.finance-split.total{border-bottom:0;border-top:1px solid var(--border-light);margin-top:6px;padding-top:14px;font-size:16px;font-family:'Outfit',sans-serif;font-weight:800}.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .show-toolbar{display:grid;grid-template-columns:1.4fr repeat(5,minmax(120px,.7fr));gap:10px;align-items:end;margin-bottom:14px}.search-wrap{position:relative}.search-wrap .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}.search-wrap input{padding-left:38px}.show-count-pill{display:inline-flex;align-items:center;gap:6px;background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(110,200,228,.22);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800}.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.show-mobile-card{display:none}.show-result-note{color:var(--text-dim);font-size:12px;margin:0 0 12px}.show-list-card{padding:16px}.filter-label{display:block;margin-bottom:4px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
    @media(max-width:1050px){.show-toolbar{grid-template-columns:1fr 1fr}.show-toolbar .search-wrap{grid-column:1/-1}}@media(max-width:700px){.show-toolbar{grid-template-columns:1fr}.show-mobile-card{display:block}.show-table-desktop{display:none}.row-actions{justify-content:flex-start}}
    @media(max-width:1100px){.grid-2{grid-template-columns:1fr}}@media(max-width:900px){:root{--sidebar-w:0}.sidebar{position:static;width:100%;min-height:auto}.app{flex-direction:column}.main{margin-left:0;padding:18px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyCwwMRxy6J4l1oqF9BqgvzHZ7DKSASqytV2B7anHsokG0VTraeTBLfTHXDEwS11uQDXQ/exec";
const STORAGE_KEY = 'laopcion_session_v3';
const $app = document.getElementById('app');

const S = {
  token:'', user:null, role:null, view:'dashboard', selectedId:null, editShowId:null,
  search:'', showFilters:{month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'}, toast:null, toastTimer:null,
  adminTab:'platforms', summaryMonth:'', isLoading:false, isSaving:false, isRefreshing:false,
  isBooting:false, isLoggingIn:false, lastSyncAt:'', loadError:null, configDirty:false,
  users:[], newShowDraft:null, isDuplicating:false, duplicateSourceId:null,
  dashboardFilters:{month:'',from:'',to:'',venueId:'',workId:'',platformId:'',agreementId:''},
  config:{ platforms:[], venues:[], works:[], expenseTypes:[], agreements:[] }, shows:[]
};
let SAVE_LOCK=false; let REFRESH_LOCK=false; let LOGIN_LOCK=false;

const CONFIG_META = {
  platforms: { key:'platforms',  title:'Plataformas', singular:'plataforma', prefix:'p'  },
  venues:    { key:'venues',     title:'Salas',        singular:'sala',       prefix:'v'  },
  works:     { key:'works',      title:'Obras',        singular:'obra',       prefix:'w'  },
  agreements:{ key:'agreements', title:'Acuerdos',     singular:'acuerdo',    prefix:'a'  },
  expenses:  { key:'expenseTypes',title:'Gastos',      singular:'gasto',      prefix:'et' },
};

function gid(p='id'){ return p+'_'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,8); }
function fmt(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(Number(n||0)); }
function fmtPct(n){ return `${Number(n||0).toFixed(2)}%`; }
function r2(n){ return Math.round(Number(n||0)*100)/100; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normalize(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

function normalizeExpenseOwner(owner){
  owner=normalize(owner||'both');
  if(['laopcion','la opcion','opcion','option'].includes(owner)) return 'laopcion';
  if(['company','compania','compañia','cia','compañía'].includes(owner)) return 'company';
  return 'both';
}
function expenseOwnerLabel(owner){
  const key=normalizeExpenseOwner(owner);
  return key==='laopcion'?'La Opción':(key==='company'?'Compañía':'Ambas partes');
}

function alphaSortByName(list){ return [...(list||[])].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'})); }
function getActiveSorted(list){ return alphaSortByName((list||[]).filter(x=>x.active!==false)); }
function getLegacyAgreementById(config,id){ return (config?.agreements||[]).find(a=>a.id===id)||null; }
function getLegacyAgreementByName(config,name){ return (config?.agreements||[]).find(a=>normalize(a.name)===normalize(name))||null; }
function hasWorkAgreement(work){ return !!(work&&(work.agreement||work.agreementId||work.agreementMode||work.agreementValue!==undefined||work.agreementName)); }
function agreementFromWork(work){
  if(!hasWorkAgreement(work)) return null;
  const raw=(work.agreement&&typeof work.agreement==='object')?work.agreement:{};
  const id=raw.id||work.agreementId||`wa_${work.id||gid('w')}`;
  const name=raw.name||work.agreementName||work.name||'Acuerdo';
  const mode=raw.mode||work.agreementMode||'percentage';
  const value=Number(raw.value??work.agreementValue??0);
  return {id,name,mode,value};
}
function resolveAgreementForWork(work,config,legacyAgreement=null){
  let linked=agreementFromWork(work);
  if(work?.agreementId&&!work.agreement&&!work.agreementName&&!work.agreementMode&&work.agreementValue===undefined){
    const legacyById=getLegacyAgreementById(config,work.agreementId);
    if(legacyById) linked={id:legacyById.id,name:legacyById.name,mode:legacyById.mode||'percentage',value:Number(legacyById.value||0)};
  }
  const fallback=legacyAgreement||null;
  const agr=linked||fallback;
  if(!agr) return {id:'',snapshot:null};
  return {id:agr.id||'',snapshot:{name:agr.name||work?.name||'Acuerdo',mode:agr.mode||'percentage',value:Number(agr.value||0)}};
}
function syncWorkAgreementToConfig(work,config=S.config){
  if(!work) return null;
  if(!work.agreementId) work.agreementId=`wa_${work.id||gid('w')}`;
  if(!work.agreementName) work.agreementName=work.name||'Acuerdo';
  if(!work.agreementMode) work.agreementMode='percentage';
  if(work.agreementValue===undefined) work.agreementValue=0;
  if(!Array.isArray(config.agreements)) config.agreements=[];
  let agr=config.agreements.find(a=>a.id===work.agreementId);
  if(!agr){ agr={id:work.agreementId,name:work.agreementName,mode:work.agreementMode,value:Number(work.agreementValue||0),active:work.active!==false}; config.agreements.push(agr); }
  agr.name=work.agreementName||work.name||agr.name;
  agr.mode=work.agreementMode||'percentage';
  agr.value=Number(work.agreementValue||0);
  agr.active=work.active!==false;
  return agr;
}
function syncAllWorkAgreementsToConfig(config=S.config){ (config.works||[]).forEach(w=>syncWorkAgreementToConfig(w,config)); }
function getAgreementCatalog(config=S.config){
  const byName=new Map();
  getActiveSorted(config.works||[]).forEach(w=>{
    const resolved=resolveAgreementForWork(w,config);
    const agr=resolved.snapshot;
    if(agr){ byName.set(normalize(agr.name),{id:resolved.id,name:agr.name,mode:agr.mode,value:agr.value,source:'work'}); }
  });
  getActiveSorted(config.agreements||[]).forEach(a=>{
    const key=normalize(a.name);
    if(!byName.has(key)) byName.set(key,{id:a.id,name:a.name,mode:a.mode||'percentage',value:Number(a.value||0),source:'legacy'});
  });
  return alphaSortByName([...byName.values()]);
}
function matchesAgreementFilter(show,agreementId){
  if(!agreementId) return true;
  if(show.agreementId===agreementId) return true;
  const selected=getAgreementCatalog().find(a=>a.id===agreementId);
  return !!(selected&&normalize(show.agreementSnapshot?.name)===normalize(selected.name));
}
function agreementValueLabel(agr){ return !agr?'—':(agr.mode==='fixed'?fmt(agr.value):fmtPct(agr.value)); }
function showToast(msg,type='success'){ S.toast={message:msg,type}; clearTimeout(S.toastTimer); S.toastTimer=setTimeout(()=>{S.toast=null;render();},3500); render(); }
function logoSVG(w=150){ const h=w*.55; return `<svg width="${w}" height="${h}" viewBox="-28 -8 336 174" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible"><text x="140" y="68" text-anchor="middle" font-family="'Outfit','Arial Black',sans-serif" font-size="48" font-weight="900" letter-spacing="4" fill="var(--text)">LA OPCIÓN</text><line x1="4" y1="82" x2="276" y2="82" stroke="var(--cyan)" stroke-width="4"/><line x1="4" y1="92" x2="276" y2="92" stroke="var(--pink)" stroke-width="4"/><line x1="4" y1="102" x2="276" y2="102" stroke="var(--yellow)" stroke-width="4"/><text x="140" y="132" text-anchor="middle" font-family="'Outfit','Arial',sans-serif" font-size="20" font-weight="300" letter-spacing="9" fill="var(--text-muted)">PRODUCCIONES</text></svg>`; }
function roleLabel(r){ return r==='admin'?'Administrador':'Usuario'; }
function defaultViewForRole(role){ return role==='admin'?'dashboard':'shows'; }
function isAdminOnlyView(view){ return ['dashboard','summary','admin'].includes(view); }
function isViewAllowedForRole(view,role){ return role==='admin'||!isAdminOnlyView(view); }
function normalizeCurrentView(){
  if(S.user && !isViewAllowedForRole(S.view,S.role)){
    S.view=defaultViewForRole(S.role);
    S.selectedId=null;
    S.editShowId=null;
    S.newShowDraft=null;
    S.isDuplicating=false;
    S.duplicateSourceId=null;
  }
}

async function apiPost(payload){
  const body={...payload};
  if(S.token&&body.action!=='login'&&body.token===undefined) body.token=S.token;
  const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},cache:'no-store',body:JSON.stringify(body)});
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data=await resp.json();
  if(!data.ok){ const msg=data.error||'Error desconocido'; if(/sesión|sesion|token|caducado/i.test(msg)) clearSession(false); throw new Error(msg); }
  if(data.user){ S.user=data.user; S.role=data.user.role; }
  return data;
}

function saveSession(token,user){
  S.token=token;
  S.user=user;
  S.role=user.role;
  normalizeCurrentView();
  localStorage.setItem(STORAGE_KEY,JSON.stringify({token,user}));
}
function clearSession(rn=true){ S.token='';S.user=null;S.role=null;S.view='dashboard';S.selectedId=null;S.editShowId=null;S.users=[];S.newShowDraft=null;S.search='';S.showFilters={month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'};S.isDuplicating=false;S.duplicateSourceId=null;localStorage.removeItem(STORAGE_KEY);if(rn)render(); }

async function boot(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw){render();return;}
  try{
    const saved=JSON.parse(raw);
    if(!saved.token) throw new Error('Sin token');
    S.token=saved.token;S.user=saved.user||null;S.role=saved.user?.role||null;normalizeCurrentView();S.isBooting=true;render();
    const me=await apiPost({action:'me'});
    saveSession(S.token,me.user);
    await loadFromSheet();
    if(S.role==='admin') await loadUsers();
  }catch(err){clearSession(false);}
  S.isBooting=false;render();
}

// ══════════════════════════════════════════════════════════════
// CONVERSIÓN SHEET → APP
// ══════════════════════════════════════════════════════════════
function sheetShowToAppShow(raw,config){
  const venue=config.venues.find(v=>normalize(v.name)===normalize(raw.sala))||null;
  const work=config.works.find(w=>normalize(w.name)===normalize(raw.obra))||null;
  const legacyAgreement=getLegacyAgreementByName(config,raw.acuerdo);
  const resolvedAgreement=resolveAgreementForWork(work,config,legacyAgreement);
  const platformSnapshots={},income={};

  if(Array.isArray(raw.platformData)&&raw.platformData.length){
    raw.platformData.forEach(p=>{
      const cfg=config.platforms.find(x=>x.id===p.id||normalize(x.name)===normalize(p.name));
      const pid=cfg?.id||p.id||gid('p');
      const amt=Number(p.income||0);
      income[pid]=amt;
      platformSnapshots[pid]={name:cfg?.name||p.name||'Plataforma',commission:Number(p.commission??cfg?.commission??0),ivaOnCommission:Boolean(p.ivaOnCommission??cfg?.ivaOnCommission),income:amt};
    });
  } else {
    const platMap={atrapalo:'Atrápalo',fever:'Fever',kultur:'Kultur',abonoteatro:'Abonoteatro',laopcion:'Laopcion',universe:'Universe'};
    Object.entries(platMap).forEach(([k,platName])=>{
      const amt=Number(raw[k]||0);
      const pl=config.platforms.find(p=>normalize(p.name)===normalize(platName));
      if(pl){income[pl.id]=amt;platformSnapshots[pl.id]={name:pl.name,commission:pl.commission,ivaOnCommission:pl.ivaOnCommission,income:amt};}
    });
  }
  income.cashBox=Number(raw.efectivo||0);
  income.cardBox=Number(raw.tarjeta||0);

  return {
    id:raw.id||raw.appId||gid('s'), appId:raw.appId||raw.id||'',
    venueId:venue?.id||'', workId:work?.id||'',
    venueName:raw.sala||'', workName:raw.obra||'',
    date:raw.fecha||'', time:'',
    agreementId:resolvedAgreement.id,
    agreementSnapshot:resolvedAgreement.snapshot,
    notes:raw.observaciones||'',
    income, platformSnapshots,
    autorPct:Number(raw.autorPct||0),
    autorOwner:normalizeExpenseOwner(raw.autorOwner||raw.authorOwner||raw.autorGastoOwner||'both'),
    otrosGastos:Number(raw.otrosGastos||0),
    expenseOwner:normalizeExpenseOwner(raw.expenseOwner||raw.otrosGastosOwner||'both'),
    venueRental:Number(raw.alquiler||venue?.alquiler||0),
    status:{}
  };
}

// ══════════════════════════════════════════════════════════════
// CONVERSIÓN APP → SHEET
// autorPct = % sobre ventaNeta (backend calcula €)
// otrosGastos = importe directo en € que se resta a la venta neta
// ══════════════════════════════════════════════════════════════
function appShowToSheetData(show,config){
  const ps=show.platformSnapshots||{};
  const inc=show.income||{};
  const platformData=Object.entries(ps).map(([id,snap])=>({
    id, name:snap.name, income:Number(inc[id]??snap.income??0),
    commission:Number(snap.commission||0), ivaOnCommission:snap.ivaOnCommission===true
  }));
  function findAmount(platName){ const pl=config.platforms.find(p=>normalize(p.name)===normalize(platName)); return pl?Number(inc[pl.id]??ps[pl.id]?.income??0):0; }
  const autorPct=r2(Number(show.autorPct||0));
  const autorOwner=normalizeExpenseOwner(show.autorOwner||'both');
  const otrosGastos=r2(Number(show.otrosGastos||0));
  const expenseOwner=normalizeExpenseOwner(show.expenseOwner||'both');
  const venue=config.venues.find(v=>v.id===show.venueId||normalize(v.name)===normalize(show.venueName));
  const alquiler=r2(Number(show.venueRental??venue?.alquiler??0));
  const c=calcShow({...show,autorOwner,expenseOwner});
  return {
    action:'saveShow', appId:show.appId||show.id||gid('s'),
    sala:show.venueName||'', obra:show.workName||'', fecha:show.date||'',
    atrapalo:findAmount('Atrápalo'), fever:findAmount('Fever'), kultur:findAmount('Kultur'),
    abonoteatro:findAmount('Abonoteatro'), laopcion:findAmount('Laopcion'), universe:findAmount('Universe'),
    efectivo:Number(inc.cashBox||0), tarjeta:Number(inc.cardBox||0),
    autorPct, autorOwner, otrosGastos, expenseOwner, alquiler,
    cache:c.cache, acuerdo:c.agreement?.name||'',
    observaciones:show.notes||'', platformData
  };
}

// ══════════════════════════════════════════════════════════════
// CÁLCULO LOCAL
// ══════════════════════════════════════════════════════════════
function calcShow(show){
  const ps=show.platformSnapshots||{}, inc=show.income||{};
  const commissions=[]; let totalPlatIncome=0, totalComm=0;
  Object.entries(ps).forEach(([pid,snap])=>{
    const amt=r2(Number(inc[pid]??snap.income??0)); totalPlatIncome+=amt;
    const base=r2(amt*Number(snap.commission||0)/100);
    const iva=snap.ivaOnCommission?r2(base*0.21):0;
    const total=r2(base+iva);
    commissions.push({id:pid,name:snap.name,income:amt,commBase:base,commIva:iva,commTotal:total});
    totalComm+=total;
  });
  const cashBox=r2(parseFloat(inc.cashBox)||0);
  const cardBox=r2(parseFloat(inc.cardBox)||0);
  const ventaBruta=r2(totalPlatIncome+cashBox+cardBox);
  const ventaNeta=r2(ventaBruta/1.10);
  const autorPct=r2(Number(show.autorPct||0));
  const autorImporte=r2(ventaNeta*autorPct/100);
  const autorOwner=normalizeExpenseOwner(show.autorOwner||'both');
  const otrosGastos=r2(Number(show.otrosGastos||0));
  const expenseOwner=normalizeExpenseOwner(show.expenseOwner||'both');
  const venueRental=r2(Number(show.venueRental||0));

  // Gastos fijos antes del reparto: comisiones de plataformas y alquiler.
  // Autor y otros gastos ahora pueden ir a ambas partes, La Opción o compañía.
  const autorBoth=autorOwner==='both'?autorImporte:0;
  const autorLaOpcion=autorOwner==='laopcion'?autorImporte:0;
  const autorCompany=autorOwner==='company'?autorImporte:0;
  const otrosBoth=expenseOwner==='both'?otrosGastos:0;
  const otrosLaOpcion=expenseOwner==='laopcion'?otrosGastos:0;
  const otrosCompany=expenseOwner==='company'?otrosGastos:0;

  const gastosComunes=r2(totalComm+venueRental);
  const gastosAntesReparto=r2(gastosComunes+autorBoth+otrosBoth);
  const baseReparto=r2(ventaNeta-gastosAntesReparto);
  const totalGastos=r2(gastosComunes+autorImporte+otrosGastos);
  const totalNeto=r2(ventaNeta-totalGastos);

  const agr=show.agreementSnapshot;
  const calcCacheFromBase=(base)=>{
    if(!agr) return 0;
    return agr.mode==='percentage'?r2(base*Number(agr.value||0)/100):r2(Number(agr.value||0));
  };

  const cacheBase=calcCacheFromBase(baseReparto);
  const cache=r2(cacheBase-autorCompany-otrosCompany);
  const restanteOpcion=r2(baseReparto-cacheBase-autorLaOpcion-otrosLaOpcion);

  return {commissions,cashBox,cardBox,ventaBruta,ventaNeta,totalComm:r2(totalComm),autorImporte,autorOwner,otrosGastos,expenseOwner,venueRental,gastosComunes,gastosAntesReparto,baseReparto,totalGastos,totalNeto,cacheBase,cache,restanteOpcion,agreement:agr};
}

  return d;
}

function resetDashboardFilters(){
  S.dashboardFilters={month:'',from:'',to:'',venueId:'',workId:'',platformId:'',agreementId:''};
}

function getDashboardFilteredShows(){
  const f=S.dashboardFilters||{};
  return S.shows.filter(show=>{
    const date=show.date||'';
    if(f.month && !date.startsWith(f.month)) return false;
    if(f.from && date && date<f.from) return false;
    if(f.to && date && date>f.to) return false;
    if(f.venueId && show.venueId!==f.venueId) return false;
    if(f.workId && show.workId!==f.workId) return false;
    if(f.agreementId && !matchesAgreementFilter(show,f.agreementId)) return false;
    if(f.platformId){
      const inc=show.income||{};
      if(Number(inc[f.platformId]||0)<=0) return false;
    }
    return true;
  });
}

function groupTotal(list,keyFn,valueFn){
  const out={};
  list.forEach(item=>{
    const key=keyFn(item)||'Sin datos';
    out[key]=(out[key]||0)+Number(valueFn(item)||0);
  });
  return out;
}

function bestEntry(obj){
  const entries=Object.entries(obj).sort(([,a],[,b])=>b-a);
  return entries[0]||['—',0];
}

function renderMiniBars(entries,maxValue,colorVar='var(--cyan)',limit=8){
  const rows=entries.slice(0,limit);
  const mx=Math.max(...rows.map(([,v])=>Math.abs(Number(v||0))),1);
  return rows.map(([name,total])=>`<div class="bar-row"><span class="bar-label" title="${esc(name)}">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(total)/mx*100).toFixed(1)}%;background:${colorVar}"></div></div><span class="bar-value">${fmt(total)}</span></div>`).join('')||'<div class="empty">Sin datos</div>';
}


async function loadFromSheet(opts={}){
  const manual=!!opts.manual;
  if(REFRESH_LOCK) return;
  REFRESH_LOCK=true;S.isLoading=!S.isSaving;S.isRefreshing=manual;S.loadError=null;render();
  try{
    const data=await apiPost({action:'getAll'});
    if(data.config) S.config={platforms:data.config.platforms||[],venues:data.config.venues||[],works:data.config.works||[],expenseTypes:data.config.expenseTypes||[],agreements:data.config.agreements||[]};
    S.shows=Array.isArray(data.shows)?data.shows.map(raw=>sheetShowToAppShow(raw,S.config)):[];
    if(S.shows.length>0&&!S.summaryMonth){const months=[...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();S.summaryMonth=months[0]||'';}
    S.lastSyncAt=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(manual) showToast(`Datos actualizados (${S.shows.length} funciones)`,'success');
  }catch(err){S.loadError=err.message;showToast('Error al cargar datos: '+err.message,'error');}
  finally{S.isLoading=false;S.isRefreshing=false;REFRESH_LOCK=false;render();}
}

}

function ensureShowFilters(){
  if(!S.showFilters) S.showFilters={month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'};
  if(S.search===undefined||S.search===null) S.search='';
  return S.showFilters;
}
function getShowMonths(){
  return [...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
}
function getFilteredShowList(){
  const f=ensureShowFilters();
  const q=normalize(S.search);
  let cs=S.shows.map(s=>({...s,c:calcShow(s)})).filter(s=>{
    const searchText=normalize([s.date,s.workName,s.venueName,s.agreementSnapshot?.name,s.notes].join(' '));
    if(q && !searchText.includes(q)) return false;
    if(f.month && !(s.date||'').startsWith(f.month)) return false;
    if(f.venueId && s.venueId!==f.venueId) return false;
    if(f.workId && s.workId!==f.workId) return false;
    if(f.agreementId && !matchesAgreementFilter(s,f.agreementId)) return false;
    return true;
  });
  const sort=f.sort||'dateDesc';
  cs.sort((a,b)=>{
    if(sort==='dateAsc') return (a.date||'').localeCompare(b.date||'');
    if(sort==='workAsc') return (a.workName||'').localeCompare(b.workName||'','es') || (b.date||'').localeCompare(a.date||'');
    if(sort==='venueAsc') return (a.venueName||'').localeCompare(b.venueName||'','es') || (b.date||'').localeCompare(a.date||'');
    if(sort==='restDesc') return (b.c.restanteOpcion||0)-(a.c.restanteOpcion||0);
    if(sort==='ventaDesc') return (b.c.ventaNeta||0)-(a.c.ventaNeta||0);
    return (b.date||'').localeCompare(a.date||'');
  });
  return cs;
}
function updateShowSearchLive(){
  const input=document.querySelector('[data-bind="search"]');
  if(input) S.search=input.value;
  const q=normalize(S.search);
  let visible=0;
  document.querySelectorAll('[data-show-row="1"]').forEach(row=>{
    const ok=!q || normalize(row.dataset.searchText||'').includes(q);
    row.style.display=ok?'':'none';
    if(ok) visible++;
  });
  document.querySelectorAll('[data-show-card="1"]').forEach(card=>{
    const ok=!q || normalize(card.dataset.searchText||'').includes(q);
    card.style.display=ok?'':'none';
  });
  const count=document.getElementById('show-list-count');
  if(count) count.textContent=`${visible} de ${S.shows.length} funciones`;
  const empty=document.getElementById('show-list-empty-live');
  if(empty) empty.style.display=visible===0?'table-row':'none';
  const emptyCards=document.getElementById('show-list-empty-cards');
  if(emptyCards) emptyCards.style.display=visible===0?'block':'none';
}

// FORMULARIO — sirve tanto para nueva función como para editar
// isEdit=true carga el draft desde el show existente

// ══════════════════════════════════════════════════════════════
function renderShowForm(isEdit){
  const isU=S.role==='user';
  const d=S.newShowDraft||(isEdit?null:emptyDraft());
  if(!d) return '<div class="card"><div class="empty">Error al cargar el formulario.</div></div>';
  if(!d.income) d.income={};
  S.newShowDraft=d;

  const selectedWork=S.config.works.find(w=>w.id===d.workId);
  const legacyAgreement=d.agreementId?getLegacyAgreementById(S.config,d.agreementId):null;
  const resolvedAgreement=resolveAgreementForWork(selectedWork,S.config,legacyAgreement);
  if(selectedWork&&resolvedAgreement.id&&d.agreementId!==resolvedAgreement.id) d.agreementId=resolvedAgreement.id;

  const workOpts=getActiveSorted(S.config.works).map(w=>`<option value="${w.id}" ${d.workId===w.id?'selected':''}>${esc(w.name)}</option>`).join('');
  const venueOpts=getActiveSorted(S.config.venues).map(v=>`<option value="${v.id}" ${d.venueId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');

  const selectedVenue=S.config.venues.find(v=>v.id===d.venueId);
  const venueRental=Number(selectedVenue?.alquiler||0);
  const rentalInfo=d.venueId?`<p class="dim" style="font-size:12px;margin-top:-4px;margin-bottom:12px">Alquiler configurado: <strong style="color:var(--yellow)">${fmt(venueRental)}</strong> (se aplica automáticamente)</p>`:'';

  const agreementInfo=d.workId
    ? (resolvedAgreement.snapshot
      ? `<p class="dim" style="font-size:12px;margin-top:-4px;margin-bottom:12px">Acuerdo vinculado a la obra: <strong style="color:var(--cyan)">${esc(resolvedAgreement.snapshot.name)}</strong> · ${resolvedAgreement.snapshot.mode==='fixed'?'Fijo':'Porcentaje'} ${agreementValueLabel(resolvedAgreement.snapshot)}</p>`
      : `<div class="dirty-note">⚠️ Esta obra todavía no tiene acuerdo configurado. Ve a Administración → Obras y completa tipo y valor del acuerdo.</div>`)
    : `<p class="dim" style="font-size:12px;margin-top:-4px;margin-bottom:12px">Selecciona una obra para aplicar automáticamente su acuerdo.</p>`;

  const platFields=getActiveSorted(S.config.platforms).map(p=>{
    const label=isU?esc(p.name):`${esc(p.name)} (${p.commission}%${p.ivaOnCommission?' +IVA':''})`;
    return `<div class="field"><label>${label}</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.income[p.id]||''}" data-plat-id="${p.id}"/></div>`;
  }).join('');

  const isDup=S.isDuplicating===true&&!isEdit;
  const title=isEdit?'Editar función':(isDup?'Duplicar función':(isU?'Registrar ingreso':'Nueva función'));
  const btnLabel=isEdit?'💾 Guardar cambios':(isDup?'📄 Crear función duplicada':'💾 Guardar');
  const duplicateNote=isDup?`<div class="dirty-note">📄 Estás duplicando una función. Puedes cambiar fecha, sala, obra o importes. Al guardar se creará un registro nuevo y el original no se modificará.</div>`:'';

  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:22px"><button class="btn btn-ghost" data-view="${isEdit?'shows':'shows'}">← Volver</button><h1 class="page-title" style="font-size:22px">${title}</h1></div>${duplicateNote}<div class="grid grid-2 mb20"><div class="card"><h3>Datos básicos</h3><div class="field"><label>Obra *</label><select data-field="workId"><option value="">— Seleccionar —</option>${workOpts}</select></div>${agreementInfo}<div class="field"><label>Sala *</label><select data-field="venueId"><option value="">— Seleccionar —</option>${venueOpts}</select></div>${rentalInfo}<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Fecha *</label><input type="date" value="${esc(d.date)}" data-field="date"/></div><div class="field" style="flex:1"><label>Hora</label><input type="time" value="${esc(d.time)}" data-field="time"/></div></div><div class="field"><label>Observaciones</label><textarea data-field="notes" placeholder="Notas...">${esc(d.notes)}</textarea></div></div><div class="card"><h3>Ingresos</h3>${platFields||'<p class="dim">No hay plataformas activas.</p>'}<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:6px"><div class="field"><label>Taquilla efectivo</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.income.cashBox||''}" data-plat-id="cashBox"/></div><div class="field"><label>Taquilla tarjeta</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.income.cardBox||''}" data-plat-id="cardBox"/></div></div></div><div class="card"><h3>Gastos</h3><div class="field"><label>Autor (% sobre venta neta)</label><input type="number" min="0" max="100" step="0.01" placeholder="0" value="${d.autorPct||''}" data-expense-flat="autorPct"/></div><div class="field"><label>¿A quién va autor?</label><select data-autor-owner><option value="both" ${normalizeExpenseOwner(d.autorOwner)==='both'?'selected':''}>Ambas partes — se resta antes del acuerdo</option><option value="laopcion" ${normalizeExpenseOwner(d.autorOwner)==='laopcion'?'selected':''}>La Opción — se resta solo a La Opción</option><option value="company" ${normalizeExpenseOwner(d.autorOwner)==='company'?'selected':''}>Compañía — se resta del caché</option></select></div><div class="field"><label>Otros gastos (€)</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.otrosGastos||''}" data-expense-flat="otrosGastos"/></div><div class="field"><label>¿A quién van otros gastos?</label><select data-expense-owner><option value="both" ${normalizeExpenseOwner(d.expenseOwner)==='both'?'selected':''}>Ambas partes — se resta antes del acuerdo</option><option value="laopcion" ${normalizeExpenseOwner(d.expenseOwner)==='laopcion'?'selected':''}>La Opción — se resta solo a La Opción</option><option value="company" ${normalizeExpenseOwner(d.expenseOwner)==='company'?'selected':''}>Compañía — se resta del caché</option></select></div><p class="dim" style="font-size:11px;margin-top:-4px">Por defecto “Ambas partes” mantiene el cálculo anterior.</p></div></div><div style="display:flex;gap:10px"><button class="btn btn-primary" data-action="saveNewShow" ${S.isSaving?'disabled':''}>${S.isSaving?'⏳ Guardando...':btnLabel}</button><button class="btn btn-secondary" data-view="shows" ${S.isSaving?'disabled':''}>Cancelar</button></div>`;

function renderSummary(){
  const months=[...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const sel=S.summaryMonth||months[0]||'';
  const opts=months.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${m}</option>`).join('');
  const cs=S.shows.filter(s=>(s.date||'').startsWith(sel)).map(s=>({...s,c:calcShow(s)}));
  const byWork={};
  cs.forEach(s=>{const k=s.workName||'Sin obra';if(!byWork[k])byWork[k]={work:k,venue:s.venueName,ingreso:0,coste:0,beneficio:0};byWork[k].ingreso+=s.c.totalNeto;byWork[k].coste+=s.c.cache;byWork[k].beneficio+=s.c.restanteOpcion;});
  const rows=Object.values(byWork);
  const totB=rows.reduce((s,r)=>s+r.beneficio,0);
  rows.forEach(r=>{r.pct=totB!==0?r2(r.beneficio/totB*100):0;});
  const tableRows=rows.map(r=>`<tr><td>${esc(r.venue)}</td><td>${esc(r.work)}</td><td class="right">${fmt(r.ingreso)}</td><td class="right">${fmt(r.coste)}</td><td class="right fw700 ${r.beneficio>=0?'success':'danger'}">${fmt(r.beneficio)}</td><td class="right">${fmtPct(r.pct)}</td></tr>`).join('');
  const platTotals={};
  cs.forEach(s=>{s.c.commissions.forEach(c=>{platTotals[c.name]=(platTotals[c.name]||0)+c.income;});platTotals['Taq. Efectivo']=(platTotals['Taq. Efectivo']||0)+s.c.cashBox;platTotals['Taq. Tarjeta']=(platTotals['Taq. Tarjeta']||0)+s.c.cardBox;});
  const platCards=Object.entries(platTotals).sort(([,a],[,b])=>b-a).map(([name,total])=>`<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:14px 16px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px">${esc(name)}</div><div style="font-size:18px;font-family:'Outfit',sans-serif;font-weight:800;color:var(--cyan)">${fmt(total)}</div></div>`).join('');
  return `<h1 class="page-title">Resumen Mensual</h1><p class="page-sub mb20">Visión por obra y plataforma</p><div style="display:flex;gap:8px;align-items:center;margin-bottom:18px"><span class="dim">📅</span><select data-bind="summaryMonth" class="inline-input" style="max-width:160px">${opts}</select><span class="dim" style="font-size:12px">${cs.length} funciones</span></div><div class="card mb20"><h3>Resumen por obra</h3><div class="table-wrap"><table><thead><tr><th>Sala</th><th>Obra</th><th class="right">Ingreso</th><th class="right">Coste CIA</th><th class="right">Beneficios</th><th class="right">%</th></tr></thead><tbody>${tableRows||'<tr><td colspan="6" class="empty">Sin datos</td></tr>'}</tbody></table></div></div><div class="card"><h3>Resumen por plataforma</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${platCards||'<div class="empty">Sin datos</div>'}</div></div>`;
}

// EVENTS
// ══════════════════════════════════════════════════════════════
function bindEvents(){
  document.querySelectorAll('[data-view]').forEach(btn=>{
    btn.onclick=()=>{
      if(S.isSaving)return showToast('Espera a que termine el guardado.','warn');
      const targetView=btn.dataset.view;
      if(!isViewAllowedForRole(targetView,S.role)){
        S.view=defaultViewForRole(S.role);
        showToast('No tienes permisos para acceder a esa sección.','error');
        return render();
      }
      S.view=targetView;
      S.selectedId=null;
      S.editShowId=null;
      S.isDuplicating=false;
      S.duplicateSourceId=null;
      if(S.view==='newshow'){S.newShowDraft=emptyDraft();}
      else if(S.view!=='editshow'){S.newShowDraft=null;}
      render();
    };
  });

  document.querySelectorAll('[data-action]').forEach(btn=>{
    btn.onclick=()=>{
      const a=btn.dataset.action;
      if(a==='logout')       return handleLogout();
      if(a==='refresh')      return loadFromSheet({manual:true});
      if(a==='resetDashboardFilters'){resetDashboardFilters();return render();}
      if(a==='clearShowFilters'){S.search='';S.showFilters={month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'};return render();}
      if(a==='saveNewShow')  {btn.disabled=true;btn.innerHTML='⏳ Guardando...';return handleSaveShow();}
      if(a==='saveConfig')   return saveConfigToSheet();
      if(a==='addConfig')    return addConfigItem(btn.dataset.addConfigTab);
      if(a==='createUser')   return handleCreateUser();
      if(a==='updateUser')   return handleUpdateUser(btn.dataset.userId);
      if(a==='refreshUsers') return loadUsers();
      if(a==='viewShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        if(show){S.selectedId=show.id;S.view='detail';S.isDuplicating=false;S.duplicateSourceId=null;render();}
        return;
      }
      if(a==='editShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        if(show){S.editShowId=show.id;S.newShowDraft=showToDraft(show);S.isDuplicating=false;S.duplicateSourceId=null;S.view='editshow';render();}
        return;
      }
      if(a==='duplicateShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        if(show){
          S.editShowId=null;
          S.selectedId=null;
          S.newShowDraft=showToDuplicateDraft(show);
          S.isDuplicating=true;
          S.duplicateSourceId=show.appId||show.id||'';
          S.view='newshow';
          showToast('Copia preparada. Revisa los datos y guarda para crear una función nueva.','warn');
          render();
        }
        return;
      }
    };
  });

  document.querySelectorAll('tbody tr.clickable[data-show-id]').forEach(row=>{
    row.onclick=()=>{
      const show=S.shows.find(s=>s.id===row.dataset.showId);
      if(show){S.selectedId=show.id;S.view='detail';render();}
    };
  });

  document.querySelectorAll('[data-admin-tab]').forEach(btn=>{
    btn.onclick=()=>{S.adminTab=btn.dataset.adminTab;if(S.adminTab==='users')loadUsers();render();};
  });

  document.querySelectorAll('[data-dash-filter]').forEach(el=>{
    el.onchange=()=>{
      if(!S.dashboardFilters) resetDashboardFilters();
      S.dashboardFilters[el.dataset.dashFilter]=el.value;
      render();
    };
  });

  document.querySelectorAll('[data-show-filter]').forEach(el=>{
    el.onchange=()=>{
      ensureShowFilters();
      S.showFilters[el.dataset.showFilter]=el.value;
      render();
    };
  });

  const si=document.querySelector('[data-bind="search"]');
  if(si){
    si.oninput=()=>updateShowSearchLive();
    si.onsearch=()=>updateShowSearchLive();
  }
  const sm=document.querySelector('[data-bind="summaryMonth"]');
  if(sm) sm.onchange=()=>{S.summaryMonth=sm.value;render();};
  // campos básicos — selects en change y textos en input para evitar doble disparo
  document.querySelectorAll('[data-field]').forEach(el=>{
    const updateDraftField=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      const field=el.dataset.field;
      S.newShowDraft[field]=el.value;
      if(field==='workId'){
        const work=S.config.works.find(w=>w.id===el.value);
        const resolved=resolveAgreementForWork(work,S.config);
        S.newShowDraft.agreementId=resolved.id||'';
        render();
      } else if(field==='venueId'){
        render();
      }
    };
    if(el.tagName==='SELECT') el.onchange=updateDraftField;
    else el.oninput=updateDraftField;
  });
  // ingresos plataformas
  document.querySelectorAll('[data-plat-id]').forEach(el=>{
    el.oninput=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      if(!S.newShowDraft.income) S.newShowDraft.income={};
      // Guardar como número directamente, nunca como string
      S.newShowDraft.income[el.dataset.platId]=parseFloat(el.value)||0;
    };
  });
  // gastos planos: UN SOLO evento, valor numérico inmediato
  document.querySelectorAll('[data-expense-flat]').forEach(el=>{
    el.oninput=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      // parseFloat una sola vez, nunca acumular
      S.newShowDraft[el.dataset.expenseFlat]=parseFloat(el.value)||0;
    };
  });
  document.querySelectorAll('[data-autor-owner]').forEach(el=>{
    el.onchange=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      S.newShowDraft.autorOwner=normalizeExpenseOwner(el.value);
    };
  });
  document.querySelectorAll('[data-expense-owner]').forEach(el=>{
    el.onchange=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      S.newShowDraft.expenseOwner=normalizeExpenseOwner(el.value);
    };
  });
  document.querySelectorAll('[data-cfg-field]').forEach(el=>{
    el.onchange=()=>updateConfigFromInput(el);
  });
}

async function handleLogout(){ try{if(S.token)await apiPost({action:'logout'});}catch(e){} clearSession(true); }
function getConfigItem(tab,id){ const meta=CONFIG_META[tab]; return (S.config[meta.key]||[]).find(x=>x.id===id); }
function updateConfigFromInput(el){
  const item=getConfigItem(el.dataset.cfgTab,el.dataset.cfgId);if(!item)return;
  const field=el.dataset.cfgField;
  let value=el.type==='checkbox'?el.checked:el.value;
  if(['commission','value','alquiler','agreementValue'].includes(field)) value=Number(value||0);
  if(field==='ivaOnCommission') value=value==='true';
  item[field]=value;
  if(el.dataset.cfgTab==='works'){
    if(!item.agreementName) item.agreementName=item.name;
    syncWorkAgreementToConfig(item);
  }
  S.configDirty=true;
}
function addConfigItem(tab){
  const meta=CONFIG_META[tab];
  const inputs=[...document.querySelectorAll(`[data-add-tab="${tab}"]`)];
  const values={};inputs.forEach(i=>values[i.dataset.add]=i.value);
  const name=String(values.name||'').trim();
  if(!name)return showToast('Introduce un nombre.','error');
  let item={id:gid(meta.prefix),name,active:true};
  if(tab==='platforms') item={...item,commission:Number(values.commission||0),ivaOnCommission:values.ivaOnCommission==='true'};
  if(tab==='venues')    item={...item,alquiler:Number(values.alquiler||0)};
  if(tab==='works')     item={...item,agreementId:gid('wa'),agreementName:String(values.agreementName||name).trim(),agreementMode:values.agreementMode||'percentage',agreementValue:Number(values.agreementValue||0)};
  if(tab==='agreements')item={...item,mode:values.mode||'percentage',value:Number(values.value||0)};
  S.config[meta.key].push(item);
  if(tab==='works') syncWorkAgreementToConfig(item);
  S.configDirty=true;
  inputs.forEach(i=>{if(i.tagName==='INPUT')i.value='';});
  showToast(`${meta.singular[0].toUpperCase()+meta.singular.slice(1)} añadido. Guarda los cambios.`,'success');
  render();
}
async function handleCreateUser(){
  const email=document.getElementById('new-user-email')?.value.trim();
  const password=document.getElementById('new-user-password')?.value;
  const role=document.getElementById('new-user-role')?.value||'user';
  if(!email||!password)return showToast('Introduce email y contraseña.','error');
  try{await apiPost({action:'createUser',email,password,role,active:true});showToast('Usuario creado','success');await loadUsers();}
  catch(err){showToast(err.message,'error');}
}
async function handleUpdateUser(id){
  const role=document.querySelector(`[data-user-role="${id}"]`)?.value;
  const active=document.querySelector(`[data-user-active="${id}"]`)?.checked;
  const password=document.querySelector(`[data-user-pass="${id}"]`)?.value;
  const payload={action:'updateUser',id,role,active};
  if(password)payload.password=password;
  try{await apiPost(payload);showToast('Usuario actualizado','success');await loadUsers();}
  catch(err){showToast(err.message,'error');}
}

// ══════════════════════════════════════════════════════════════
// GUARDAR FUNCIÓN (nueva o edición)
// ══════════════════════════════════════════════════════════════
async function handleSaveShow(){
  if(SAVE_LOCK||S.isSaving)return showToast('Ya se está guardando. Espera.','warn');
  const d=S.newShowDraft;
  if(!d)          return showToast('Rellena el formulario','error');
  if(!d.workId)   return showToast('Selecciona una obra','error');
  if(!d.venueId)  return showToast('Selecciona una sala','error');
  if(!d.date)     return showToast('Introduce una fecha','error');

  const work=S.config.works.find(w=>w.id===d.workId);
  const venue=S.config.venues.find(v=>v.id===d.venueId);
  const legacyAgreement=d.agreementId?getLegacyAgreementById(S.config,d.agreementId):null;
  const resolvedAgreement=resolveAgreementForWork(work,S.config,legacyAgreement);

  const income={};
  S.config.platforms.forEach(p=>{income[p.id]=parseFloat(d.income?.[p.id])||0;});
  income.cashBox=parseFloat(d.income?.cashBox)||0;
  income.cardBox=parseFloat(d.income?.cardBox)||0;

  if(Object.values(income).some(v=>v<0))return showToast('No se admiten importes negativos','error');

  // Sanitizar al guardar: parseFloat sobre el valor crudo del draft,
  // nunca Number(string_acumulado). Si el draft tiene "4.424.42" por
  // doble disparo, parseFloat devuelve 4.42 (para en el primer punto).
  const autorPct   = Math.max(0, parseFloat(String(d.autorPct    ?? 0)) || 0);
  const autorOwner = normalizeExpenseOwner(d.autorOwner||'both');
  const otrosGastos= Math.max(0, parseFloat(String(d.otrosGastos ?? 0)) || 0);
  const expenseOwner=normalizeExpenseOwner(d.expenseOwner||'both');
  const venueRental= Number(venue?.alquiler || 0);

  // Si es edición, mantiene el appId existente; si es nuevo, genera uno
  const appId=d.appId||gid('s');
  d.appId=appId;

  const show={
    id:appId, appId,
    workId:d.workId, venueId:d.venueId,
    workName:work?.name||'', venueName:venue?.name||'',
    date:d.date, time:d.time||'',
    agreementId:resolvedAgreement.id,
    agreementSnapshot:resolvedAgreement.snapshot,
    notes:d.notes||'',
    income, platformSnapshots:{},
    autorPct, autorOwner, otrosGastos, expenseOwner, venueRental,
    status:{}
  };

  S.config.platforms.forEach(p=>{
    show.platformSnapshots[p.id]={name:p.name,commission:p.commission,ivaOnCommission:p.ivaOnCommission,income:income[p.id]||0};
  });

  await saveShowToSheet(show);
}

boot();
