form-finance-row{border-top:1px solid var(--border);font-size:12px}.platform-finance-row:hover{background:var(--surface-alt)}.platform-finance-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.platform-finance-value{text-align:right;font-variant-numeric:tabular-nums}.platform-finance-total{background:rgba(110,200,228,.05);border-radius:0 0 10px 10px;font-weight:800}.platform-finance-note{margin-top:10px;color:var(--text-dim);font-size:10px;line-height:1.4}@media(max-width:600px){.platform-finance{overflow-x:auto}.platform-finance-head,.platform-finance-row{min-width:520px}.info-tip::after{left:auto;right:-10px;transform:translateY(4px)}.info-tip:hover::after,.info-tip:focus::after{transform:translateY(0)}}

<body>
<div id="app"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyCwwMRxy6J4l1oqF9BqgvzHZ7DKSASqytV2B7anHsokG0VTraeTBLfTHXDEwS11uQDXQ/exec";
const STORAGE_KEY = 'laopcion_session_v3';
const $app = document.getElementById('app');

const S = {
  token:'', user:null, role:null, view:'dashboard', selectedId:null, editShowId:null,
  search:'', showFilters:{month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'}, toast:null, toastTimer:null,
  adminTab:'platforms', summaryMonth:'', isLoading:false, isSaving:false, isRefreshing:false,
  isBooting:false, isLoggingIn:false, lastSyncAt:'', loadError:null, configDirty:false,
  users:[], newShowDraft:null, isDuplicating:false, duplicateSourceId:null,
  dashboardFilters:{month:'',from:'',to:'',weekday:'',venueId:'',workId:'',platformId:'',agreementId:''},
  config:{ platforms:[], venues:[], works:[], expenseTypes:[], agreements:[] }, shows:[]
};
let SAVE_LOCK=false; let REFRESH_LOCK=false; let LOGIN_LOCK=false;

const CONFIG_META = {
  platforms: { key:'platforms',  title:'Plataformas', singular:'plataforma', prefix:'p'  },
  venues:    { key:'venues',     title:'Salas',        singular:'sala',       prefix:'v'  },
  works:     { key:'works',      title:'Obras',        singular:'obra',       prefix:'w'  },
  agreements:{ key:'agreements', title:'Acuerdos',     singular:'acuerdo',    prefix:'a'  },
  expenses:  { key:'expenseTypes',title:'Gastos',      singular:'gasto',      prefix:'et' },
};

function gid(p='id'){ return p+'_'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,8); }
function fmt(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(Number(n||0)); }
function fmtPct(n){ return `${Number(n||0).toFixed(2)}%`; }
function r2(n){ return Math.round(Number(n||0)*100)/100; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normalize(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function infoTip(text){ return `<span class="info-tip" tabindex="0" role="img" aria-label="${esc(text)}" data-tip="${esc(text)}">i</span>`; }
function panelTitle(title,help){ return `<h3 class="panel-title"><span>${esc(title)}</span>${infoTip(help)}</h3>`; }

function normalizeExpenseOwner(owner){
  owner=normalize(owner||'both');
  if(['laopcion','la opcion','opcion','option'].includes(owner)) return 'laopcion';
  if(['company','compania','cia'].includes(owner)) return 'company';
  if(['cache','cache la opcion','cachelaopcion','gasto cache','gasto de cache'].includes(owner)) return 'cache';
  return 'both';
}
function normalizeAutorOwner(owner){
  const key=normalizeExpenseOwner(owner);
  return key==='cache'?'both':key;
}
function expenseOwnerLabel(owner){
  const key=normalizeExpenseOwner(owner);
  if(key==='laopcion') return 'La Opción';
  if(key==='company') return 'Compañía';
  if(key==='cache') return 'Extra de caché a cargo de La Opción';
  return 'Ambas partes';
}

// ── DÍA DE LA SEMANA ─────────────────────────────────────────
const WEEKDAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const WEEKDAYS_SHORT=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function weekdayIndexFromDate(dateStr){
  if(!dateStr||!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr))) return -1;
  const d=new Date(dateStr+'T12:00:00');
  if(isNaN(d.getTime())) return -1;
  return (d.getDay()+6)%7; // 0 = lunes
}
function weekdayName(dateStr){ const i=weekdayIndexFromDate(dateStr); return i<0?'':WEEKDAYS[i]; }
function weekdayShort(dateStr){ const i=weekdayIndexFromDate(dateStr); return i<0?'':WEEKDAYS_SHORT[i]; }
function shiftDateToWeekday(dateStr,targetIndex){
  const i=weekdayIndexFromDate(dateStr);
  if(i<0) return dateStr;
  const d=new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate()+(Number(targetIndex)-i));
  const pad=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function weekdayOptions(selectedIndex){ return WEEKDAYS.map((n,i)=>`<option value="${i}" ${String(selectedIndex)===String(i)?'selected':''}>${n}</option>`).join(''); }
function weekdayFilterOptions(selected){ return `<option value="">Todos</option>`+WEEKDAYS.map((n,i)=>`<option value="${i}" ${String(selected)===String(i)?'selected':''}>${n}</option>`).join(''); }
function matchesWeekday(dateStr,weekday){
  if(weekday===''||weekday===null||weekday===undefined) return true;
  return String(weekdayIndexFromDate(dateStr))===String(weekday);
}

function alphaSortByName(list){ return [...(list||[])].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'})); }
function getActiveSorted(list){ return alphaSortByName((list||[]).filter(x=>x.active!==false)); }
function getLegacyAgreementById(config,id){ return (config?.agreements||[]).find(a=>a.id===id)||null; }
function getLegacyAgreementByName(config,name){
  const list=config?.agreements||[];
  const exact=list.find(a=>String(a.name||'').trim()===String(name||'').trim());
  if(exact) return exact;
  const loose=list.filter(a=>normalize(a.name)===normalize(name));
  return loose.length===1?loose[0]:null;
}
function hasWorkAgreement(work){ return !!(work&&(work.agreement||work.agreementId||work.agreementMode||work.agreementValue!==undefined||work.agreementName)); }
function agreementFromWork(work){
  if(!hasWorkAgreement(work)) return null;
  const raw=(work.agreement&&typeof work.agreement==='object')?work.agreement:{};
  const id=raw.id||work.agreementId||`wa_${work.id||gid('w')}`;
  const name=raw.name||work.agreementName||work.name||'Acuerdo';
  const mode=raw.mode||work.agreementMode||'percentage';
  const value=Number(raw.value??work.agreementValue??0);
  return {id,name,mode,value};
}
function resolveAgreementForWork(work,config,legacyAgreement=null){
  let linked=agreementFromWork(work);
  if(work?.agreementId&&!work.agreement&&!work.agreementName&&!work.agreementMode&&work.agreementValue===undefined){
    const legacyById=getLegacyAgreementById(config,work.agreementId);
    if(legacyById) linked={id:legacyById.id,name:legacyById.name,mode:legacyById.mode||'percentage',value:Number(legacyById.value||0)};
  }
  const fallback=legacyAgreement||null;
  const agr=linked||fallback;
  if(!agr) return {id:'',snapshot:null};
  return {id:agr.id||'',snapshot:{name:agr.name||work?.name||'Acuerdo',mode:agr.mode||'percentage',value:Number(agr.value||0)}};
}
function syncWorkAgreementToConfig(work,config=S.config){
  if(!work) return null;
  if(!work.agreementId) work.agreementId=`wa_${work.id||gid('w')}`;
  if(!work.agreementName) work.agreementName=work.name||'Acuerdo';
  if(!work.agreementMode) work.agreementMode='percentage';

  if(!Array.isArray(config.agreements)) config.agreements=[];
  let agr=config.agreements.find(a=>a.id===work.agreementId);

  agr.name=work.agreementName||work.name||agr.name;
  agr.mode=work.agreementMode||'percentage';
  agr.value=Number(work.agreementValue||0);
  agr.active=work.active!==false;
  work.agreement={id:work.agreementId,name:agr.name,mode:agr.mode,value:agr.value};

}

async function apiPost(payload){
  const body={...payload};
  if(S.token&&body.action!=='login'&&body.token===undefined) body.token=S.token;
  const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},cache:'no-store',body:JSON.stringify(body)});
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data=await resp.json();
  if(!data.ok){
    const msg=data.error||'Error desconocido';
    if(data.errorCode==='AUTH_REQUIRED') clearSession(false);
    const err=new Error(msg);err.code=data.errorCode||'SERVER_ERROR';throw err;
  }
  invalidateBusiness(body.action);
  if(data.user){ S.user=data.user; S.role=data.user.role; }
  return data;
}

function saveSession(token,user){
  S.token=token;
  S.user=user;
  S.role=user.role;
  normalizeCurrentView();
  localStorage.setItem(STORAGE_KEY,JSON.stringify({token,user}));
}
function clearSession(rn=true){ resetBars(); resetBusiness(); S.token='';S.user=null;S.role=null;S.view='dashboard';S.selectedId=null;S.editShowId=null;S.users=[];S.newShowDraft=null;S.search='';S.showFilters={month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'};S.isDuplicating=false;S.duplicateSourceId=null;localStorage.removeItem(STORAGE_KEY);if(rn)render(); }

async function boot(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw){render();return;}
  try{
    const saved=JSON.parse(raw);
    if(!saved.token) throw new Error('Sin token');
    S.token=saved.token;S.user=saved.user||null;S.role=saved.user?.role||null;normalizeCurrentView();S.isBooting=true;render();
    const me=await apiPost({action:'me'});
    saveSession(S.token,me.user);
    await loadFromSheet();
    if(S.role==='admin') await loadUsers();
  }catch(err){clearSession(false);}
  S.isBooting=false;render();
}

// CONVERSIÓN SHEET → APP
// CORREGIDO: usa el acuerdo con el que se guardó la función, respeta
// un alquiler guardado de 0 € y conserva los importes del Sheet.
// ══════════════════════════════════════════════════════════════
function sheetShowToAppShow(raw,config){
  const venue=config.venues.find(v=>normalize(v.name)===normalize(raw.sala))||null;
  const work=config.works.find(w=>String(w.name||'').trim()===String(raw.obra||'').trim())
          ||config.works.find(w=>normalize(w.name)===normalize(raw.obra))||null;
  const legacyAgreement=getLegacyAgreementByName(config,raw.acuerdo);
  const resolvedAgreement=resolveAgreementForWork(work,config,legacyAgreement);
  let agreementId=resolvedAgreement.id;
  let agreementSnapshot=resolvedAgreement.snapshot;
  const ad=raw.agreementData;
  if(ad&&typeof ad==='object'&&(ad.mode||ad.value!==undefined)){
    agreementId=ad.id||agreementId;
    agreementSnapshot={name:ad.name||raw.acuerdo||agreementSnapshot?.name||'Acuerdo',mode:ad.mode==='fixed'?'fixed':'percentage',value:Number(ad.value||0)};
  }

  const platformSnapshots={},income={};
  if(Array.isArray(raw.platformData)&&raw.platformData.length){
    raw.platformData.forEach(p=>{
      const cfg=config.platforms.find(x=>x.id===p.id||normalize(x.name)===normalize(p.name));
      const pid=cfg?.id||p.id||gid('p');
      const amt=Number(p.income||0);
      income[pid]=amt;
      platformSnapshots[pid]={name:cfg?.name||p.name||'Plataforma',commission:Number(p.commission??cfg?.commission??0),ivaOnCommission:Boolean(p.ivaOnCommission??cfg?.ivaOnCommission),income:amt};
    });
  } else {
    const platMap={atrapalo:'Atrápalo',fever:'Fever',kultur:'Kultur',abonoteatro:'Abonoteatro',laopcion:'Laopcion',universe:'Universe'};
    Object.entries(platMap).forEach(([k,platName])=>{
      const amt=Number(raw[k]||0);
      const pl=config.platforms.find(p=>normalize(p.name)===normalize(platName));
      if(pl){income[pl.id]=amt;platformSnapshots[pl.id]={name:pl.name,commission:pl.commission,ivaOnCommission:pl.ivaOnCommission,income:amt};}
    });
  }
  income.cashBox=Number(raw.efectivo||0);
  income.cardBox=Number(raw.tarjeta||0);

  const hasValue=v=>v!==null&&v!==undefined&&String(v).trim()!==''&&Number.isFinite(Number(v));
  const storedAmounts=(raw.storedAmounts&&typeof raw.storedAmounts==='object')
    ? raw.storedAmounts
    : {ventaBruta:raw.ventaBruta,ventaNeta:raw.ventaNeta,autor:raw.autor,alquiler:raw.alquiler,totalGastos:raw.totalGastos,totalNeto:raw.totalNeto,cache:raw.cache,restante:raw.restanteLaOpcion};

  return {
    id:raw.id||raw.appId||gid('s'), appId:raw.appId||raw.id||'',
    venueId:venue?.id||'', workId:work?.id||'',
    venueName:raw.sala||'', workName:raw.obra||'',
    date:raw.fecha||'', time:'',
    agreementId,
    agreementSnapshot,
    notes:raw.observaciones||'',
    income, platformSnapshots,
    storedAmounts,
    autorPct:Number(raw.autorPct||0),
    autorOwner:normalizeAutorOwner(raw.autorOwner||raw.authorOwner||raw.autorGastoOwner||'both'),
    otrosGastos:Number(raw.otrosGastos||0),
    expenseOwner:normalizeExpenseOwner(raw.expenseOwner||raw.otrosGastosOwner||'both'),
    venueRental:hasValue(raw.alquiler)?Number(raw.alquiler):Number(venue?.alquiler||0),
    status:{}
  };
}

// ══════════════════════════════════════════════════════════════
// CONVERSIÓN APP → SHEET
// CORREGIDO: envía workId y acuerdoId para que el backend no dependa del nombre
// ══════════════════════════════════════════════════════════════
function appShowToSheetData(show,config){
  const ps=show.platformSnapshots||{};
  const inc=show.income||{};
  const platformData=Object.entries(ps).map(([id,snap])=>({
    id, name:snap.name, income:Number(inc[id]??snap.income??0),
    commission:Number(snap.commission||0), ivaOnCommission:snap.ivaOnCommission===true
  }));
  function findAmount(platName){ const pl=config.platforms.find(p=>normalize(p.name)===normalize(platName)); return pl?Number(inc[pl.id]??ps[pl.id]?.income??0):0; }
  const autorPct=r2(Number(show.autorPct||0));
  const autorOwner=normalizeAutorOwner(show.autorOwner||'both');
  const otrosGastos=r2(Number(show.otrosGastos||0));
  const expenseOwner=normalizeExpenseOwner(show.expenseOwner||'both');
  const venue=config.venues.find(v=>v.id===show.venueId||normalize(v.name)===normalize(show.venueName));
  const alquiler=r2(Number(show.venueRental??venue?.alquiler??0));
  const c=calcShow({...show,autorOwner,expenseOwner});
  return {
    action:'saveShow', appId:show.appId||show.id||gid('s'),
    sala:show.venueName||'', obra:show.workName||'', fecha:show.date||'',
    workId:show.workId||'',
    acuerdoId:c.agreement?(show.agreementId||''):'',
    atrapalo:findAmount('Atrápalo'), fever:findAmount('Fever'), kultur:findAmount('Kultur'),
    abonoteatro:findAmount('Abonoteatro'), laopcion:findAmount('Laopcion'), universe:findAmount('Universe'),
    efectivo:Number(inc.cashBox||0), tarjeta:Number(inc.cardBox||0),
    autorPct, autorOwner, otrosGastos, expenseOwner, alquiler,
    cache:c.cache, acuerdo:c.agreement?.name||'',
    observaciones:show.notes||'', platformData
  };
}

// ══════════════════════════════════════════════════════════════
// CÁLCULO LOCAL (se usa al crear/editar una función)
// ══════════════════════════════════════════════════════════════
function calcShow(show){
  const ps=show.platformSnapshots||{}, inc=show.income||{};
  const commissions=[]; let totalPlatIncome=0, totalComm=0;
  Object.entries(ps).forEach(([pid,snap])=>{
    const amt=r2(Number(inc[pid]??snap.income??0)); totalPlatIncome+=amt;
    const base=r2(amt*Number(snap.commission||0)/100);
    const total=snap.ivaOnCommission?r2(base*1.21):base;
    const iva=r2(total-base);
    commissions.push({id:pid,name:snap.name,income:amt,commBase:base,commIva:iva,commTotal:total});
    totalComm+=total;
  });
  const cashBox=r2(parseFloat(inc.cashBox)||0);
  const cardBox=r2(parseFloat(inc.cardBox)||0);
  const ventaBruta=r2(totalPlatIncome+cashBox+cardBox);
  const ventaNeta=r2(ventaBruta/1.10);
  const autorPct=r2(Number(show.autorPct||0));
  const autorImporte=r2(ventaNeta*autorPct/100);
  const autorOwner=normalizeAutorOwner(show.autorOwner||'both');
  const otrosGastos=r2(Number(show.otrosGastos||0));
  const expenseOwner=normalizeExpenseOwner(show.expenseOwner||'both');
  const venueRental=r2(Number(show.venueRental||0));

  const autorBoth=autorOwner==='both'?autorImporte:0;
  const autorLaOpcion=autorOwner==='laopcion'?autorImporte:0;
  const autorCompany=autorOwner==='company'?autorImporte:0;
  const otrosBoth=expenseOwner==='both'?otrosGastos:0;
  const otrosLaOpcion=expenseOwner==='laopcion'?otrosGastos:0;
  const otrosCompany=expenseOwner==='company'?otrosGastos:0;
  const otrosCache=expenseOwner==='cache'?otrosGastos:0;
  const otrosGastosRegulares=r2(otrosGastos-otrosCache);

  const gastosComunes=r2(totalComm+venueRental);
  const gastosAntesReparto=r2(gastosComunes+autorBoth+otrosBoth);
  const baseReparto=r2(ventaNeta-gastosAntesReparto);
  const totalGastos=r2(gastosComunes+autorImporte+otrosGastosRegulares);
  const totalNeto=r2(ventaNeta-totalGastos);

  const agr=show.agreementSnapshot;
  const calcCacheFromBase=(base)=>{
    if(!agr) return 0;
    return agr.mode==='percentage'?r2(base*Number(agr.value||0)/100):r2(Number(agr.value||0));
  };

  const cacheBase=calcCacheFromBase(baseReparto);
  const cache=r2(cacheBase-autorCompany-otrosCompany+otrosCache);
  const restanteOpcion=r2(baseReparto-cacheBase-autorLaOpcion-otrosLaOpcion-otrosCache);

  return {commissions,cashBox,cardBox,ventaBruta,ventaNeta,totalComm:r2(totalComm),autorImporte,autorOwner,otrosGastos,otrosGastosRegulares,otrosCache,expenseOwner,venueRental,gastosComunes,gastosAntesReparto,baseReparto,totalGastos,totalNeto,cacheBase,cache,restanteOpcion,agreement:agr};
}

// ══════════════════════════════════════════════════════════════
// NUEVO: IMPORTES PARA MOSTRAR
// Todas las métricas (dashboard, lista, detalle, resumen) salen de los
// importes GUARDADOS en el Sheet. Antes se mezclaba el "Restante" guardado
// con el "Caché" recalculado con el acuerdo actual, y no cuadraba.
// ══════════════════════════════════════════════════════════════
function showAmounts(show){
  const c=calcShow(show);
  const st=show.storedAmounts;
  if(!st) return {...c,fromSheet:false,mismatch:false,allToCompany:c.totalNeto>0&&Math.abs(c.restanteOpcion)<0.005};
  const pick=(value,fallback)=>{
    if(value===null||value===undefined||String(value).trim()==='') return fallback;
    const n=Number(value);
    return Number.isFinite(n)?r2(n):fallback;
  };
  const out={...c,fromSheet:true};
  out.ventaBruta=pick(st.ventaBruta,c.ventaBruta);
  out.ventaNeta=pick(st.ventaNeta,c.ventaNeta);
  out.autorImporte=pick(st.autor,c.autorImporte);
  out.venueRental=pick(st.alquiler,c.venueRental);
  out.totalGastos=pick(st.totalGastos,c.totalGastos);
  out.totalNeto=pick(st.totalNeto,c.totalNeto);
  out.cache=pick(st.cache,c.cache);
  out.restanteOpcion=pick(st.restante,c.restanteOpcion);
  // Comisiones coherentes con el total de gastos guardado
  if(st.totalGastos!==null&&st.totalGastos!==undefined&&String(st.totalGastos).trim()!==''){
    out.totalComm=r2(Math.max(0,out.totalGastos-out.autorImporte-c.otrosGastosRegulares-out.venueRental));
  }
  // Comprobación: caché + restante = total neto
  out.mismatch=Math.abs(r2(out.totalNeto-out.cache-out.restanteOpcion))>0.02;
  // Todo el neto va a la compañía (acuerdo al 100 % o similar)
  out.allToCompany=out.totalNeto>0&&Math.abs(out.restanteOpcion)<0.005&&out.cache>=out.totalNeto-0.02;
  return out;
}

function resetDashboardFilters(){
  S.dashboardFilters={month:'',from:'',to:'',weekday:'',venueId:'',workId:'',platformId:'',agreementId:''};
}

function dashboardEntityName(show,type){
  const isVenue=type==='venues';
  const id=show[isVenue?'venueId':'workId'];
  const name=show[isVenue?'venueName':'workName'];
  const item=(S.config[type]||[]).find(x=>String(x.id)===String(id));
  return String(name||item?.name||'').trim();
}

function matchesDashboardEntity(show,type,selectedId){
  if(!selectedId) return true;
  const id=show[type==='venues'?'venueId':'workId'];
  if(id!==undefined && id!==null && String(id)===String(selectedId)) return true;
  const selected=(S.config[type]||[]).find(x=>String(x.id)===String(selectedId));
  const name=dashboardEntityName(show,type);
  const nameKey=value=>normalize(value).replace(/\s+/g,' ');
  return !!(selected && name && nameKey(name)===nameKey(selected.name));
}

// CORREGIDO: las funciones sin fecha no se cuelan al filtrar por mes o fechas
function getDashboardFilteredShows(){
  const f=S.dashboardFilters||{};
  const catalog=f.agreementId?getAgreementCatalog():null;
  return S.shows.filter(show=>{
    const date=show.date||'';
    if((f.month||f.from||f.to||f.weekday!=='')&&!date) return false;
    if(!matchesWeekday(date,f.weekday)) return false;
    if(f.month && !date.startsWith(f.month)) return false;
    if(f.from && date<f.from) return false;
    if(f.to && date>f.to) return false;
    if(!matchesDashboardEntity(show,'venues',f.venueId)) return false;
    if(!matchesDashboardEntity(show,'works',f.workId)) return false;
    if(f.agreementId && !matchesAgreementFilter(show,f.agreementId,catalog)) return false;
    if(f.platformId){
      const inc=show.income||{};
      if(Number(inc[f.platformId]||0)<=0) return false;
    }
    return true;
  });
}

function groupTotal(list,keyFn,valueFn){
  const out={};
  list.forEach(item=>{
    const key=keyFn(item)||'Sin datos';
    out[key]=r2((out[key]||0)+Number(valueFn(item)||0));
  });
  return out;
}

function bestEntry(obj){
  const entries=Object.entries(obj).sort(([,a],[,b])=>b-a);
  return entries[0]||['—',0];
}

function renderMiniBars(entries,maxValue,colorVar='var(--cyan)',limit=8){
  const rows=entries.slice(0,limit);
  const mx=Math.max(...rows.map(([,v])=>Math.abs(Number(v||0))),1);
  return rows.map(([name,total])=>`<div class="bar-row"><span class="bar-label" title="${esc(name)}">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(total)/mx*100).toFixed(1)}%;background:${total<0?'var(--danger)':colorVar}"></div></div><span class="bar-value ${total<0?'danger':''}">${fmt(total)}</span></div>`).join('')||'<div class="empty">Sin datos</div>';
}


async function loadFromSheet(opts={}){
  const manual=!!opts.manual;
  if(REFRESH_LOCK) return;
  REFRESH_LOCK=true;S.isLoading=!S.isSaving;S.isRefreshing=manual;S.loadError=null;render();
  try{
    const data=await apiPost({action:'getAll'});
    if(data.config) S.config={platforms:data.config.platforms||[],venues:data.config.venues||[],works:data.config.works||[],expenseTypes:data.config.expenseTypes||[],agreements:data.config.agreements||[]};
    S.shows=Array.isArray(data.shows)?data.shows.map(raw=>sheetShowToAppShow(raw,S.config)):[];
    if(S.shows.length>0&&!S.summaryMonth){const months=[...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();S.summaryMonth=months[0]||'';}
    S.lastSyncAt=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(manual) showToast(`Datos actualizados (${S.shows.length} funciones)`,'success');
  }catch(err){S.loadError=err.message;showToast('Error al cargar datos: '+err.message,'error');}
  finally{S.isLoading=false;S.isRefreshing=false;REFRESH_LOCK=false;render();}
}

async function saveShowToSheet(show){
  if(SAVE_LOCK||S.isSaving){showToast('Ya se está guardando. Espera.','warn');return;}
  const wasDuplicating=S.isDuplicating===true;
  SAVE_LOCK=true;S.isSaving=true;render();
  try{
    const payload=appShowToSheetData(show,S.config);
    let lastError=null;
    for(let attempt=0;attempt<3;attempt++){
      try{await apiPost(payload);lastError=null;break;}
      catch(err){
        lastError=err;
        if(err.code==='AUTH_REQUIRED'||!/ocupado|lock|concurr/i.test(err.message)||attempt===2) throw err;
        await new Promise(resolve=>setTimeout(resolve,700*(attempt+1)));
      }
    }
    if(lastError) throw lastError;
    S.isSaving=false;SAVE_LOCK=false;
    await loadFromSheet();
    S.view='shows';S.selectedId=null;S.editShowId=null;S.newShowDraft=null;S.isDuplicating=false;S.duplicateSourceId=null;
    showToast(wasDuplicating?'Función duplicada y guardada como nuevo registro':'Función guardada correctamente','success');
  }catch(err){showToast('Error al guardar: '+err.message,'error');}
  finally{S.isSaving=false;SAVE_LOCK=false;render();}
}

async function deleteShowFromSheet(show){
  if(S.role!=='admin') return showToast('Solo el administrador puede eliminar funciones.','error');
  if(!show) return showToast('Función no encontrada.','error');
  const label=[show.workName,show.venueName,show.date].filter(Boolean).join(' · ');
  if(!window.confirm(`¿Eliminar definitivamente esta función?\n\n${label}\n\nEsta acción no se puede deshacer.`)) return;
  try{
    await apiPost({action:'deleteShow',appId:show.appId||show.id});
    S.selectedId=null;S.editShowId=null;S.view='shows';
    await loadFromSheet();
    showToast('Función eliminada correctamente','success');
  }catch(err){showToast('Error al eliminar: '+err.message,'error');}
}

async function saveConfigToSheet(){
  if(S.role!=='admin') return showToast('No tienes permisos.','error');
  S.isSaving=true;render();
  try{syncAllWorkAgreementsToConfig();await apiPost({action:'saveConfig',config:S.config});S.configDirty=false;showToast('Configuración guardada','success');S.isSaving=false;await loadFromSheet();}
  catch(err){showToast('Error al guardar configuración: '+err.message,'error');}
  finally{S.isSaving=false;render();}
}

async function loadUsers(){
  if(S.role!=='admin') return;
  try{const data=await apiPost({action:'listUsers'});S.users=data.users||[];}
  catch(err){showToast('Error al cargar usuarios: '+err.message,'error');}
  render();
}

// RENDER
// ══════════════════════════════════════════════════════════════
function render(){
  if(S.isBooting&&!S.user){$app.innerHTML=`<div class="login-screen"><div class="spinner"></div><div class="loading-text">Comprobando sesión...</div></div>`;return;}
  if(!S.user){$app.innerHTML=renderLogin();bindLogin();return;}
  normalizeCurrentView();
  const toastHtml=S.toast?`<div class="toast ${S.toast.type}">${esc(S.toast.message)}</div>`:'';
  const loadingHtml=(S.isLoading||S.isSaving)?`<div class="loading-overlay"><div class="spinner"></div><div class="loading-text">${S.isSaving?'Guardando...':'Cargando datos...'}</div></div>`:'';
  $app.innerHTML=`<div class="app">${renderSidebar()}<div class="main">${renderView()}</div></div>${toastHtml}${loadingHtml}`;
  bindEvents();
}

function renderLogin(){
  const loading=S.isLoggingIn===true;
  return `<div class="login-screen"><div class="login-box"><div class="login-logo">${logoSVG(320)}</div><div class="card" style="padding:28px;text-align:left"><p style="color:var(--text-muted);margin:0 0 20px;font-size:13px;text-align:center">Acceso privado · La Opción Producciones</p><form id="login-form"><div class="field"><label>Correo electrónico</label><input type="email" id="login-email" autocomplete="username" placeholder="correo@ejemplo.com" required ${loading?'disabled':''}/></div><div class="field"><label>Contraseña</label><input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required ${loading?'disabled':''}/></div><button id="login-submit" class="btn btn-primary" style="width:100%;margin-top:6px" type="submit" ${loading?'disabled':''}>${loading?'⏳ Entrando...':'Entrar'}</button></form></div></div></div>`;
}
function bindLogin(){
  const form=document.getElementById('login-form');if(!form)return;
  form.onsubmit=async(e)=>{
    e.preventDefault();if(LOGIN_LOCK||S.isLoggingIn)return;
    const email=document.getElementById('login-email').value.trim();
    const password=document.getElementById('login-password').value;
    if(!email||!password)return showToast('Introduce email y contraseña.','error');
    LOGIN_LOCK=true;S.isLoggingIn=true;
    const btn=document.getElementById('login-submit');if(btn){btn.disabled=true;btn.innerHTML='⏳ Entrando...';}
    try{const res=await apiPost({action:'login',email,password});saveSession(res.token,res.user);await loadFromSheet();if(S.role==='admin')await loadUsers();showToast('Sesión iniciada','success');}
    catch(err){showToast(err.message,'error');}
    finally{S.isLoggingIn=false;LOGIN_LOCK=false;render();}
  };
}

function renderSidebar(){
  const isAdmin=S.role==='admin';
  const items=isAdmin
    ?[
      {section:'Paneles'},
      {id:'businessDashboard',label:'Dashboard del negocio',icon:'💼'},
      {id:'dashboard',label:'Dashboard funciones',icon:'📊'},
      {id:'barDashboard',label:'Dashboard barras',icon:'📈'},
      {section:'Gestión'},
      {id:'shows',label:'Funciones',icon:'🎭'},
      {id:'newshow',label:'Nueva Función',icon:'➕'},

      {id:'summary',label:'Resumen Mensual',icon:'📋'},
      {id:'admin',label:'Administración',icon:'⚙️'}
    ]
    :[{id:'shows',label:'Funciones',icon:'🎭'},{id:'newshow',label:'Registrar Ingreso',icon:'➕'},{id:'barBilling',label:'Facturación barra',icon:'🥤'},{id:'businessExpenses',label:'Gastos',icon:'🧾'}];
  const navBtns=items.map(it=>it.section?`<div class="nav-section">${esc(it.section)}</div>`:`<button class="nav-btn ${S.view===it.id?'active':''}" data-view="${it.id}">${it.icon} ${it.label}</button>`).join('');

  return `<div class="sidebar"><div class="sidebar-header">${logoSVG(155)}</div><div class="nav">${navBtns}</div><div class="sidebar-footer"><div style="display:flex;align-items:center;gap:9px;margin-bottom:10px"><div class="role-pill" style="background:${rc};color:${rt}">${isAdmin?'A':'U'}</div><div><div style="font-size:12px;font-weight:600">${esc(S.user.email)}</div><div style="font-size:10px;color:var(--text-dim)">${roleLabel(S.role)}</div></div></div><button class="btn btn-ghost btn-sm" data-action="logout" style="width:100%;justify-content:flex-start;gap:7px">🚪 Cerrar sesión</button></div></div>`;
}

function renderView(){
  if(!isViewAllowedForRole(S.view,S.role)){
    S.view=defaultViewForRole(S.role);
  }
  switch(S.view){
    case 'businessDashboard': return renderBusinessDashboard();
    case 'businessExpenses': return renderExpenseEntry();
    case 'barBilling': return renderBarBilling();
    case 'barDashboard': return renderBarDashboard();
    case 'dashboard': return renderDashboard();
    case 'shows':     return renderShowList();
    case 'newshow':   return renderShowForm(false);
    case 'editshow':  return renderShowForm(true);
    case 'detail':    return renderShowDetail();
    case 'summary':   return renderSummary();
    case 'admin':     return renderAdmin();
    default: return '<p>Vista no encontrada</p>';
  }
}

// ══════════════════════════════════════════════════════════════
// DASHBOARD (CORREGIDO)
// ══════════════════════════════════════════════════════════════
function renderDashboard(){
  if(S.shows.length===0&&!S.isLoading)return`<h1 class="page-title">Dashboard</h1><p class="page-sub mb20">La Opción Producciones</p><div class="card"><div class="empty"><p style="font-size:16px;margin-bottom:8px">Sin datos todavía</p><button class="btn btn-primary mt10" data-action="refresh">🔄 Actualizar desde Sheet</button></div></div>`;

  const f=S.dashboardFilters||{};
  const allMonths=[...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const monthOpts=allMonths.map(m=>`<option value="${m}" ${f.month===m?'selected':''}>${m}</option>`).join('');
  const venueOpts=getActiveSorted(S.config.venues).map(v=>`<option value="${v.id}" ${f.venueId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');
  const workOpts=getActiveSorted(S.config.works).map(w=>`<option value="${w.id}" ${f.workId===w.id?'selected':''}>${esc(w.name)}</option>`).join('');
  const platformOpts=[
    ...getActiveSorted(S.config.platforms).map(p=>`<option value="${p.id}" ${f.platformId===p.id?'selected':''}>${esc(p.name)}</option>`),
    `<option value="cashBox" ${f.platformId==='cashBox'?'selected':''}>Taquilla efectivo</option>`,
    `<option value="cardBox" ${f.platformId==='cardBox'?'selected':''}>Taquilla tarjeta</option>`
  ].join('');
  const agreementOpts=getAgreementCatalog().map(a=>`<option value="${a.id}" ${f.agreementId===a.id?'selected':''}>${esc(a.name)} · ${agreementValueLabel(a)}</option>`).join('');

  // Todas las métricas salen de los importes guardados en el Sheet
  const cs=getDashboardFilteredShows().map(s=>({...s,c:showAmounts(s)}));
  const t=cs.reduce((a,s)=>({
    vb:a.vb+s.c.ventaBruta, vn:a.vn+s.c.ventaNeta, g:a.g+s.c.totalGastos, tn:a.tn+s.c.totalNeto,
    ca:a.ca+s.c.cache, ro:a.ro+s.c.restanteOpcion, comm:a.comm+s.c.totalComm, autor:a.autor+s.c.autorImporte,
    alquiler:a.alquiler+s.c.venueRental, otros:a.otros+s.c.otrosGastosRegulares, extraCache:a.extraCache+s.c.otrosCache,
  }),{vb:0,vn:0,g:0,tn:0,ca:0,ro:0,comm:0,autor:0,alquiler:0,otros:0,extraCache:0});
  Object.keys(t).forEach(k=>{t[k]=r2(t[k]);});

  const n=cs.length;
  const margen=t.vn?r2(t.ro/t.vn*100):0;
  const gastoPct=t.vn?r2(t.g/t.vn*100):0;
  const cachePct=t.tn?r2(t.ca/t.tn*100):0;
  const avg=n?r2(t.ro/n):0;
  const avgVenta=n?r2(t.vb/n):0;

  const allToCompany=cs.filter(s=>s.c.allToCompany);
  const mismatched=cs.filter(s=>s.c.mismatch);
  const notes=[];
  if(f.from&&f.to&&f.from>f.to) notes.push('La fecha «Desde» es posterior a «Hasta»: no puede haber resultados.');
  if(n&&allToCompany.length===n) notes.push(`En las ${n} funciones filtradas el caché es el 100 % del total neto (acuerdo al 100 % de taquilla). Por eso «Beneficio La Opción», «Media por función», «Mejor obra» y «Mejor sala» valen 0 €: los datos son correctos. Si el acuerdo real no es del 100 %, cámbialo en Administración → Obras y vuelve a guardar esas funciones.`);
  else if(allToCompany.length) notes.push(`${allToCompany.length} de ${n} funciones dejan 0 € a La Opción porque todo el neto va a la compañía (acuerdo al 100 %).`);
  if(mismatched.length) notes.push(`${mismatched.length} ${mismatched.length===1?'función tiene':'funciones tienen'} importes descuadrados en el Sheet (caché + restante ≠ total neto), marcadas con ⚠️. Ábrelas, pulsa Editar y Guardar para recalcularlas.`);
  const notesHtml=notes.map(x=>`<div class="dirty-note">ℹ️ ${esc(x)}</div>`).join('');

  const byWorkBenefit=groupTotal(cs,s=>dashboardEntityName(s,'works'),s=>s.c.restanteOpcion);
  const byVenueBenefit=groupTotal(cs,s=>dashboardEntityName(s,'venues'),s=>s.c.restanteOpcion);
  const workNetTotals=groupTotal(cs,s=>dashboardEntityName(s,'works'),s=>s.c.totalNeto);
  const workBillingTotals=groupTotal(cs,s=>dashboardEntityName(s,'works'),s=>s.c.ventaBruta);
  const venueNetTotals=groupTotal(cs,s=>dashboardEntityName(s,'venues'),s=>s.c.totalNeto);
  const selectedWorkForAutor=(S.config.works||[]).find(w=>w.id===f.workId);
  const autorScopeLabel=f.workId?(selectedWorkForAutor?.name||'Obra seleccionada'):'Todas las obras filtradas';
  const [bestWork,bestWorkVal]=bestEntry(byWorkBenefit);
  const [bestVenue,bestVenueVal]=bestEntry(byVenueBenefit);

  const platformTotals={};
  cs.forEach(s=>{
    s.c.commissions.forEach(c=>{
      if(!platformTotals[c.name]) platformTotals[c.name]={income:0,commission:0};
      platformTotals[c.name].income+=c.income;
      platformTotals[c.name].commission+=c.commTotal;
    });
    if(!platformTotals['Taq. efectivo']) platformTotals['Taq. efectivo']={income:0,commission:0};
    if(!platformTotals['Taq. tarjeta']) platformTotals['Taq. tarjeta']={income:0,commission:0};
    platformTotals['Taq. efectivo'].income+=s.c.cashBox;
    platformTotals['Taq. tarjeta'].income+=s.c.cardBox;
  });
  const platformFinanceEntries=Object.entries(platformTotals)
    .map(([name,v])=>({name,income:r2(v.income),commission:r2(v.commission),benefit:r2(v.income-v.commission)}))
    .filter(v=>v.income>0)
    .sort((a,b)=>b.income-a.income);
  const [bestPlatform,bestPlatformVal]=bestEntry(Object.fromEntries(platformFinanceEntries.map(v=>[v.name,v.income])));
  const platformFinanceTotals=platformFinanceEntries.reduce((a,v)=>({
    income:r2(a.income+v.income),commission:r2(a.commission+v.commission),benefit:r2(a.benefit+v.benefit)
  }),{income:0,commission:0,benefit:0});
  const platformFinanceHtml=platformFinanceEntries.length?`<div class="platform-finance">
    <div class="platform-finance-head">
      <span>Canal</span>
      <span class="platform-finance-value">Facturado ${infoTip('Suma de la venta bruta registrada en este canal para las funciones que cumplen los filtros.')}</span>
      <span class="platform-finance-value">Comisión ${infoTip('Coste de intermediación: facturado × porcentaje de comisión. Si la plataforma aplica IVA a la comisión, también se incluye.')}</span>
      <span class="platform-finance-value">Beneficio ${infoTip('Facturado menos comisión. No descuenta IVA de entradas, autor, alquiler, caché ni otros gastos.')}</span>
    </div>
    ${platformFinanceEntries.map(v=>`<div class="platform-finance-row">
      <span class="platform-finance-name" title="${esc(v.name)}">${esc(v.name)}</span>
      <span class="platform-finance-value cyan">${fmt(v.income)}</span>
      <span class="platform-finance-value danger">${v.commission>0?'-':''}${fmt(v.commission)}</span>
      <span class="platform-finance-value ${v.benefit>=0?'success':'danger'}">${fmt(v.benefit)}</span>
    </div>`).join('')}
    <div class="platform-finance-row platform-finance-total">
      <span>Total</span>
      <span class="platform-finance-value cyan">${fmt(platformFinanceTotals.income)}</span>
      <span class="platform-finance-value danger">${platformFinanceTotals.commission>0?'-':''}${fmt(platformFinanceTotals.commission)}</span>
      <span class="platform-finance-value ${platformFinanceTotals.benefit>=0?'success':'danger'}">${fmt(platformFinanceTotals.benefit)}</span>
    </div>
  </div><p class="platform-finance-note">Taquilla figura sin comisión porque no hay un coste de TPV o gestión configurado para esos canales.</p>`:'<div class="empty">Sin ingresos de plataforma</div>';

  const sortDesc=obj=>Object.entries(obj).sort(([,a],[,b])=>b-a);
  const gastosEntries=[['Comisiones',t.comm],['Autor',t.autor],['Alquiler',t.alquiler],['Otros gastos',t.otros]].filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);

  const weekdayGroups=WEEKDAYS.map(()=>({n:0,vb:0,vn:0,tn:0,ca:0,ro:0}));
  cs.forEach(s=>{
    const wi=weekdayIndexFromDate(s.date);
    if(wi<0) return;
    const g=weekdayGroups[wi];
    g.n+=1; g.vb+=s.c.ventaBruta; g.vn+=s.c.ventaNeta; g.tn+=s.c.totalNeto; g.ca+=s.c.cache; g.ro+=s.c.restanteOpcion;
  });
  const weekdayBilling=weekdayGroups.map((g,i)=>[`${WEEKDAYS[i]} (${g.n})`,r2(g.vb)]).filter((e,i)=>weekdayGroups[i].n>0);
  const weekdayBenefit=weekdayGroups.map((g,i)=>[`${WEEKDAYS[i]} (${g.n})`,r2(g.ro)]).filter((e,i)=>weekdayGroups[i].n>0);
  const weekdayRowsHtml=weekdayGroups.map((g,i)=>({g,i})).filter(x=>x.g.n>0)
    .map(({g,i})=>`<tr><td>${WEEKDAYS[i]}</td><td class="right">${g.n}</td><td class="right">${fmt(r2(g.vb))}</td><td class="right">${fmt(r2(g.vb/g.n))}</td><td class="right">${fmt(r2(g.tn))}</td><td class="right">${fmt(r2(g.ca))}</td><td class="right fw700 ${g.ro>=0?'success':'danger'}">${fmt(r2(g.ro))}</td></tr>`).join('')
    ||'<tr><td colspan="7" class="empty">Sin funciones con fecha</td></tr>';

  const monthGroups={};
  cs.forEach(s=>{
    const m=(s.date||'Sin fecha').slice(0,7)||'Sin fecha';
    if(!monthGroups[m]) monthGroups[m]={funciones:0,ventaBruta:0,ventaNeta:0,comisiones:0,autor:0,alquiler:0,otros:0,totalGastos:0,totalNeto:0,cache:0,restante:0};
    const g=monthGroups[m];
    g.funciones+=1; g.ventaBruta+=s.c.ventaBruta; g.ventaNeta+=s.c.ventaNeta; g.comisiones+=s.c.totalComm;
    g.autor+=s.c.autorImporte; g.alquiler+=s.c.venueRental; g.otros+=s.c.otrosGastosRegulares;
    g.totalGastos+=s.c.totalGastos; g.totalNeto+=s.c.totalNeto; g.cache+=s.c.cache; g.restante+=s.c.restanteOpcion;
  });
  const monthEntries=Object.entries(monthGroups).sort(([a],[b])=>a.localeCompare(b));
  const monthMax=Math.max(...monthEntries.flatMap(([,v])=>[v.ventaBruta,v.ventaNeta,v.totalGastos,Math.abs(v.totalNeto),v.cache,Math.abs(v.restante),v.autor]),1);
  const monthLine=(label,value,colorVar='var(--cyan)',strong=false)=>`<div class="mini-series" style="grid-template-columns:82px 1fr 92px"><span title="${esc(label)}">${esc(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(value)/monthMax*100).toFixed(1)}%;background:${colorVar}"></div></div><span class="${strong?(value>=0?'success':'danger')+' fw700':''}">${fmt(value)}</span></div>`;
  const monthHtml=monthEntries.map(([m,v])=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)">
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;align-items:flex-start">
      <div><strong style="font-size:12px">${esc(m)}</strong><div class="dim" style="font-size:10px;margin-top:2px">${v.funciones} ${v.funciones===1?'función':'funciones'} · margen ${fmtPct(v.ventaNeta?v.restante/v.ventaNeta*100:0)}</div></div>
      <div style="text-align:right"><div class="${v.restante>=0?'success':'danger'} fw700">${fmt(v.restante)}</div><div class="dim" style="font-size:10px">Restante La Opción</div></div>
    </div>
    ${monthLine('V. bruta',v.ventaBruta,'var(--cyan)')}
    ${monthLine('V. neta',v.ventaNeta,'var(--purple)')}
    ${monthLine('Comisiones',v.comisiones,'var(--danger)')}
    ${monthLine('Autor',v.autor,'var(--pink)')}
    ${monthLine('Alquiler',v.alquiler,'var(--danger)')}
    ${monthLine('Otros',v.otros,'var(--danger)')}
    ${monthLine('Gastos',v.totalGastos,'var(--danger)')}
    ${monthLine('T. neto',v.totalNeto,'var(--yellow)')}
    ${monthLine('Caché',v.cache,'var(--pink)')}
    ${monthLine('Restante',v.restante,v.restante>=0?'var(--success)':'var(--danger)',true)}
  </div>`).join('')||'<div class="empty">Sin datos</div>';

  const rowsHtml=[...cs].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,12).map(s=>`<tr class="clickable" data-show-id="${s.id}"><td>${esc(s.date)} <span class="dim">${weekdayShort(s.date)}</span></td><td>${esc(s.workName)}</td><td>${esc(s.venueName)}</td><td>${esc(s.agreementSnapshot?.name||'—')}</td><td class="right">${fmt(s.c.ventaNeta)}</td><td class="right">${fmt(s.c.autorImporte)}</td><td class="right">${fmt(s.c.totalGastos)}</td><td class="right">${fmt(s.c.cache)}</td><td class="right fw700 ${s.c.restanteOpcion>=0?'success':'danger'}">${fmt(s.c.restanteOpcion)}${s.c.mismatch?' ⚠️':''}</td><td class="right">${fmtPct(s.c.ventaNeta?s.c.restanteOpcion/s.c.ventaNeta*100:0)}</td></tr>`).join('');

  const bestLabel=(name,val)=>n&&val>0?esc(name):'—';
  const bestSub=(val)=>n&&val>0?fmt(val):'Sin beneficio para La Opción';

  return `<div class="section-top"><div><h1 class="page-title">Dashboard profesional</h1><p class="page-sub">La Opción Producciones · ${n} de ${S.shows.length} funciones${S.lastSyncAt?` · Última actualización: ${S.lastSyncAt}`:''}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" data-action="resetDashboardFilters">🧹 Limpiar filtros</button><button class="btn btn-secondary btn-sm" data-action="refresh">${S.isRefreshing?'⏳ Actualizando...':'🔄 Actualizar desde Sheet'}</button></div></div>

  <div class="card mb20">
    <div class="dashboard-filters">
      <div class="field"><label>Mes</label><select data-dash-filter="month"><option value="">Todos</option>${monthOpts}</select></div>
      <div class="field"><label>Desde</label><input type="date" value="${esc(f.from||'')}" data-dash-filter="from"/></div>
      <div class="field"><label>Hasta</label><input type="date" value="${esc(f.to||'')}" data-dash-filter="to"/></div>
      <div class="field"><label>Día de la semana</label><select data-dash-filter="weekday">${weekdayFilterOptions(f.weekday)}</select></div>
      <div class="field"><label>Sala</label><select data-dash-filter="venueId"><option value="">Todas</option>${venueOpts}</select></div>
      <div class="field"><label>Obra</label><select data-dash-filter="workId"><option value="">Todas</option>${workOpts}</select></div>
      <div class="field"><label>Plataforma</label><select data-dash-filter="platformId"><option value="">Todas</option>${platformOpts}</select></div>
      <div class="field"><label>Acuerdo</label><select data-dash-filter="agreementId"><option value="">Todos</option>${agreementOpts}</select></div>
    </div>
  </div>
  ${notesHtml}

function ensureShowFilters(){
  if(!S.showFilters) S.showFilters={month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'};
  if(S.search===undefined||S.search===null) S.search='';
  return S.showFilters;
}
function getShowMonths(){
  return [...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
}
// CORREGIDO: importes guardados y filtro de sala/obra también por nombre
function getFilteredShowList(){
  const f=ensureShowFilters();
  const q=normalize(S.search);
  const catalog=f.agreementId?getAgreementCatalog():null;
  let cs=S.shows.map(s=>({...s,c:showAmounts(s)})).filter(s=>{
    const searchText=normalize([s.date,s.workName,s.venueName,s.agreementSnapshot?.name,s.notes].join(' '));
    if(q && !searchText.includes(q)) return false;
    if(f.month && !(s.date||'').startsWith(f.month)) return false;
    if(!matchesDashboardEntity(s,'venues',f.venueId)) return false;
    if(!matchesDashboardEntity(s,'works',f.workId)) return false;
    if(f.agreementId && !matchesAgreementFilter(s,f.agreementId,catalog)) return false;
    return true;
  });
  const sort=f.sort||'dateDesc';
  cs.sort((a,b)=>{
    if(sort==='dateAsc') return (a.date||'').localeCompare(b.date||'');
    if(sort==='workAsc') return (a.workName||'').localeCompare(b.workName||'','es') || (b.date||'').localeCompare(a.date||'');
    if(sort==='venueAsc') return (a.venueName||'').localeCompare(b.venueName||'','es') || (b.date||'').localeCompare(a.date||'');
    if(sort==='restDesc') return (b.c.restanteOpcion||0)-(a.c.restanteOpcion||0);
    if(sort==='ventaDesc') return (b.c.ventaNeta||0)-(a.c.ventaNeta||0);
    return (b.date||'').localeCompare(a.date||'');
  });
  return cs;
}
function updateShowSearchLive(){
  const input=document.querySelector('[data-bind="search"]');
  if(input) S.search=input.value;
  const q=normalize(S.search);
  let visible=0;
  document.querySelectorAll('[data-show-row="1"]').forEach(row=>{
    const ok=!q || normalize(row.dataset.searchText||'').includes(q);
    row.style.display=ok?'':'none';
    if(ok) visible++;
  });
  document.querySelectorAll('[data-show-card="1"]').forEach(card=>{
    const ok=!q || normalize(card.dataset.searchText||'').includes(q);
    card.style.display=ok?'':'none';
  });
  const count=document.getElementById('show-list-count');
  if(count) count.textContent=`${visible} de ${S.shows.length} funciones`;
  const empty=document.getElementById('show-list-empty-live');
  if(empty) empty.style.display=visible===0?'table-row':'none';
  const emptyCards=document.getElementById('show-list-empty-cards');
  if(emptyCards) emptyCards.style.display=visible===0?'block':'none';
}

  return `<div class="section-top"><div><h1 class="page-title">Funciones</h1><p class="page-sub"><span id="show-list-count">${cs.length} de ${S.shows.length} funciones</span>${activeFilters?` · ${activeFilters} filtro${activeFilters>1?'s':''} activo${activeFilters>1?'s':''}`:''}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" data-action="refresh">🔄 Actualizar</button><button class="btn btn-primary" data-view="newshow">➕ Nueva</button></div></div>
  <div class="card show-list-card mb20">
    <div class="show-toolbar">
      <div class="search-wrap"><label class="filter-label">Buscar</label><span class="search-icon">🔍</span><input id="show-search-input" class="inline-input" type="search" autocomplete="off" placeholder="Obra, sala, fecha, acuerdo o notas..." value="${esc(S.search)}" data-bind="search"/></div>

function renderShowDetail(){
  const show=S.shows.find(s=>s.id===S.selectedId);
  if(!show) return '<div class="card"><div class="empty">Función no encontrada</div></div>';
  const c=showAmounts(show);
  const isA=S.role==='admin';
  const incomeRows=c.commissions.filter(x=>x.income>0).map(x=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><div><div style="font-size:13px">${esc(x.name)}</div>${isA?`<div style="font-size:10px;color:var(--text-dim)">Com: ${fmt(x.commBase)}${x.commIva>0?` +IVA ${fmt(x.commIva)}`:''} = ${fmt(x.commTotal)}</div>`:''}</div><div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--cyan)">${fmt(x.income)}</div>${isA?`<div style="font-size:10px;color:var(--danger)">-${fmt(x.commTotal)}</div>`:''}</div></div>`).join('');
  const cashRows=[];
  if(c.cashBox>0) cashRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Taquilla efectivo</span><span class="fw700 success">${fmt(c.cashBox)}</span></div>`);
  if(c.cardBox>0) cashRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Taquilla tarjeta</span><span class="fw700 success">${fmt(c.cardBox)}</span></div>`);
  const gastoRows=[];
  if(c.autorImporte>0) gastoRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Autor (${fmtPct(show.autorPct)}) <span class="dim">(${expenseOwnerLabel(c.autorOwner)})</span></span><span class="fw700 danger">-${fmt(c.autorImporte)}</span></div>`);
  if(c.otrosGastos>0){
    if(c.expenseOwner==='cache') gastoRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Extra de caché <span class="dim">(a cargo de La Opción)</span></span><span class="fw700 pink">+${fmt(c.otrosCache)}</span></div>`);
    else gastoRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Otros gastos <span class="dim">(${expenseOwnerLabel(c.expenseOwner)})</span></span><span class="fw700 danger">-${fmt(c.otrosGastos)}</span></div>`);
  }
  if(c.venueRental>0)  gastoRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Alquiler sala</span><span class="fw700 danger">-${fmt(c.venueRental)}</span></div>`);

  const agrLabel=c.agreement?`${esc(c.agreement.name)} · ${agreementValueLabel(c.agreement)}`:'—';
  const warn=[];
  if(c.mismatch) warn.push('Los importes guardados de esta función no cuadran (caché + restante ≠ total neto). Pulsa «Editar función» y guarda para recalcularla.');
  if(isA&&c.allToCompany) warn.push('Todo el total neto de esta función va a la compañía (acuerdo al 100 %), por eso el restante de La Opción es 0 €.');
  const warnHtml=warn.map(x=>`<div class="dirty-note">ℹ️ ${esc(x)}</div>`).join('');

  const kpisAdmin=`<div class="card"><div class="kpi-label">V. Bruta</div><div class="kpi-value cyan">${fmt(c.ventaBruta)}</div></div><div class="card"><div class="kpi-label">V. Neta</div><div class="kpi-value purple">${fmt(c.ventaNeta)}</div></div><div class="card"><div class="kpi-label">Autor a pagar</div><div class="kpi-value danger">${fmt(c.autorImporte)}</div><div class="kpi-sub">${fmtPct(show.autorPct)} · ${expenseOwnerLabel(c.autorOwner)}</div></div><div class="card"><div class="kpi-label">Gastos</div><div class="kpi-value danger">${fmt(c.totalGastos)}</div></div><div class="card"><div class="kpi-label">Total Neto</div><div class="kpi-value yellow">${fmt(c.totalNeto)}</div></div><div class="card"><div class="kpi-label">Caché</div><div class="kpi-value pink">${fmt(c.cache)}</div></div><div class="card"><div class="kpi-label">Restante La Opción</div><div class="kpi-value ${c.restanteOpcion>=0?'success':'danger'}">${fmt(c.restanteOpcion)}</div></div>`;
  const kpisUser=`<div class="card"><div class="kpi-label">Caché</div><div class="kpi-value pink">${fmt(c.cache)}</div></div><div class="card"><div class="kpi-label">Restante La Opción</div><div class="kpi-value ${c.restanteOpcion>=0?'success':'danger'}">${fmt(c.restanteOpcion)}</div></div>`;

teOpcion)}</span></div></div></div>`;

// FORMULARIO — nueva función o edición
// ══════════════════════════════════════════════════════════════
function renderShowForm(isEdit){
  const isU=S.role==='user';
  const d=S.newShowDraft||(isEdit?null:emptyDraft());
  if(!d) return '<div class="card"><div class="empty">Error al cargar el formulario.</div></div>';
  if(!d.income) d.income={};
  S.newShowDraft=d;

  const selectedWork=S.config.works.find(w=>w.id===d.workId);
  const legacyAgreement=d.agreementId?getLegacyAgreementById(S.config,d.agreementId):null;
  const resolvedAgreement=resolveAgreementForWork(selectedWork,S.config,legacyAgreement);
  if(selectedWork&&resolvedAgreement.id&&d.agreementId!==resolvedAgreement.id) d.agreementId=resolvedAgreement.id;

  const workOpts=getActiveSorted(S.config.works).map(w=>`<option value="${w.id}" ${d.workId===w.id?'selected':''}>${esc(w.name)}</option>`).join('');
  const venueOpts=getActiveSorted(S.config.venues).map(v=>`<option value="${v.id}" ${d.venueId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');

  const selectedVenue=S.config.venues.find(v=>v.id===d.venueId);
  const venueRental=Number(selectedVenue?.alquiler||0);
  const rentalInfo=d.venueId?`<p class="dim" style="font-size:12px;margin-top:-4px;margin-bottom:12px">Alquiler configurado: <strong style="color:var(--yellow)">${fmt(venueRental)}</strong> (se aplica automáticamente)</p>`:'';

  const agreementInfo=d.workId
    ? (resolvedAgreement.snapshot
      ? `<p class="dim" style="font-size:12px;margin-top:-4px;margin-bottom:12px">Acuerdo vinculado a la obra: <strong style="color:var(--cyan)">${esc(resolvedAgreement.snapshot.name)}</strong> · ${resolvedAgreement.snapshot.mode==='fixed'?'Fijo':'Porcentaje'} ${agreementValueLabel(resolvedAgreement.snapshot)}${resolvedAgreement.snapshot.mode==='percentage'&&Number(resolvedAgreement.snapshot.value)>=100?' <span style="color:var(--warn)">(todo el neto irá a la compañía)</span>':''}</p>`
      : `<div class="dirty-note">⚠️ Esta obra todavía no tiene acuerdo configurado. Ve a Administración → Obras y completa tipo y valor del acuerdo.</div>`)
    : `<p class="dim" style="font-size:12px;margin-top:-4px;margin-bottom:12px">Selecciona una obra para aplicar automáticamente su acuerdo.</p>`;

  const platFields=getActiveSorted(S.config.platforms).map(p=>{
    const label=isU?esc(p.name):`${esc(p.name)} (${p.commission}%${p.ivaOnCommission?' +IVA':''})`;
    return `<div class="field"><label>${label}</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.income[p.id]||''}" data-plat-id="${p.id}"/></div>`;
  }).join('');

  const isDup=S.isDuplicating===true&&!isEdit;
  const title=isEdit?'Editar función':(isDup?'Duplicar función':(isU?'Registrar ingreso':'Nueva función'));
  const btnLabel=isEdit?'💾 Guardar cambios':(isDup?'📄 Crear función duplicada':'💾 Guardar');
  const duplicateNote=isDup?`<div class="dirty-note">📄 Estás duplicando una función. Puedes cambiar fecha, sala, obra o importes. Al guardar se creará un registro nuevo y el original no se modificará.</div>`:'';
  const editNote=isEdit?`<div class="dirty-note">✏️ Al guardar, la función se recalcula con el acuerdo y las comisiones que tiene ahora la configuración.</div>`:'';

  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:22px"><button class="btn btn-ghost" data-view="shows">← Volver</button><h1 class="page-title" style="font-size:22px">${title}</h1></div>${duplicateNote}${editNote}<div class="grid grid-2 mb20"><div class="card"><h3>Datos básicos</h3><div class="field"><label>Obra *</label><select data-field="workId"><option value="">— Seleccionar —</option>${workOpts}</select></div>${agreementInfo}<div class="field"><label>Sala *</label><select data-field="venueId"><option value="">— Seleccionar —</option>${venueOpts}</select></div>${rentalInfo}<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Fecha *</label><input type="date" value="${esc(d.date)}" data-field="date"/></div><div class="field" style="flex:1"><label>Día de la semana</label><select data-weekday-field ${d.date?'':'disabled'}>${d.date?weekdayOptions(weekdayIndexFromDate(d.date)):'<option value="">— Pon la fecha —</option>'}</select></div><div class="field" style="flex:1"><label>Hora</label><input type="time" value="${esc(d.time)}" data-field="time"/></div></div><p class="dim" style="font-size:11px;margin-top:-6px;margin-bottom:12px">El día se rellena solo con la fecha. Si cambias el día, la fecha se mueve a ese día de la misma semana.</p><div class="field"><label>Observaciones</label><textarea data-field="notes" placeholder="Notas...">${esc(d.notes)}</textarea></div></div><div class="card"><h3>Ingresos</h3>${platFields||'<p class="dim">No hay plataformas activas.</p>'}<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:6px"><div class="field"><label>Taquilla efectivo</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.income.cashBox||''}" data-plat-id="cashBox"/></div><div class="field"><label>Taquilla tarjeta</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.income.cardBox||''}" data-plat-id="cardBox"/></div></div></div><div class="card"><h3>Gastos</h3><div class="field"><label>Autor (% sobre venta neta)</label><input type="number" min="0" max="100" step="0.01" placeholder="0" value="${d.autorPct||''}" data-expense-flat="autorPct"/></div><div class="field"><label>¿A quién va autor?</label><select data-autor-owner><option value="both" ${normalizeAutorOwner(d.autorOwner)==='both'?'selected':''}>Ambas partes — se resta antes del acuerdo</option><option value="laopcion" ${normalizeAutorOwner(d.autorOwner)==='laopcion'?'selected':''}>La Opción — se resta solo a La Opción</option><option value="company" ${normalizeAutorOwner(d.autorOwner)==='company'?'selected':''}>Compañía — se resta del caché</option></select></div><div class="field"><label>Otros gastos (€)</label><input type="number" min="0" step="0.01" placeholder="0" value="${d.otrosGastos||''}" data-expense-flat="otrosGastos"/></div><div class="field"><label>¿A quién van otros gastos?</label><select data-expense-owner><option value="both" ${normalizeExpenseOwner(d.expenseOwner)==='both'?'selected':''}>Ambas partes — se resta antes del acuerdo</option><option value="laopcion" ${normalizeExpenseOwner(d.expenseOwner)==='laopcion'?'selected':''}>La Opción — se resta solo a La Opción</option><option value="company" ${normalizeExpenseOwner(d.expenseOwner)==='company'?'selected':''}>Compañía — se resta del caché</option><option value="cache" ${normalizeExpenseOwner(d.expenseOwner)==='cache'?'selected':''}>Extra de caché — se suma al caché y se cobra a La Opción</option></select></div><p class="dim" style="font-size:11px;margin-top:-4px">Por defecto “Ambas partes” mantiene el cálculo anterior. “Extra de caché” aumenta el caché y reduce el restante de La Opción por el mismo importe.</p></div></div><div style="display:flex;gap:10px"><button class="btn btn-primary" data-action="saveNewShow" ${S.isSaving?'disabled':''}>${S.isSaving?'⏳ Guardando...':btnLabel}</button><button class="btn btn-secondary" data-view="shows" ${S.isSaving?'disabled':''}>Cancelar</button></div>`;
}

// ══════════════════════════════════════════════════════════════
// RESUMEN MENSUAL (CORREGIDO: importes guardados)
// ══════════════════════════════════════════════════════════════
function renderSummary(){
  const months=[...new Set(S.shows.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const sel=S.summaryMonth||months[0]||'';
  const opts=months.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${m}</option>`).join('');
  const cs=S.shows.filter(s=>(s.date||'').startsWith(sel)).map(s=>({...s,c:showAmounts(s)}));
  const byWork={};
  cs.forEach(s=>{
    const k=`${s.workName||'Sin obra'}||${s.venueName||''}`;
    if(!byWork[k])byWork[k]={work:s.workName||'Sin obra',venue:s.venueName,funciones:0,ingreso:0,coste:0,beneficio:0};
    byWork[k].funciones+=1;byWork[k].ingreso+=s.c.totalNeto;byWork[k].coste+=s.c.cache;byWork[k].beneficio+=s.c.restanteOpcion;
  });
  const rows=Object.values(byWork).sort((a,b)=>b.beneficio-a.beneficio);
  const totB=rows.reduce((s,r)=>s+r.beneficio,0);
  const totI=rows.reduce((s,r)=>s+r.ingreso,0);
  const totC=rows.reduce((s,r)=>s+r.coste,0);
  rows.forEach(r=>{r.pct=totB!==0?r2(r.beneficio/totB*100):0;});
  const tableRows=rows.map(r=>`<tr><td>${esc(r.venue)}</td><td>${esc(r.work)}</td><td class="right">${r.funciones}</td><td class="right">${fmt(r.ingreso)}</td><td class="right">${fmt(r.coste)}</td><td class="right fw700 ${r.beneficio>=0?'success':'danger'}">${fmt(r.beneficio)}</td><td class="right">${fmtPct(r.pct)}</td></tr>`).join('');
  const platTotals={};
  cs.forEach(s=>{s.c.commissions.forEach(c=>{platTotals[c.name]=(platTotals[c.name]||0)+c.income;});platTotals['Taq. Efectivo']=(platTotals['Taq. Efectivo']||0)+s.c.cashBox;platTotals['Taq. Tarjeta']=(platTotals['Taq. Tarjeta']||0)+s.c.cardBox;});
  const platCards=Object.entries(platTotals).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).map(([name,total])=>`<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:14px 16px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px">${esc(name)}</div><div style="font-size:18px;font-family:'Outfit',sans-serif;font-weight:800;color:var(--cyan)">${fmt(total)}</div></div>`).join('');
  return `<h1 class="page-title">Resumen Mensual</h1><p class="page-sub mb20">Visión por obra y plataforma</p><div style="display:flex;gap:8px;align-items:center;margin-bottom:18px"><span class="dim">📅</span><select data-bind="summaryMonth" class="inline-input" style="max-width:160px">${opts}</select><span class="dim" style="font-size:12px">${cs.length} funciones</span></div><div class="card mb20"><h3>Resumen por obra</h3><div class="table-wrap"><table><thead><tr><th>Sala</th><th>Obra</th><th class="right">Funciones</th><th class="right">Ingreso (neto)</th><th class="right">Coste CIA</th><th class="right">Beneficios</th><th class="right">%</th></tr></thead><tbody>${tableRows||'<tr><td colspan="7" class="empty">Sin datos</td></tr>'}</tbody>${rows.length?`<tfoot><tr><th colspan="2">Total</th><th class="right">${cs.length}</th><th class="right">${fmt(totI)}</th><th class="right">${fmt(totC)}</th><th class="right">${fmt(totB)}</th><th class="right">100.00%</th></tr></tfoot>`:''}</table></div></div><div class="card"><h3>Resumen por plataforma</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${platCards||'<div class="empty">Sin datos</div>'}</div></div>`;
}

function renderAdmin(){
  if(S.role!=='admin') return '<div class="card"><div class="empty">Acceso denegado</div></div>';
  if(S.adminTab==='agreements') S.adminTab='works';
  const tabs=[{id:'platforms',label:'Plataformas'},{id:'venues',label:'Salas'},{id:'works',label:'Obras y acuerdos'},{id:'expenses',label:'Gastos de funciones'},{id:'businessTypes',label:'Tipos de gasto del negocio'},{id:'barMethods',label:'Pagos de barra'},{id:'users',label:'Usuarios'}];
  const tabBtns=tabs.map(t=>`<button class="btn ${S.adminTab===t.id?'btn-primary':'btn-ghost'} btn-sm" data-admin-tab="${t.id}">${t.label}</button>`).join('');
  const content=S.adminTab==='businessTypes'?renderBusinessTypes():(S.adminTab==='barMethods'?renderBarMethods():(S.adminTab==='users'?renderUsersAdmin():renderConfigEditor(S.adminTab)));
  return `<div class="section-top"><div><h1 class="page-title">Administración</h1><p class="page-sub">Configuración desde la app</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" data-action="refresh">🔄 Recargar</button>${S.adminTab!=='users'&&S.adminTab!=='barMethods'&&S.adminTab!=='businessTypes'?`<button class="btn btn-primary btn-sm" data-action="saveConfig" ${S.isSaving?'disabled':''}>💾 Guardar cambios</button>`:''}</div></div>${S.configDirty&&S.adminTab!=='users'&&S.adminTab!=='barMethods'&&S.adminTab!=='businessTypes'?'<div class="dirty-note">Tienes cambios pendientes. Pulsa "Guardar cambios" para enviarlos al Sheet.</div>':''}${S.adminTab==='works'?'<div class="dirty-note">Cambiar el acuerdo de una obra no modifica las funciones ya guardadas. Para aplicarlo a una función existente, ábrela, pulsa Editar y guarda.</div>':''}<div style="display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap">${tabBtns}</div>${content}`;
}
function renderConfigEditor(tab){
  const meta=CONFIG_META[tab]||CONFIG_META.platforms;
  const items=alphaSortByName(S.config[meta.key]||[]);
  const rows=items.map(item=>renderConfigRow(tab,item)).join('');
  return `<div class="grid grid-2 mb20"><div class="card"><h3>Añadir ${meta.singular}</h3>${renderAddConfigForm(tab)}<p class="dim" style="font-size:12px;margin-top:10px">Añade el elemento y después guarda los cambios.</p></div><div class="card"><h3>${meta.title}</h3><div class="table-wrap"><table><thead>${renderConfigHeader(tab)}</thead><tbody>${rows||`<tr><td colspan="6" class="empty">Sin ${meta.title.toLowerCase()}</td></tr>`}</tbody></table></div><p class="dim" style="font-size:12px;margin-top:10px">Desactiva elementos en vez de borrarlos para conservar históricos.</p></div></div>`;
}
function renderAddConfigForm(tab){
  if(tab==='platforms') return `<div class="field"><label>Nombre</label><input data-add="name" data-add-tab="${tab}" placeholder="Nueva plataforma"/></div><div class="grid grid-2"><div class="field"><label>Comisión %</label><input type="number" min="0" step="0.01" data-add="commission" data-add-tab="${tab}" placeholder="0"/></div><div class="field"><label>IVA comisión</label><select data-add="ivaOnCommission" data-add-tab="${tab}"><option value="true">Sí</option><option value="false">No</option></select></div></div><button class="btn btn-primary" data-action="addConfig" data-add-config-tab="${tab}">➕ Añadir plataforma</button>`;
  if(tab==='venues') return `<div class="field"><label>Nombre</label><input data-add="name" data-add-tab="${tab}" placeholder="Nueva sala"/></div><div class="field"><label>Alquiler por función</label><input type="number" min="0" step="0.01" data-add="alquiler" data-add-tab="${tab}" placeholder="0"/></div><button class="btn btn-primary" data-action="addConfig" data-add-config-tab="${tab}">➕ Añadir sala</button>`;
  if(tab==='works') return `<div class="field"><label>Nombre de la obra</label><input data-add="name" data-add-tab="${tab}" placeholder="Nueva obra"/></div><div class="field"><label>Nombre del acuerdo</label><input data-add="agreementName" data-add-tab="${tab}" placeholder="Acuerdo vinculado a esta obra"/></div><div class="grid grid-2"><div class="field"><label>Tipo de acuerdo</label><select data-add="agreementMode" data-add-tab="${tab}"><option value="percentage">Porcentaje</option><option value="fixed">Fijo</option></select></div><div class="field"><label>Valor del acuerdo</label><input type="number" min="0" step="0.01" data-add="agreementValue" data-add-tab="${tab}" placeholder="0"/></div></div><button class="btn btn-primary" data-action="addConfig" data-add-config-tab="${tab}">➕ Añadir obra con acuerdo</button>`;
  if(tab==='agreements') return `<div class="field"><label>Nombre</label><input data-add="name" data-add-tab="${tab}" placeholder="Nuevo acuerdo"/></div><div class="grid grid-2"><div class="field"><label>Tipo</label><select data-add="mode" data-add-tab="${tab}"><option value="percentage">Porcentaje</option><option value="fixed">Fijo</option></select></div><div class="field"><label>Valor</label><input type="number" min="0" step="0.01" data-add="value" data-add-tab="${tab}" placeholder="0"/></div></div><button class="btn btn-primary" data-action="addConfig" data-add-config-tab="${tab}">➕ Añadir acuerdo</button>`;
  const meta=CONFIG_META[tab];
  return `<div class="field"><label>Nombre</label><input data-add="name" data-add-tab="${tab}" placeholder="Nuevo ${meta.singular}"/></div><button class="btn btn-primary" data-action="addConfig" data-add-config-tab="${tab}">➕ Añadir ${meta.singular}</button>`;
}
function renderConfigHeader(tab){
  if(tab==='platforms') return '<tr><th>Nombre</th><th>Comisión</th><th>IVA</th><th>Activa</th></tr>';
  if(tab==='venues')    return '<tr><th>Nombre</th><th>Alquiler por función</th><th>Activa</th></tr>';
  if(tab==='works')     return '<tr><th>Obra</th><th>Acuerdo</th><th>Tipo acuerdo</th><th>Valor acuerdo</th><th>Activa</th></tr>';
  if(tab==='agreements')return '<tr><th>Nombre</th><th>Tipo</th><th>Valor</th><th>Activo</th></tr>';
  return '<tr><th>Nombre</th><th>Activo</th></tr>';
}
function renderConfigRow(tab,item){
  if(tab==='platforms') return `<tr><td><input class="inline-input" data-cfg-tab="${tab}" data-cfg-id="${item.id}" data-cfg-field="name" value="${esc(item.name)}"/></td><td><input class="inline-input" type="number" min="0" step="0.01" data-cfg-tab="${tab}" data-cfg-id="${item.id}" data-cfg-field="commission" value="${Number(item.commission||0)}"/></td><td><select class="inline-input" data-cfg-tab="${tab}" data-cfg-id="${item.id}" data-cfg-field="ivaOnCommission"><option value="true" ${item.ivaOnCommission?'selected':''}>Sí</option><option value="false" ${!item.ivaOnCommission?'selected':''}>No</option></select></td><td><input class="inline-check" type="checkbox" data-cfg-tab="${tab}" data-cfg-id="${item.id}" data-cfg-field="active" ${item.active!==false?'checked':''}/></td></tr>`;

function bindEvents(){
  bindBarEvents();bindExpenseEvents();bindBusinessEvents();
  document.querySelectorAll('[data-view]').forEach(btn=>{
    btn.onclick=()=>{
      if(S.isSaving)return showToast('Espera a que termine el guardado.','warn');
      const targetView=btn.dataset.view;
      if(!isViewAllowedForRole(targetView,S.role)){
        S.view=defaultViewForRole(S.role);
        showToast('No tienes permisos para acceder a esa sección.','error');
        return render();
      }
      S.view=targetView;
      if(targetView==='businessExpenses')loadExpenses();
      if(targetView==='businessDashboard')loadBusiness();
      if(['barBilling','barDashboard'].includes(targetView)) loadBars();
      S.selectedId=null;
      S.editShowId=null;
      S.isDuplicating=false;
      S.duplicateSourceId=null;
      if(S.view==='newshow'){S.newShowDraft=emptyDraft();}
      else if(S.view!=='editshow'){S.newShowDraft=null;}
      render();
    };
  });

  document.querySelectorAll('[data-action]').forEach(btn=>{
    btn.onclick=()=>{
      const a=btn.dataset.action;
      if(a==='logout')       return handleLogout();
      if(a==='refresh')      return S.view==='admin'&&S.adminTab==='businessTypes'?loadExpenses(true):(S.view==='admin'&&S.adminTab==='barMethods'?loadBars(true):loadFromSheet({manual:true}));
      if(a==='resetDashboardFilters'){resetDashboardFilters();return render();}
      if(a==='exportShowsPdf')  return exportShowsPdf();
      if(a==='clearShowFilters'){S.search='';S.showFilters={month:'',venueId:'',workId:'',agreementId:'',sort:'dateDesc'};return render();}
      if(a==='saveNewShow')  {btn.disabled=true;btn.innerHTML='⏳ Guardando...';return handleSaveShow();}
      if(a==='saveConfig')   return saveConfigToSheet();
      if(a==='addConfig')    return addConfigItem(btn.dataset.addConfigTab);
      if(a==='createUser')   return handleCreateUser();
      if(a==='updateUser')   return handleUpdateUser(btn.dataset.userId);
      if(a==='refreshUsers') return loadUsers();
      if(a==='deleteShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        return deleteShowFromSheet(show);
      }
      if(a==='viewShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        if(show){S.selectedId=show.id;S.view='detail';S.isDuplicating=false;S.duplicateSourceId=null;render();}
        return;
      }
      if(a==='editShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        if(show){S.editShowId=show.id;S.newShowDraft=showToDraft(show);S.isDuplicating=false;S.duplicateSourceId=null;S.view='editshow';render();}
        return;
      }
      if(a==='duplicateShow'){
        const show=S.shows.find(s=>s.id===btn.dataset.showId);
        if(show){
          S.editShowId=null;
          S.selectedId=null;
          S.newShowDraft=showToDuplicateDraft(show);
          S.isDuplicating=true;
          S.duplicateSourceId=show.appId||show.id||'';
          S.view='newshow';
          showToast('Copia preparada. Revisa los datos y guarda para crear una función nueva.','warn');
          render();
        }
        return;
      }
    };
  });

  document.querySelectorAll('tbody tr.clickable[data-show-id]').forEach(row=>{
    row.onclick=()=>{
      const show=S.shows.find(s=>s.id===row.dataset.showId);
      if(show){S.selectedId=show.id;S.view='detail';render();}
    };
  });

  document.querySelectorAll('[data-admin-tab]').forEach(btn=>{
    btn.onclick=()=>{S.adminTab=btn.dataset.adminTab;if(S.adminTab==='users')loadUsers();if(S.adminTab==='barMethods')loadBars();if(S.adminTab==='businessTypes')loadExpenses();render();};
  });

  document.querySelectorAll('[data-dash-filter]').forEach(el=>{
    el.onchange=()=>{
      if(!S.dashboardFilters) resetDashboardFilters();
      S.dashboardFilters[el.dataset.dashFilter]=el.value;
      render();
    };
  });

  document.querySelectorAll('[data-show-filter]').forEach(el=>{
    el.onchange=()=>{
      ensureShowFilters();
      S.showFilters[el.dataset.showFilter]=el.value;
      render();
    };
  });

  const si=document.querySelector('[data-bind="search"]');
  if(si){
    si.oninput=()=>updateShowSearchLive();
    si.onsearch=()=>updateShowSearchLive();
  }
  const sm=document.querySelector('[data-bind="summaryMonth"]');
  if(sm) sm.onchange=()=>{S.summaryMonth=sm.value;render();};
  // campos básicos — selects en change y textos en input para evitar doble disparo
  document.querySelectorAll('[data-field]').forEach(el=>{
    const updateDraftField=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      const field=el.dataset.field;
      S.newShowDraft[field]=el.value;
      if(field==='workId'){
        const work=S.config.works.find(w=>w.id===el.value);
        const resolved=resolveAgreementForWork(work,S.config);
        S.newShowDraft.agreementId=resolved.id||'';
        render();
      } else if(field==='venueId'){
        render();
      }
    };
    if(el.tagName==='SELECT') el.onchange=updateDraftField;
    else el.oninput=updateDraftField;
  });
  // ingresos plataformas
  document.querySelectorAll('[data-plat-id]').forEach(el=>{
    el.oninput=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      if(!S.newShowDraft.income) S.newShowDraft.income={};
      S.newShowDraft.income[el.dataset.platId]=parseFloat(el.value)||0;
    };
  });
  // gastos planos: un solo evento, valor numérico inmediato
  document.querySelectorAll('[data-expense-flat]').forEach(el=>{
    el.oninput=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      S.newShowDraft[el.dataset.expenseFlat]=parseFloat(el.value)||0;
    };
  });
  document.querySelectorAll('[data-weekday-field]').forEach(el=>{
    el.onchange=()=>{
      if(!S.newShowDraft||!S.newShowDraft.date) return;
      const nueva=shiftDateToWeekday(S.newShowDraft.date,el.value);
      if(nueva!==S.newShowDraft.date){
        S.newShowDraft.date=nueva;
        showToast(`Fecha ajustada a ${WEEKDAYS[Number(el.value)]} ${nueva}`,'warn');
      }
      render();
    };
  });
  document.querySelectorAll('[data-autor-owner]').forEach(el=>{
    el.onchange=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      S.newShowDraft.autorOwner=normalizeAutorOwner(el.value);
    };
  });
  document.querySelectorAll('[data-expense-owner]').forEach(el=>{
    el.onchange=()=>{
      if(!S.newShowDraft) S.newShowDraft=emptyDraft();
      S.newShowDraft.expenseOwner=normalizeExpenseOwner(el.value);
    };
  });
  document.querySelectorAll('[data-cfg-field]').forEach(el=>{
    el.onchange=()=>updateConfigFromInput(el);
  });
}

async function handleLogout(){ try{if(S.token)await apiPost({action:'logout'});}catch(e){} clearSession(true); }
function getConfigItem(tab,id){ const meta=CONFIG_META[tab]; return (S.config[meta.key]||[]).find(x=>x.id===id); }
function updateConfigFromInput(el){
  const item=getConfigItem(el.dataset.cfgTab,el.dataset.cfgId);if(!item)return;
  const field=el.dataset.cfgField;
  let value=el.type==='checkbox'?el.checked:el.value;
  if(['commission','value','alquiler','agreementValue'].includes(field)) value=Number(value||0);
  if(field==='ivaOnCommission') value=value==='true';
  item[field]=value;
  if(el.dataset.cfgTab==='works'){
    if(!item.agreementName) item.agreementName=item.name;
    syncWorkAgreementToConfig(item);
  }
  S.configDirty=true;
}
function addConfigItem(tab){
  const meta=CONFIG_META[tab];
  const inputs=[...document.querySelectorAll(`[data-add-tab="${tab}"]`)];
  const values={};inputs.forEach(i=>values[i.dataset.add]=i.value);
  const name=String(values.name||'').trim();
  if(!name)return showToast('Introduce un nombre.','error');
  if((S.config[meta.key]||[]).some(x=>normalize(x.name)===normalize(name))) return showToast(`Ya existe un elemento llamado "${name}" (o casi igual). Usa otro nombre.`,'error');
  let item={id:gid(meta.prefix),name,active:true};
  if(tab==='platforms') item={...item,commission:Number(values.commission||0),ivaOnCommission:values.ivaOnCommission==='true'};
  if(tab==='venues')    item={...item,alquiler:Number(values.alquiler||0)};
  if(tab==='works'){
    const agreementName=String(values.agreementName||name).trim();
    if((S.config.agreements||[]).some(a=>normalize(a.name)===normalize(agreementName))) return showToast(`Ya existe un acuerdo llamado "${agreementName}" (o casi igual). Usa otro nombre de acuerdo.`,'error');
    item={...item,agreementId:gid('wa'),agreementName,agreementMode:values.agreementMode||'percentage',agreementValue:Number(values.agreementValue||0)};
  }
  if(tab==='agreements')item={...item,mode:values.mode||'percentage',value:Number(values.value||0)};
  S.config[meta.key].push(item);
  if(tab==='works') syncWorkAgreementToConfig(item);
  S.configDirty=true;
  inputs.forEach(i=>{if(i.tagName==='INPUT')i.value='';});
  showToast(`${meta.singular[0].toUpperCase()+meta.singular.slice(1)} añadido. Guarda los cambios.`,'success');
  render();
}
async function handleCreateUser(){

async function handleUpdateUser(id){
