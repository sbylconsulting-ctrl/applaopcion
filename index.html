<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Opción Producciones</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0A0A0F;
      --surface: #111118;
      --surface-alt: #16161F;
      --card: #1A1A24;
      --border: #2A2A3A;
      --border-light: #35354A;
      --text: #EEEEF4;
      --text-muted: #9090AA;
      --text-dim: #606078;
      --cyan: #6EC8E4;
      --cyan-dim: rgba(110, 200, 228, 0.12);
      --pink: #E85DA0;
      --pink-dim: rgba(232, 93, 160, 0.12);
      --yellow: #E8D44C;
      --yellow-dim: rgba(232, 212, 76, 0.12);
      --success: #4ADE80;
      --success-dim: rgba(74, 222, 128, 0.10);
      --danger: #F87171;
      --danger-dim: rgba(248, 113, 113, 0.10);
      --purple: #A78BFA;
      --purple-dim: rgba(167, 139, 250, 0.10);
      --warn: #FBBF24;
      --warn-dim: rgba(251, 191, 36, 0.10);
      --sidebar-w: 230px;
      --radius: 14px;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    button, input, select, textarea { font: inherit; }

    /* ── LAYOUT ─────────────────────────── */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
      position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; z-index: 30;
    }
    .sidebar-header { padding: 18px 10px 14px; border-bottom: 1px solid var(--border); text-align: center; }
    .nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
    .nav-btn {
      width: 100%; border: none; background: transparent; color: var(--text-muted);
      border-radius: 8px; padding: 10px 13px; display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: .15s; text-align: left; margin-bottom: 2px; font-size: 13px;
    }
    .nav-btn:hover { background: var(--surface-alt); }
    .nav-btn.active { background: var(--cyan-dim); color: var(--cyan); font-weight: 700; }
    .sidebar-footer { border-top: 1px solid var(--border); padding: 14px; }
    .role-pill {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      font-size: 12px; font-weight: 800;
    }
    .main { margin-left: var(--sidebar-w); flex: 1; padding: 28px 36px; min-width: 0; }

    /* ── UI COMPONENTS ──────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 14px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; }

    .page-title { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin: 0; }
    .page-sub { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }
    .section-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

    .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; }
    .kpi-value { margin-top: 8px; font-size: 22px; font-family: 'Outfit', sans-serif; font-weight: 800; }
    .kpi-sub { margin-top: 4px; font-size: 11px; color: var(--text-dim); }

    .btn {
      border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; transition: .15s; font-size: 13px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--cyan); color: #0A0A0F; }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger-dim); color: var(--danger); }
    .btn-ghost { background: transparent; color: var(--text-muted); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .badge {
      display: inline-flex; padding: 2px 9px; border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: .3px;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block; margin-bottom: 4px; font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .5px; font-weight: 700;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 8px 11px; background: var(--surface-alt); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 13px;
    }
    .field textarea { min-height: 64px; resize: vertical; }
    .field input:focus, .field select:focus { border-color: var(--cyan); }
    .field-error { margin-top: 3px; font-size: 10px; color: var(--danger); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      padding: 11px 14px; text-align: left; color: var(--text-dim);
      font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
      background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    th.right, td.right { text-align: right; }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr { cursor: pointer; transition: background .1s; }
    tbody tr:hover { background: var(--surface-alt); }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-label { width: 90px; flex-shrink: 0; color: var(--text-muted); font-size: 11px; }
    .bar-track { flex: 1; height: 6px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; }
    .bar-value { min-width: 75px; text-align: right; font-size: 12px; font-weight: 700; }

    .empty { text-align: center; color: var(--text-dim); padding: 36px 10px; }
    .success { color: var(--success); }
    .danger { color: var(--danger); }
    .cyan { color: var(--cyan); }
    .pink { color: var(--pink); }
    .yellow { color: var(--yellow); }
    .purple { color: var(--purple); }
    .fw700 { font-weight: 700; }
    .mb20 { margin-bottom: 20px; }
    .mt10 { margin-top: 10px; }
    .gap10 { gap: 10px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }

    /* ── LOGIN ──────────────────────────── */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 30% 20%, var(--cyan-dim) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, var(--pink-dim) 0%, transparent 50%), var(--bg);
      padding: 20px;
    }
    .login-box { width: 100%; max-width: 420px; text-align: center; }
    .login-choice {
      width: 100%; text-align: left; padding: 15px 18px; border-radius: 10px; cursor: pointer;
      transition: .15s; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text);
      margin-bottom: 10px;
    }
    .login-choice.admin { background: var(--pink-dim); border-color: rgba(232,93,160,.25); }
    .login-choice:hover { transform: translateY(-1px); }

    /* ── TOAST ──────────────────────────── */
    .toast {
      position: fixed; top: 18px; right: 18px; z-index: 200;
      padding: 11px 18px; border-radius: 10px; background: var(--card);
      border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; max-width: 400px;
    }
    .toast.success { border-color: rgba(74,222,128,.3); color: var(--success); }
    .toast.error { border-color: rgba(248,113,113,.3); color: var(--danger); }
    .toast.warn { border-color: rgba(251,191,36,.3); color: var(--warn); }

    /* ── LOADING ────────────────────────── */
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(10,10,15,.85); z-index: 150;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--cyan); border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: 14px; }

    /* ── RESPONSIVE ─────────────────────── */
    @media (max-width: 1100px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      :root { --sidebar-w: 0px; }
      .sidebar { position: static; width: 100%; min-height: auto; }
      .app { flex-direction: column; }
      .main { margin-left: 0; padding: 18px; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   LA OPCIÓN PRODUCCIONES — GESTIÓN FINANCIERA
   HTML + JS puro · Google Sheets como fuente de verdad
   ════════════════════════════════════════════════════════════════ */

const API_URL = "https://script.google.com/macros/s/AKfycbyCwwMRxy6J4l1oqF9BqgvzHZ7DKSASqytV2B7anHsokG0VTraeTBLfTHXDEwS11uQDXQ/exec";

// ── STATE ────────────────────────────────────────────────────
const S = {
  role: null,
  view: 'dashboard',
  selectedId: null,
  search: '',
  toast: null,
  toastTimer: null,
  adminTab: 'platforms',
  summaryMonth: '',
  isLoading: false,
  isSaving: false,
  loadError: null,
  // Form states
  newShowDraft: null,
  editShowDraft: null,
  // Data from Google Sheets
  config: {
    platforms: [],
    venues: [],
    works: [],
    expenseTypes: [],
    agreements: [],
  },
  shows: [],
};

const $app = document.getElementById('app');

// ── UTILS ────────────────────────────────────────────────────
function gid() { return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 8); }
function fmt(n) { return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 }).format(Number(n || 0)); }
function fmtPct(n) { return `${Number(n || 0).toFixed(2)}%`; }
function r2(n) { return Math.round(Number(n || 0) * 100) / 100; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function showToast(message, type = 'success') {
  S.toast = { message, type };
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => { S.toast = null; render(); }, 3500);
  render();
}

function normalize(text) {
  return String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

// ── LOGO SVG ─────────────────────────────────────────────────
function logoSVG(w = 150) {
  const h = w * 0.55;
  return `<svg width="${w}" height="${h}" viewBox="0 0 280 154" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="140" y="68" text-anchor="middle" font-family="'Outfit','Arial Black',sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="var(--text)">LA OPCIÓN</text>
    <line x1="10" y1="82" x2="270" y2="82" stroke="var(--cyan)" stroke-width="4"/>
    <line x1="10" y1="92" x2="270" y2="92" stroke="var(--pink)" stroke-width="4"/>
    <line x1="10" y1="102" x2="270" y2="102" stroke="var(--yellow)" stroke-width="4"/>
    <text x="140" y="132" text-anchor="middle" font-family="'Outfit','Arial',sans-serif" font-size="22" font-weight="300" letter-spacing="12" fill="var(--text-muted)">PRODUCCIONES</text>
  </svg>`;
}

// ══════════════════════════════════════════════════════════════
// DATA ADAPTER: Sheet format → App format
// This is the KEY piece that was missing
// ══════════════════════════════════════════════════════════════
function sheetShowToAppShow(raw, config) {
  // The Sheet returns: { id, sala, obra, fecha, atrapalo, fever, kultur, abonoteatro,
  //   laopcion, universe, efectivo, tarjeta, ventaBruta, ventaNeta, totalGastos,
  //   totalNeto, cache, restanteLaOpcion, acuerdo, observaciones }

  // Find matching config entities by name
  const venue = config.venues.find(v => normalize(v.name) === normalize(raw.sala)) || null;
  const work = config.works.find(w => normalize(w.name) === normalize(raw.obra)) || null;
  const agreement = config.agreements.find(a => normalize(a.name) === normalize(raw.acuerdo)) || null;

  // Build platform snapshots from config + income data
  const platformSnapshots = {};
  const income = {};

  // Map sheet field names to platform ids
  const platMap = {
    'atrapalo': 'Atrápalo',
    'fever': 'Fever',
    'kultur': 'Kultur',
    'abonoteatro': 'Abonoteatro',
    'laopcion': 'Laopcion',
    'universe': 'Universe',
  };

  Object.entries(platMap).forEach(([sheetKey, platName]) => {
    const amt = Number(raw[sheetKey] || 0);
    const pl = config.platforms.find(p => normalize(p.name) === normalize(platName));
    if (pl) {
      income[pl.id] = amt;
      platformSnapshots[pl.id] = {
        name: pl.name,
        commission: pl.commission,
        ivaOnCommission: pl.ivaOnCommission,
        income: amt,
      };
    }
  });

  income.cashBox = Number(raw.efectivo || 0);
  income.cardBox = Number(raw.tarjeta || 0);

  return {
    id: raw.id || raw.appId || gid(),
    appId: raw.appId || raw.id || '',
    venueId: venue?.id || '',
    workId: work?.id || '',
    venueName: raw.sala || '',
    workName: raw.obra || '',
    date: raw.fecha || '',
    time: '',
    agreementId: agreement?.id || '',
    agreementSnapshot: agreement ? { name: agreement.name, mode: agreement.mode, value: agreement.value } : null,
    notes: raw.observaciones || '',
    income,
    platformSnapshots,
    expenses: [], // Manual expenses from sheet aren't individually tracked yet
    // Pre-calculated values from sheet (we use these for display if available)
    _sheetCalc: {
      ventaBruta: Number(raw.ventaBruta || 0),
      ventaNeta: Number(raw.ventaNeta || 0),
      totalGastos: Number(raw.totalGastos || 0),
      totalNeto: Number(raw.totalNeto || 0),
      cache: Number(raw.cache || 0),
      restanteLaOpcion: Number(raw.restanteLaOpcion || 0),
    },
    status: { ticketsSent: false, emailSent: false, invoiceSent: false, sentToAdmin: false, paymentDate: '' },
  };
}

// Reverse: App format → Sheet POST format (for saving)
function appShowToSheetData(show, config) {
  const ps = show.platformSnapshots || {};
  const inc = show.income || {};

  // Resolve platform amounts by name
  function findAmount(platName) {
    const pl = config.platforms.find(p => normalize(p.name) === normalize(platName));
    return pl ? Number(inc[pl.id] || ps[pl.id]?.income || 0) : 0;
  }

  // Resolve agreement
  const agr = show.agreementSnapshot;
  let cache = 0;
  if (agr) {
    const c = calcShow(show);
    cache = c.cache;
  }

  return {
    action: 'saveShow',
    appId: show.appId || show.id || gid(),
    sala: show.venueName || '',
    obra: show.workName || '',
    fecha: show.date || '',
    atrapalo: findAmount('Atrápalo'),
    fever: findAmount('Fever'),
    kultur: findAmount('Kultur'),
    abonoteatro: findAmount('Abonoteatro'),
    laopcion: findAmount('Laopcion'),
    universe: findAmount('Universe'),
    efectivo: Number(inc.cashBox || 0),
    tarjeta: Number(inc.cardBox || 0),
    autor: 0,
    otrosGastos: 0,
    alquiler: 0,
    cache: cache,
    acuerdo: agr?.name || '',
    observaciones: show.notes || '',
  };
}

// ══════════════════════════════════════════════════════════════
// CALCULATION ENGINE (matches spreadsheet: ventaNeta = bruta / 1.10)
// ══════════════════════════════════════════════════════════════
function calcShow(show) {
  const ps = show.platformSnapshots || {};
  const inc = show.income || {};

  const commissions = [];
  let totalPlatIncome = 0;
  let totalComm = 0;

  Object.entries(ps).forEach(([pid, snap]) => {
    const amt = r2(snap.income || 0);
    totalPlatIncome += amt;
    const base = r2(amt * snap.commission / 100);
    const iva = snap.ivaOnCommission ? r2(base * 0.21) : 0;
    const total = r2(base + iva);
    commissions.push({ id: pid, name: snap.name, income: amt, commBase: base, commIva: iva, commTotal: total });
    totalComm += total;
  });

  const cashBox = r2(parseFloat(inc.cashBox) || 0);
  const cardBox = r2(parseFloat(inc.cardBox) || 0);
  const ventaBruta = r2(totalPlatIncome + cashBox + cardBox);
  const ventaNeta = r2(ventaBruta / 1.10);
  const manualExp = (show.expenses || []).reduce((s, e) => s + r2(parseFloat(e.amount) || 0), 0);
  const totalGastos = r2(totalComm + manualExp);
  const totalNeto = r2(ventaNeta - totalGastos);

  const agr = show.agreementSnapshot;
  let cache = 0;
  if (agr) {
    if (agr.mode === 'percentage') cache = r2(totalNeto * agr.value / 100);
    else cache = r2(agr.value);
  }
  const restanteOpcion = r2(totalNeto - cache);

  return { commissions, cashBox, cardBox, ventaBruta, ventaNeta, totalComm: r2(totalComm), manualExp: r2(manualExp), totalGastos, totalNeto, cache, restanteOpcion, agreement: agr };
}

// ══════════════════════════════════════════════════════════════
// API CALLS (Google Sheets via Apps Script)
// ══════════════════════════════════════════════════════════════
async function apiGet(action = 'getAll') {
  const url = `${API_URL}?action=${action}&t=${Date.now()}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Error desconocido');
  return data;
}

async function apiPost(payload) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // Apps Script needs text/plain for CORS
    body: JSON.stringify(payload),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Error al guardar');
  return data;
}

// ══════════════════════════════════════════════════════════════
// SYNC: Load everything from Google Sheets
// ══════════════════════════════════════════════════════════════
async function loadFromSheet() {
  S.isLoading = true;
  S.loadError = null;
  render();

  try {
    const data = await apiGet('getAll');

    // Config
    if (data.config) {
      S.config.platforms = data.config.platforms || [];
      S.config.venues = data.config.venues || [];
      S.config.works = data.config.works || [];
      S.config.expenseTypes = data.config.expenseTypes || [];
      S.config.agreements = data.config.agreements || [];
    }

    // Shows: transform from sheet format to app format
    if (data.shows && Array.isArray(data.shows)) {
      S.shows = data.shows.map(raw => sheetShowToAppShow(raw, S.config));
    }

    // Set default summary month
    if (S.shows.length > 0 && !S.summaryMonth) {
      const months = [...new Set(S.shows.map(s => (s.date || '').slice(0, 7)).filter(Boolean))].sort().reverse();
      S.summaryMonth = months[0] || '';
    }

    console.log(`[SYNC] Loaded ${S.config.platforms.length} platforms, ${S.config.venues.length} venues, ${S.config.works.length} works, ${S.shows.length} shows`);
  } catch (err) {
    console.error('[SYNC] Error:', err);
    S.loadError = err.message;
    showToast('Error al cargar datos: ' + err.message, 'error');
  }

  S.isLoading = false;
  render();
}

async function saveShowToSheet(show) {
  if (S.isSaving) return; // Anti-duplicate: block while saving
  S.isSaving = true;
  render();

  try {
    const payload = appShowToSheetData(show, S.config);
    await apiPost(payload);
    showToast('Función guardada correctamente', 'success');
    // Reload fresh data
    await loadFromSheet();
    S.view = 'shows';
    S.newShowDraft = null;
  } catch (err) {
    console.error('[SAVE] Error:', err);
    showToast('Error al guardar: ' + err.message, 'error');
  }

  S.isSaving = false;
  render();
}

async function saveConfigToSheet() {
  if (S.isSaving) return;
  S.isSaving = true;
  render();

  try {
    await apiPost({ action: 'saveConfig', config: S.config });
    showToast('Configuración guardada', 'success');
    await loadFromSheet();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  }

  S.isSaving = false;
  render();
}

// ══════════════════════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════════════════════
function render() {
  if (!S.role) {
    $app.innerHTML = renderLogin();
    bindLogin();
    return;
  }

  let toastHtml = '';
  if (S.toast) {
    toastHtml = `<div class="toast ${S.toast.type}">${esc(S.toast.message)}</div>`;
  }

  let loadingHtml = '';
  if (S.isLoading) {
    loadingHtml = `<div class="loading-overlay"><div class="spinner"></div><div class="loading-text">Cargando datos del Sheet...</div></div>`;
  }
  if (S.isSaving) {
    loadingHtml = `<div class="loading-overlay"><div class="spinner"></div><div class="loading-text">Guardando...</div></div>`;
  }

  $app.innerHTML = `
    <div class="app">
      ${renderSidebar()}
      <div class="main">${renderView()}</div>
    </div>
    ${toastHtml}
    ${loadingHtml}
  `;
  bindEvents();
}

// ── LOGIN ────────────────────────────────────────────────────
function renderLogin() {

        <div style="margin-bottom:36px">${logoSVG(220)}</div>

function bindLogin() {
  document.querySelectorAll('.login-choice').forEach(btn => {
    btn.onclick = () => {
      S.role = btn.dataset.role;
      S.view = 'dashboard';
      render();
      loadFromSheet(); // Load data on login
    };
  });
}

// ── VIEW ROUTER ──────────────────────────────────────────────
function renderView() {
  switch (S.view) {
    case 'dashboard': return renderDashboard();
    case 'shows': return renderShowList();
    case 'newshow': return renderNewShow();
    case 'detail': return renderShowDetail();
    case 'summary': return renderSummary();
    case 'admin': return renderAdmin();
    default: return '<p>Vista no encontrada</p>';
  }
}

// ══════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════
function renderDashboard() {
  if (S.shows.length === 0 && !S.isLoading) {
    return `
      <h1 class="page-title">Dashboard</h1>
      <p class="page-sub mb20">La Opción Producciones</p>
      <div class="card"><div class="empty">
        <p style="font-size:16px;margin-bottom:8px">Sin datos todavía</p>
        <p style="color:var(--text-dim);font-size:13px">Los datos se cargan desde Google Sheets. Si es la primera vez, registra una función.</p>
        <button class="btn btn-primary mt10" data-action="refresh">🔄 Recargar datos</button>
      </div></div>
    `;
  }

  const cs = S.shows.map(s => ({ ...s, c: calcShow(s) }));
  const t = cs.reduce((a, s) => ({
    vb: a.vb + s.c.ventaBruta, vn: a.vn + s.c.ventaNeta, g: a.g + s.c.totalGastos,
    tn: a.tn + s.c.totalNeto, ca: a.ca + s.c.cache, ro: a.ro + s.c.restanteOpcion,
  }), { vb: 0, vn: 0, g: 0, tn: 0, ca: 0, ro: 0 });

  // Platform bars
  const pm = {};
  cs.forEach(s => s.c.commissions.forEach(c => { pm[c.name] = (pm[c.name] || 0) + c.income; }));
  const taq = cs.reduce((s, sh) => s + sh.c.cashBox + sh.c.cardBox, 0);
  const pe = Object.entries(pm).sort(([,a],[,b]) => b - a);
  const mx = Math.max(...pe.map(([,v]) => v), taq, 1);

  const barsHtml = pe.map(([name, total]) =>
    `<div class="bar-row">
      <span class="bar-label">${esc(name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(total/mx*100).toFixed(1)}%;background:var(--cyan)"></div></div>
      <span class="bar-value">${fmt(total)}</span>
    </div>`
  ).join('') + `
    <div class="bar-row" style="padding-top:8px;border-top:1px solid var(--border);margin-top:6px">
      <span class="bar-label">Taquilla</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(taq/mx*100).toFixed(1)}%;background:var(--success)"></div></div>
      <span class="bar-value">${fmt(taq)}</span>
    </div>`;

  // Recent shows table
  const sorted = cs.sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 10);
  const rowsHtml = sorted.map(s => {
    const statusCount = [s.status?.ticketsSent, s.status?.emailSent, s.status?.invoiceSent, s.status?.sentToAdmin].filter(Boolean).length;
    const roColor = s.c.restanteOpcion >= 0 ? 'success' : 'danger';
    return `<tr data-show-id="${s.id}">
      <td>${esc(s.date)}</td><td>${esc(s.workName)}</td><td>${esc(s.venueName)}</td>
      <td class="right">${fmt(s.c.ventaBruta)}</td>
      <td class="right">${fmt(s.c.totalNeto)}</td>
      <td class="right fw700 ${roColor}">${fmt(s.c.restanteOpcion)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="section-top">
      <div><h1 class="page-title">Dashboard</h1><p class="page-sub">La Opción Producciones · ${S.shows.length} funciones</p></div>
      <button class="btn btn-secondary btn-sm" data-action="refresh">🔄 Actualizar</button>
    </div>

    <div class="grid grid-kpis mb20">
      <div class="card"><div class="kpi-label">Venta Bruta</div><div class="kpi-value cyan">${fmt(t.vb)}</div><div class="kpi-sub">${S.shows.length} funciones</div></div>
      <div class="card"><div class="kpi-label">Venta Neta</div><div class="kpi-value purple">${fmt(t.vn)}</div></div>
      <div class="card"><div class="kpi-label">Total Gastos</div><div class="kpi-value danger">${fmt(t.g)}</div></div>
      <div class="card"><div class="kpi-label">Total Neto</div><div class="kpi-value yellow">${fmt(t.tn)}</div></div>
      <div class="card"><div class="kpi-label">Caché Salas</div><div class="kpi-value pink">${fmt(t.ca)}</div></div>
      <div class="card"><div class="kpi-label">Restante La Opción</div><div class="kpi-value success">${fmt(t.ro)}</div></div>
    </div>

    <div class="grid grid-2 mb20">
      <div class="card"><h3>Ventas por plataforma</h3>${barsHtml}</div>
      <div class="card"><h3>Últimas funciones</h3>
        <div class="table-wrap">
          <table><thead><tr><th>Fecha</th><th>Obra</th><th>Sala</th><th class="right">V.Bruta</th><th class="right">T.Neto</th><th class="right">Restante</th></tr></thead>
          <tbody>${rowsHtml || '<tr><td colspan="6" class="empty">Sin funciones</td></tr>'}</tbody></table>
        </div>
      </div>
    </div>
  `;
}

function renderShowDetail() {

  const c = calcShow(show);
  const isA = S.role === 'admin';

  // Income breakdown
  const incomeRows = c.commissions.filter(x => x.income > 0).map(x =>
    `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:13px">${esc(x.name)}</div>
        ${isA ? `<div style="font-size:10px;color:var(--text-dim)">Com: ${fmt(x.commBase)}${x.commIva > 0 ? ` +IVA ${fmt(x.commIva)}` : ''} = ${fmt(x.commTotal)}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div style="font-size:13px;font-weight:700;color:var(--cyan)">${fmt(x.income)}</div>
        ${isA ? `<div style="font-size:10px;color:var(--danger)">-${fmt(x.commTotal)}</div>` : ''}
      </div>

  ).join('');

  const cashRows = [];
  if (c.cashBox > 0) cashRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Taquilla efectivo</span><span class="fw700 success">${fmt(c.cashBox)}</span></div>`);
  if (c.cardBox > 0) cashRows.push(`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px"><span>Taquilla tarjeta</span><span class="fw700 success">${fmt(c.cardBox)}</span></div>`);

  const kpiCols = isA ? 'repeat(6,1fr)' : 'repeat(3,1fr)';
  const roColor = c.restanteOpcion >= 0 ? 'success' : 'danger';

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn btn-ghost" data-view="shows">←</button>
        <div>
          <h1 class="page-title" style="font-size:22px">${esc(show.workName)}</h1>
          <p class="page-sub">${esc(show.venueName)} · ${esc(show.date)}</p>
        </div>
      </div>
    </div>

    <div class="grid mb20" style="grid-template-columns:${kpiCols}">
      <div class="card"><div class="kpi-label">V. Bruta</div><div class="kpi-value cyan" style="font-size:20px">${fmt(c.ventaBruta)}</div></div>
      ${isA ? `<div class="card"><div class="kpi-label">V. Neta</div><div class="kpi-value purple" style="font-size:20px">${fmt(c.ventaNeta)}</div></div>` : ''}
      ${isA ? `<div class="card"><div class="kpi-label">Gastos</div><div class="kpi-value danger" style="font-size:20px">${fmt(c.totalGastos)}</div></div>` : ''}
      <div class="card"><div class="kpi-label">Total Neto</div><div class="kpi-value yellow" style="font-size:20px">${fmt(c.totalNeto)}</div></div>

      <div class="card"><div class="kpi-label">Restante La Opción</div><div class="kpi-value ${roColor}" style="font-size:20px">${fmt(c.restanteOpcion)}</div></div>
    </div>

    <div class="grid grid-2 mb20">
      <div class="card">
        <h3>Ingresos por plataforma</h3>
        ${incomeRows}

      </div>
      <div class="card">
        <h3>Reparto (${esc(c.agreement?.name || '—')})</h3>
        <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px"><span style="color:var(--text-muted)">Total Neto</span><span class="fw700">${fmt(c.totalNeto)}</span></div>

          <span>Restante La Opción</span><span class="${roColor}">${fmt(c.restanteOpcion)}</span>

}

// ══════════════════════════════════════════════════════════════
// NEW SHOW FORM (role-aware)

// ══════════════════════════════════════════════════════════════
// MONTHLY SUMMARY (matches spreadsheet format)
// ══════════════════════════════════════════════════════════════
function renderSummary() {
  const months = [...new Set(S.shows.map(s => (s.date||'').slice(0, 7)).filter(Boolean))].sort().reverse();
  const selMonth = S.summaryMonth || months[0] || '';

  const monthOpts = months.map(m => `<option value="${m}" ${m === selMonth ? 'selected' : ''}>${m}</option>`).join('');

  const cs = S.shows.filter(s => (s.date||'').startsWith(selMonth)).map(s => ({ ...s, c: calcShow(s) }));

  // Group by work
  const byWork = {};
  cs.forEach(s => {
    const k = s.workName || 'Sin obra';
    if (!byWork[k]) byWork[k] = { work: k, venue: s.venueName, ingreso: 0, coste: 0, beneficio: 0 };
    byWork[k].ingreso += s.c.totalNeto;
    byWork[k].coste += s.c.cache;
    byWork[k].beneficio += s.c.restanteOpcion;
  });
  const rows = Object.values(byWork);
  const totI = rows.reduce((s, r) => s + r.ingreso, 0);
  const totC = rows.reduce((s, r) => s + r.coste, 0);
  const totB = rows.reduce((s, r) => s + r.beneficio, 0);
  rows.forEach(r => { r.pct = totB !== 0 ? r2(r.beneficio / totB * 100) : 0; });
  const totPct = totI !== 0 ? r2(totB / totI * 100) : 0;

  const tableRows = rows.map(r => {
    const bColor = r.beneficio >= 0 ? 'success' : 'danger';
    return `<tr>
      <td>${esc(r.venue)}</td><td>${esc(r.work)}</td>
      <td class="right">${fmt(r.ingreso)}</td><td class="right">${fmt(r.coste)}</td>
      <td class="right fw700 ${bColor}">${fmt(r.beneficio)}</td>
      <td class="right">${fmtPct(r.pct)}</td>
    </tr>`;
  }).join('');

  // Platform summary
  const platTotals = {};
  cs.forEach(s => {
    s.c.commissions.forEach(c => { platTotals[c.name] = (platTotals[c.name] || 0) + c.income; });
    platTotals['Taq. Efectivo'] = (platTotals['Taq. Efectivo'] || 0) + s.c.cashBox;
    platTotals['Taq. Tarjeta'] = (platTotals['Taq. Tarjeta'] || 0) + s.c.cardBox;
  });
  const platCards = Object.entries(platTotals).sort(([,a],[,b]) => b - a).map(([name, total]) =>
    `<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:14px 16px">
      <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px">${esc(name)}</div>
      <div style="font-size:18px;font-family:'Outfit',sans-serif;font-weight:800;color:var(--cyan)">${fmt(total)}</div>
    </div>`
  ).join('');

  return `
    <h1 class="page-title">Resumen Mensual</h1>
    <p class="page-sub mb20">Visión por obra y plataforma</p>

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px">
      <span style="color:var(--text-dim)">📅</span>
      <select data-bind="summaryMonth" style="padding:8px 12px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px">
        ${monthOpts}
      </select>
      <span style="font-size:12px;color:var(--text-dim)">${cs.length} funciones</span>
    </div>

    <div class="card mb20">
      <h3>Resumen por obra</h3>
      <div class="table-wrap">
        <table><thead><tr><th>Sala</th><th>Obra</th><th class="right">Ingreso</th><th class="right">Coste CIA</th><th class="right">Beneficios</th><th class="right">%</th></tr></thead>
        <tbody>${tableRows || '<tr><td colspan="6" class="empty">Sin datos</td></tr>'}</tbody></table>
      </div>
      ${rows.length > 0 ? `
      <div style="display:flex;justify-content:flex-end;gap:24px;padding:12px 14px 0;border-top:2px solid rgba(110,200,228,.2);margin-top:10px">
        <span style="font-size:12px;color:var(--text-muted)">TOTAL</span>
        <span style="font-size:12px;font-weight:700;min-width:80px;text-align:right">${fmt(totI)}</span>
        <span style="font-size:12px;font-weight:700;min-width:80px;text-align:right">${fmt(totC)}</span>
        <span style="font-size:12px;font-weight:700;min-width:80px;text-align:right;color:var(--success)">${fmt(totB)}</span>
        <span style="font-size:12px;font-weight:700;min-width:50px;text-align:right;color:var(--cyan)">${fmtPct(totPct)}</span>
      </div>` : ''}
    </div>

    <div class="card">
      <h3>Resumen por plataforma</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${platCards || '<div class="empty">Sin datos</div>'}</div>
    </div>
  `;
}

// ══════════════════════════════════════════════════════════════
// ADMIN
// ══════════════════════════════════════════════════════════════
function renderAdmin() {
  if (S.role !== 'admin') return '<div class="card"><div class="empty">Acceso denegado</div></div>';

  const tabs = [
    { id: 'platforms', label: 'Plataformas' },
    { id: 'venues', label: 'Salas' },
    { id: 'works', label: 'Obras' },
    { id: 'agreements', label: 'Acuerdos' },
    { id: 'expenses', label: 'Gastos' },
  ];
  const tabBtns = tabs.map(t =>
    `<button class="btn ${S.adminTab === t.id ? 'btn-primary' : 'btn-ghost'} btn-sm" data-admin-tab="${t.id}">${t.label}</button>`
  ).join('');

  let content = '';
  const tab = S.adminTab;

  if (tab === 'platforms') {
    const rows = S.config.platforms.map(p =>
      `<tr>
        <td>${esc(p.name)}</td><td>${p.commission}%</td>
        <td>${p.ivaOnCommission ? '<span class="badge" style="background:var(--pink-dim);color:var(--pink)">Sí</span>' : 'No'}</td>
        <td>${p.active !== false ? '<span class="badge" style="background:var(--success-dim);color:var(--success)">Activa</span>' : '<span class="badge" style="background:var(--surface-alt);color:var(--text-dim)">Inactiva</span>'}</td>
      </tr>`
    ).join('');
    content = `<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Comisión</th><th>IVA</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p style="margin-top:12px;font-size:12px;color:var(--text-dim)">Para editar, modifica en Administración → Google Sheets (hoja CONFIG) y recarga.</p>`;
  } else if (tab === 'venues') {
    const rows = S.config.venues.map(v =>
      `<tr><td>${esc(v.name)}</td><td>${v.active !== false ? '<span class="badge" style="background:var(--success-dim);color:var(--success)">Activa</span>' : 'Inactiva'}</td></tr>`
    ).join('');
    content = `<div class="table-wrap"><table><thead><tr><th>Sala</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (tab === 'works') {
    const rows = S.config.works.map(w =>
      `<tr><td>${esc(w.name)}</td><td>${w.active !== false ? '<span class="badge" style="background:var(--success-dim);color:var(--success)">Activa</span>' : 'Inactiva'}</td><td>${S.shows.filter(s => s.workId === w.id).length || '—'}</td></tr>`
    ).join('');
    content = `<div class="table-wrap"><table><thead><tr><th>Obra</th><th>Estado</th><th>Funciones</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (tab === 'agreements') {
    const rows = S.config.agreements.map(a =>
      `<tr><td>${esc(a.name)}</td><td>${a.mode === 'percentage' ? '<span class="badge" style="background:var(--cyan-dim);color:var(--cyan)">%</span>' : '<span class="badge" style="background:var(--pink-dim);color:var(--pink)">Fijo</span>'}</td><td>${a.mode === 'percentage' ? a.value + '%' : fmt(a.value)}</td><td>${a.active !== false ? 'Activo' : 'Inactivo'}</td></tr>`
    ).join('');
    content = `<div class="table-wrap"><table><thead><tr><th>Acuerdo</th><th>Tipo</th><th>Valor</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (tab === 'expenses') {
    const rows = S.config.expenseTypes.map(e =>
      `<tr><td>${esc(e.name)}</td><td>${e.active !== false ? 'Activo' : 'Inactivo'}</td></tr>`
    ).join('');
    content = `<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  return `
    <div class="section-top">
      <div><h1 class="page-title">Administración</h1><p class="page-sub">Configuración desde Google Sheets</p></div>
      <button class="btn btn-secondary btn-sm" data-action="refresh">🔄 Recargar config</button>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap">${tabBtns}</div>
    ${content}
    <p style="margin-top:16px;font-size:12px;color:var(--text-dim)">ℹ️ La configuración se gestiona en la hoja CONFIG del Google Sheet. Usa el botón "Recargar" para ver cambios.</p>
  `;
}

// ══════════════════════════════════════════════════════════════
// EVENT BINDING
// ══════════════════════════════════════════════════════════════
function bindEvents() {
  // Nav buttons
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.onclick = () => { S.view = btn.dataset.view; S.selectedId = null; render(); };
  });

  // Actions
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const action = btn.dataset.action;
      if (action === 'logout') { S.role = null; S.view = 'dashboard'; S.selectedId = null; S.newShowDraft = null; render(); }
      if (action === 'refresh') { loadFromSheet(); }
      if (action === 'saveNewShow') { handleSaveNewShow(); }
    };
  });

  // Admin tabs
  document.querySelectorAll('[data-admin-tab]').forEach(btn => {
    btn.onclick = () => { S.adminTab = btn.dataset.adminTab; render(); };
  });

  // Search binding
  const searchInput = document.querySelector('[data-bind="search"]');
  if (searchInput) {
    searchInput.oninput = () => { S.search = searchInput.value; render(); };
  }

  // Summary month
  const summarySelect = document.querySelector('[data-bind="summaryMonth"]');
  if (summarySelect) {
    summarySelect.onchange = () => { S.summaryMonth = summarySelect.value; render(); };
  }

  // Show row clicks
  document.querySelectorAll('[data-show-id]').forEach(tr => {
    tr.onclick = () => { S.selectedId = tr.dataset.showId; S.view = 'detail'; render(); };
  });

  // New show form fields
  document.querySelectorAll('[data-field]').forEach(el => {
    el.onchange = el.oninput = () => {
      if (!S.newShowDraft) S.newShowDraft = { workId: '', venueId: '', date: '', time: '', agreementId: '', notes: '', income: {} };
      S.newShowDraft[el.dataset.field] = el.value;
    };
  });

  // Platform income fields
  document.querySelectorAll('[data-plat-id]').forEach(el => {
    el.onchange = el.oninput = () => {
      if (!S.newShowDraft) S.newShowDraft = { workId: '', venueId: '', date: '', time: '', agreementId: '', notes: '', income: {} };
      S.newShowDraft.income[el.dataset.platId] = el.value;
    };
  });
}

// ── SAVE NEW SHOW ────────────────────────────────────────────
function handleSaveNewShow() {
  const d = S.newShowDraft;
  if (!d) return showToast('Rellena el formulario', 'error');
  if (!d.workId) return showToast('Selecciona una obra', 'error');
  if (!d.venueId) return showToast('Selecciona una sala', 'error');
  if (!d.date) return showToast('Introduce una fecha', 'error');

  // Build full show object
  const work = S.config.works.find(w => w.id === d.workId);
  const venue = S.config.venues.find(v => v.id === d.venueId);
  const agreement = S.config.agreements.find(a => a.id === d.agreementId);

  const income = {};
  S.config.platforms.forEach(p => {
    income[p.id] = parseFloat(d.income[p.id]) || 0;
  });
  income.cashBox = parseFloat(d.income.cashBox) || 0;
  income.cardBox = parseFloat(d.income.cardBox) || 0;

  // Check for negatives
  if (Object.values(income).some(v => v < 0)) return showToast('No se admiten importes negativos', 'error');

  const show = {
    id: gid(),
    appId: gid(),
    workId: d.workId,
    venueId: d.venueId,
    workName: work?.name || '',
    venueName: venue?.name || '',
    date: d.date,
    time: d.time || '',
    agreementId: d.agreementId || '',
    agreementSnapshot: agreement ? { name: agreement.name, mode: agreement.mode, value: agreement.value } : null,
    notes: d.notes || '',
    income,
    platformSnapshots: {},
    expenses: [],
    status: {},
  };

  // Build snapshots
  S.config.platforms.forEach(p => {
    show.platformSnapshots[p.id] = {
      name: p.name, commission: p.commission, ivaOnCommission: p.ivaOnCommission,
      income: income[p.id] || 0,
    };
  });

  // Save to Google Sheet
  saveShowToSheet(show);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
render();
</script>
