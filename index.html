<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Opción Producciones</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0A0A0F;
      --surface: #111118;
      --surface-alt: #16161F;
      --card: #1A1A24;
      --border: #2A2A3A;
      --border-light: #35354A;
      --text: #EEEEF4;
      --text-muted: #9090AA;
      --text-dim: #606078;
      --cyan: #6EC8E4;
      --cyan-dim: rgba(110, 200, 228, 0.12);
      --pink: #E85DA0;
      --pink-dim: rgba(232, 93, 160, 0.12);
      --yellow: #E8D44C;
      --yellow-dim: rgba(232, 212, 76, 0.12);
      --success: #4ADE80;
      --success-dim: rgba(74, 222, 128, 0.10);
      --danger: #F87171;
      --danger-dim: rgba(248, 113, 113, 0.10);
      --purple: #A78BFA;
      --purple-dim: rgba(167, 139, 250, 0.10);
      --warn: #FBBF24;
      --warn-dim: rgba(251, 191, 36, 0.10);
      --sidebar: 230px;
      --radius: 14px;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', 'Segoe UI', sans-serif; }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; }

    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar);
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      display: flex; flex-direction: column; z-index: 30;
    }
    .sidebar-header {
      padding: 18px 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
    .nav-btn {
      width: 100%; border: none; background: transparent; color: var(--text-muted);
      border-radius: 8px; padding: 10px 13px; display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: .15s; text-align: left; margin-bottom: 2px;
    }
    .nav-btn:hover { background: var(--surface-alt); }
    .nav-btn.active { background: var(--cyan-dim); color: var(--cyan); font-weight: 700; }
    .sidebar-footer { border-top: 1px solid var(--border); padding: 14px; }
    .role-box { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .role-pill {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      font-size: 12px; font-weight: 800;
    }
    .main { margin-left: var(--sidebar); flex: 1; padding: 28px 36px; min-width: 0; }

    .page-title { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; margin: 0; }
    .page-subtitle { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }
    .section-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 14px; font-family: 'Outfit', sans-serif; font-size: 15px; }
    
    .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; }
    .kpi-value { margin-top: 8px; font-size: 24px; font-family: 'Outfit', sans-serif; font-weight: 800; }
    .kpi-sub { margin-top: 4px; font-size: 11px; color: var(--text-dim); }

    .btn {
      border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; transition: .15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--cyan); color: #0A0A0F; }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
    
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 4px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); border-radius: 8px; outline: none; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--cyan); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 11px 14px; text-align: left; color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr:hover { background: var(--surface-alt); }

    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 30% 20%, var(--cyan-dim) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, var(--pink-dim) 0%, transparent 50%), var(--bg); padding: 20px; }
    .login-box { width: 100%; max-width: 440px; text-align: center; }
    .login-choice { width: 100%; text-align: left; padding: 16px 18px; border-radius: 12px; cursor: pointer; transition: .15s; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); margin-bottom: 10px; }
    .login-choice.admin { background: var(--pink-dim); border-color: rgba(232,93,160,.25); }

    .toast { position: fixed; top: 18px; right: 18px; z-index: 100; padding: 12px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 13px; transition: all 0.3s ease; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .toast.loading { border-color: var(--purple); color: var(--purple); }

    .empty { text-align: center; color: var(--text-dim); padding: 30px 10px; }
    .loading-overlay { display: flex; justify-content: center; align-items: center; padding: 40px; color: var(--text-muted); font-weight: 500; }

    @media (max-width: 1100px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    @media (max-width: 900px) { :root { --sidebar: 0px; } .sidebar { position: static; width: 100%; min-height: auto; } .app { flex-direction: column; } .main { margin-left: 0; padding: 20px; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCwwMRxy6J4l1oqF9BqgvzHZ7DKSASqytV2B7anHsokG0VTraeTBLfTHXDEwS11uQDXQ/exec";

    // --- ESTADO CENTRALIZADO ---
    const state = {
      role: null, // 'admin' | 'usuario'
      view: 'dashboard', // 'dashboard' | 'registrar' | 'historial' | 'config'
      isLoading: false,
      isSaving: false,
      toast: null,
      toastTimer: null,
      
      // Datos puros de negocio unificados
      config: {
        platforms: [],
        venues: [],
        works: [],
        expenseTypes: [],
        agreements: []
      },
      shows: [], // Listado unificado transformado por el adaptador

      // Formulario de captura
      formData: {
        appId: '',
        fecha: new Date().toISOString().split('T')[0],
        sala: '',
        obra: '',
        acuerdo: '',
        observaciones: '',
        // Canales de ingreso manuales
        atrapalo: 0, fever: 0, kultur: 0, abonoteatro: 0, laopcion: 0, universe: 0, efectivo: 0, tarjeta: 0,
        // Gastos operativos manuales
        autor: 0, alquiler: 0, otrosGastos: 0
      }
    };

    // --- DATA ADAPTERS (Capa de traducción Sheet <-> App) ---
    const DataAdapter = {
      /**
       * Transforma la respuesta cruda de Google Sheets a la estructura limpia usada por la UI.
       */
      sheetShowToApp(sheetShow) {
        return {
          id: sheetShow.appId || sheetShow.id,
          appId: sheetShow.appId || sheetShow.id,
          venueName: sheetShow.sala || 'Sala Desconocida',
          workName: sheetShow.obra || 'Obra Desconocida',
          fecha: sheetShow.fecha || '',
          income: {
            atrapalo: Number(sheetShow.atrapalo || 0),
            fever: Number(sheetShow.fever || 0),
            kultur: Number(sheetShow.kultur || 0),
            abonoteatro: Number(sheetShow.abonoteatro || 0),
            laopcion: Number(sheetShow.laopcion || 0),
            universe: Number(sheetShow.universe || 0),
            efectivo: Number(sheetShow.efectivo || 0),
            tarjeta: Number(sheetShow.tarjeta || 0)
          },
          expenses: {
            autor: Number(sheetShow.autor || 0),
            alquiler: Number(sheetShow.alquiler || 0),
            otrosGastos: Number(sheetShow.otrosGastos || 0)
          },
          metrics: {
            ventaBruta: Number(sheetShow.ventaBruta || 0),
            ventaNeta: Number(sheetShow.ventaNeta || 0),
            totalGastos: Number(sheetShow.totalGastos || 0),
            totalNeto: Number(sheetShow.totalNeto || 0),
            cache: Number(sheetShow.cache || 0),
            restanteLaOpcion: Number(sheetShow.restanteLaOpcion || 0)
          },
          agreementName: sheetShow.acuerdo || '',
          observaciones: sheetShow.observaciones || ''
        };
      },

      /**
       * Prepara los datos reactivos del formulario de la UI al payload exacto esperado por Apps Script.
       */
      appFormToSheetPayload(form) {
        return {
          action: "saveShow",
          appId: form.appId || 'op-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now(),
          fecha: form.fecha,
          sala: form.sala,
          obra: form.obra,
          acuerdo: form.acuerdo,
          observaciones: form.observaciones,
          atrapalo: Number(form.atrapalo || 0),
          fever: Number(form.fever || 0),
          kultur: Number(form.kultur || 0),
          abonoteatro: Number(form.abonoteatro || 0),
          laopcion: Number(form.laopcion || 0),
          universe: Number(form.universe || 0),
          efectivo: Number(form.efectivo || 0),
          tarjeta: Number(form.tarjeta || 0),
          autor: Number(form.autor || 0),
          alquiler: Number(form.alquiler || 0),
          otrosGastos: Number(form.otrosGastos || 0)
        };
      }
    };

    // --- COMUNICACIÓN CON LA API (Única fuente de verdad) ---
    async function apiFetch(params = '') {
      const url = `${GOOGLE_SCRIPT_URL}${params ? '?' + params : ''}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      const resData = await response.json();
      if (!resData.ok) throw new Error(resData.error || "Error indeterminado del Backend");
      return resData;
    }

    async function apiPost(payload) {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Evita preflight previene bugs de redirección de macros
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(`HTTP Post Error: ${response.status}`);
      const resData = await response.json();
      if (!resData.ok) throw new Error(resData.error || "Error al procesar escritura en Google Sheets");
      return resData;
    }

    // --- ACCIONES CORE ---
    async function sincronizarTodo() {
      if (state.isLoading) return;
      state.isLoading = true;
      showToast("Sincronizando con Google Sheets...", "loading");
      render();

      try {
        const data = await apiFetch("action=getAll");
        
        // Mapeo seguro de configuraciones unificadas
        state.config.platforms = data.config.platforms || [];
        state.config.venues = data.config.venues || [];
        state.config.works = data.config.works || [];
        state.config.expenseTypes = data.config.expenseTypes || [];
        state.config.agreements = data.config.agreements || []; // Unificado: config.agreements siempre

        // Parseo adaptado de funciones/shows
        if (data.shows && Array.isArray(data.shows)) {
          state.shows = data.shows.map(show => DataAdapter.sheetShowToApp(show));
        } else {
          state.shows = [];
        }

        showToast("Datos actualizados en tiempo real");
      } catch (err) {
        console.error(err);
        showToast(`Error de Sincronización: ${err.message}`, "error");
      } finally {
        state.isLoading = false;
        render();
      }
    }

    async function guardarShow(e) {
      e.preventDefault();
      if (state.isSaving) return; // Control anti-doble clic en UI
      
      state.isSaving = true;
      showToast("Procesando y calculando en Google Sheets...", "loading");
      render();

      try {
        const payload = DataAdapter.appFormToSheetPayload(state.formData);
        await apiPost(payload);
        
        showToast("¡Guardado e indexado con éxito!");
        resetForm();
        state.view = 'dashboard';
        
        // Refresco inmediato post-save directo del backend para garantizar sincronía total
        await sincronizarTodo();
      } catch (err) {
        console.error(err);
        showToast(`Error al guardar: ${err.message}`, "error");
        state.isSaving = false;
        render();
      }
    }

    // --- REUTILIZABLES Y UTILS ---
    function showToast(message, type = 'success') {
      state.toast = { message, type };
      clearTimeout(state.toastTimer);
      if (type !== 'loading') {
        state.toastTimer = setTimeout(() => { state.toast = null; render(); }, 4000);
      }
      render();
    }

    function resetForm() {
      state.formData = {
        appId: '',
        fecha: new Date().toISOString().split('T')[0],
        sala: '', obra: '', acuerdo: '', observaciones: '',
        atrapalo: 0, fever: 0, kultur: 0, abonoteatro: 0, laopcion: 0, universe: 0, efectivo: 0, tarjeta: 0,
        autor: 0, alquiler: 0, otrosGastos: 0
      };
      state.isSaving = false;
    }

    function setView(viewName) {
      state.view = viewName;
      if (viewName === 'registrar') resetForm();
      render();
    }

    function login(role) {
      state.role = role;
      sincronizarTodo();
    }

    function logout() {
      state.role = null;
      state.shows = [];
      render();
    }

    function handleFormInput(field, val) {
      state.formData[field] = val;
    }

    function fmt(n) {
      return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(Number(n || 0));
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // --- COMPONENTES DE INTERFAZ (UI RENDERING) ---
    function render() {
      if (!state.role) {
        renderLogin();
        return;
      }

      let html = `
        <div class="app">
          <aside class="sidebar">
            <div class="sidebar-header">
              <h2 style="font-family:'Outfit',sans-serif;font-weight:900;letter-spacing:-1px;margin:0;color:var(--cyan)">LA OPCIÓN</h2>
            </div>
            <nav class="nav">
              <button class="nav-btn ${state.view === 'dashboard' ? 'active' : ''}" onclick="setView('dashboard')">📊 Dashboard</button>
              <button class="nav-btn ${state.view === 'registrar' ? 'active' : ''}" onclick="setView('registrar')">➕ Registrar Función</button>
              <button class="nav-btn ${state.view === 'historial' ? 'active' : ''}" onclick="setView('historial')">📜 Historial Real</button>
            </nav>
            <div class="sidebar-footer">
              <div class="role-box">
                <div class="role-pill" style="background:${state.role === 'admin' ? 'var(--pink)' : 'var(--cyan)'};color:#000">
                  ${state.role[0].toUpperCase()}
                </div>
                <div>
                  <div style="font-size:12px;font-weight:700">${state.role === 'admin' ? 'Administrador' : 'Usuario'}</div>
                  <div style="font-size:10px;color:var(--text-dim)">online</div>
                </div>
              </div>
              <button class="btn btn-secondary btn-sm" style="width:100%" onclick="logout()">Cerrar Sesión</button>
            </div>
          </aside>

          <main class="main">
            <div class="section-top">
              <div>
                <h1 class="page-title">${getPageTitle()}</h1>
                <p class="page-subtitle">Fuente única de verdad activa: Google Sheets</p>
              </div>
              <div class="top-actions">
                <button class="btn btn-secondary" onclick="sincronizarTodo()" ${state.isLoading || state.isSaving ? 'disabled' : ''}>
                  ${state.isLoading ? 'Sincronizando...' : '🔄 Forzar Sincronización'}
                </button>
              </div>
            </div>
      `;

      if (state.isLoading && state.shows.length === 0) {
        html += `<div class="loading-overlay">⏳ Cargando ecosistema de teatros desde la nube...</div>`;
      } else {
        if (state.view === 'dashboard') html += renderDashboard();
        else if (state.view === 'registrar') html += renderRegistrarForm();
        else if (state.view === 'historial') html += renderHistorial();
      }

      html += `
          </main>
        </div>
        ${renderToast()}
      `;

      app.innerHTML = html;
    }

    function renderLogin() {
      app.innerHTML = `
        <div class="login-screen">
          <div class="card login-box">
            <h1 style="font-family:'Outfit',sans-serif;font-size:32px;font-weight:900;margin-bottom:6px;color:var(--cyan)">LA OPCIÓN</h1>
            <p style="color:var(--text-muted);font-size:14px;margin-top:0;margin-bottom:24px;">Gestión de Producciones Teatrales</p>
            <button class="login-choice admin" onclick="login('admin')">
              <div style="font-weight:700;font-size:15px;color:var(--pink)">Acceso Administrador (Full Admin)</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Gestión, configuraciones y vista consolidada.</div>
            </button>
            <button class="login-choice" onclick="login('usuario')">
              <div style="font-weight:700;font-size:15px;color:var(--cyan)">Acceso Taquilla Rapida (Usuario)</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Ingreso de funciones de salas asignadas.</div>
            </button>
          </div>
        </div>
      `;
    }

    function getPageTitle() {
      if (state.view === 'dashboard') return 'Métricas de Producción';
      if (state.view === 'registrar') return 'Registrar Liquidación';
      if (state.view === 'historial') return 'Historial Único (Sheets)';
      return 'La Opción';
    }

    function renderToast() {
      if (!state.toast) return '';
      return `<div class="toast ${state.toast.type}">${esc(state.toast.message)}</div>`;
    }

    function renderDashboard() {
      // Cálculos globales rápidos sobre los shows sincronizados reales
      let totalBruto = 0, totalNeto = 0, totalLaOpcion = 0;
      state.shows.forEach(s => {
        totalBruto += s.metrics.ventaBruta;
        totalNeto += s.metrics.totalNeto;
        totalLaOpcion += s.metrics.restanteLaOpcion;
      });

      return `
        <div class="grid grid-kpis" style="margin-bottom:24px;">
          <div class="card">
            <div class="kpi-label">Venta Bruta Sincronizada</div>
            <div class="kpi-value cyan">${fmt(totalBruto)}</div>
            <div class="kpi-sub">Suma total de taquillas</div>
          </div>
          <div class="card">
            <div class="kpi-label">Total Neto (Post Gastos/Canal)</div>
            <div class="kpi-value purple">${fmt(totalNeto)}</div>
            <div class="kpi-sub">Disponibilidad real</div>
          </div>
          <div class="card">
            <div class="kpi-label">Margen Limpio "La Opción"</div>
            <div class="kpi-value" style="color:var(--success)">${fmt(totalLaOpcion)}</div>
            <div class="kpi-sub">Neto menos cachés de compañías</div>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <h3>Últimas Funciones Impactadas en Sheets</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Obra / Sala</th>
                    <th>Ingreso Neto</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.shows.slice(0, 5).map(s => `
                    <tr>
                      <td>${esc(s.fecha)}</td>
                      <td><strong>${esc(s.workName)}</strong><br><span style="color:var(--text-dim);font-size:11px;">${esc(s.venueName)}</span></td>
                      <td style="color:var(--success);font-weight:600">${fmt(s.metrics.totalNeto)}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="3" class="empty">No hay datos en las pestañas mensuales del Sheet.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <h3>Estado del Ecosistema de Configuración</h3>
            <p style="font-size:13px;color:var(--text-muted)">Validado en tiempo real desde la pestaña <strong>CONFIG</strong> de tu Google Sheet:</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
              <span class="btn btn-secondary btn-sm" style="cursor:default">🎭 ${state.config.works.length} Obras</span>
              <span class="btn btn-secondary btn-sm" style="cursor:default">🏛️ ${state.config.venues.length} Salas</span>
              <span class="btn btn-secondary btn-sm" style="cursor:default">🎟️ ${state.config.platforms.length} Plataformas</span>
              <span class="btn btn-secondary btn-sm" style="cursor:default">📜 ${state.config.agreements.length} Acuerdos</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderRegistrarForm() {
      // Filtrar catálogos activos
      const activeVenues = state.config.venues.filter(v => v.active);
      const activeWorks = state.config.works.filter(w => w.active);
      const activeAgreements = state.config.agreements.filter(a => a.active);

      return `
        <form onsubmit="guardarShow(e)" id="showForm">
          <div class="grid grid-3" style="margin-bottom:16px;">
            <div class="card">
              <h3 style="color:var(--cyan)">1. Datos del Evento</h3>
              <div class="field">
                <label>Fecha de la Función</label>
                <input type="date" value="${state.formData.fecha}" onchange="handleFormInput('fecha', this.value)" required ${state.isSaving ? 'disabled' : ''}>
              </div>
              <div class="field">
                <label>Sala / Teatro</label>
                <select onchange="handleFormInput('sala', this.value)" required ${state.isSaving ? 'disabled' : ''}>
                  <option value="">-- Seleccionar Sala --</option>
                  ${activeVenues.map(v => `<option value="${esc(v.name)}" ${state.formData.sala === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Obra</label>
                <select onchange="handleFormInput('obra', this.value)" required ${state.isSaving ? 'disabled' : ''}>
                  <option value="">-- Seleccionar Obra --</option>
                  ${activeWorks.map(w => `<option value="${esc(w.name)}" ${state.formData.obra === w.name ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Acuerdo COMERCIAL (Compañía)</label>
                <select onchange="handleFormInput('acuerdo', this.value)" required ${state.isSaving ? 'disabled' : ''}>
                  <option value="">-- Seleccionar Acuerdo --</option>
                  ${activeAgreements.map(a => `<option value="${esc(a.name)}" ${state.formData.acuerdo === a.name ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="card">
              <h3 style="color:var(--yellow)">2. Desglose de Ventas (Brutos)</h3>
              <div style="max-height:360px; overflow-y:auto; padding-right:4px;">
                <div class="field"><label>Atrápalo (€)</label><input type="number" step="0.01" value="${state.formData.atrapalo}" oninput="handleFormInput('atrapalo', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Fever (€)</label><input type="number" step="0.01" value="${state.formData.fever}" oninput="handleFormInput('fever', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Kultur (€)</label><input type="number" step="0.01" value="${state.formData.kultur}" oninput="handleFormInput('kultur', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Abonoteatro (€)</label><input type="number" step="0.01" value="${state.formData.abonoteatro}" oninput="handleFormInput('abonoteatro', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>La Opción (€)</label><input type="number" step="0.01" value="${state.formData.laopcion}" oninput="handleFormInput('laopcion', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Universe (€)</label><input type="number" step="0.01" value="${state.formData.universe}" oninput="handleFormInput('universe', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Taquilla Efectivo (€)</label><input type="number" step="0.01" value="${state.formData.efectivo}" oninput="handleFormInput('efectivo', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Taquilla Tarjeta (€)</label><input type="number" step="0.01" value="${state.formData.tarjeta}" oninput="handleFormInput('tarjeta', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
              </div>
            </div>

            <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;">
              <div>
                <h3 style="color:var(--pink)">3. Gastos Operativos Manuales</h3>
                <div class="field"><label>Autor (€)</label><input type="number" step="0.01" value="${state.formData.autor}" oninput="handleFormInput('autor', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Alquiler Sala (€)</label><input type="number" step="0.01" value="${state.formData.alquiler}" oninput="handleFormInput('alquiler', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Otros Gastos (€)</label><input type="number" step="0.01" value="${state.formData.otrosGastos}" oninput="handleFormInput('otrosGastos', this.value)" ${state.isSaving ? 'disabled' : ''}></div>
                <div class="field"><label>Observaciones</label><textarea oninput="handleFormInput('observaciones', this.value)" ${state.isSaving ? 'disabled' : ''}>${esc(state.formData.observaciones)}</textarea></div>
              </div>
              
              <div style="margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="width:100%; padding:14px;" ${state.isSaving ? 'disabled' : ''}>
                  ${state.isSaving ? '⏳ Procesando en Sheets...' : '💾 Registrar e Inyectar en Sheet'}
                </button>
              </div>
            </div>
          </div>
        </form>
      `;
    }

    function renderHistorial() {
      return `
        <div class="card">
          <h3>Todas las Funciones Sincronizadas (Orden Descendente)</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Lectura dinámica multiplataforma mapeada correctamente.</p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Sala / Teatro</th>
                  <th>Obra</th>
                  <th>Venta Bruta</th>
                  <th>Venta Neta (1.10)</th>
                  <th>Total Gastos</th>
                  <th>Neto Final</th>
                  <th>Caché Cía</th>
                  <th>La Opción</th>
                  <th>Acuerdo</th>
                </tr>
              </thead>
              <tbody>
                ${state.shows.map(s => `
                  <tr>
                    <td><strong>${esc(s.fecha)}</strong></td>
                    <td>${esc(s.venueName)}</td>
                    <td><span class="badge" style="background:var(--cyan-dim);color:var(--cyan);font-size:12px;">${esc(s.workName)}</span></td>
                    <td>${fmt(s.metrics.ventaBruta)}</td>
                    <td>${fmt(s.metrics.ventaNeta)}</td>
                    <td style="color:var(--danger)">${fmt(s.metrics.totalGastos)}</td>
                    <td style="font-weight:700">${fmt(s.metrics.totalNeto)}</td>
                    <td style="color:var(--purple)">${fmt(s.metrics.cache)}</td>
                    <td style="color:var(--success);font-weight:700">${fmt(s.metrics.restanteLaOpcion)}</td>
                    <td><span style="font-size:11px;color:var(--text-muted)">${esc(s.agreementName)}</span></td>
                  </tr>
                `).join('') || '<tr><td colspan="10" class="empty">No existen registros en las pestañas de datos del Google Sheet.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Interceptar el evento global submit para evitar recargas nativas erróneas
    window.addEventListener('submit', function(e) {
      if(e.target && e.target.id === 'showForm') {
        guardarShow(e);
      }
    });

    // --- ENTRADA AUTOMÁTICA DE INICIALIZACIÓN ---
    // Inicializar app en vista Login limpia
    render();
  </script>
</body>
</html>
